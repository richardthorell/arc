name: Set Up Slang
description: Install and expose the pinned Slang compiler used by ARC shader tooling.

runs:
  using: composite
  steps:
    - name: Install Slang 2026.14.1 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        version=2026.14.1
        archive="$RUNNER_TEMP/slang-${version}.tar.gz"
        root="$RUNNER_TEMP/slang-${version}"
        rm -rf "$root"
        mkdir -p "$root"
        curl --fail --location --retry 3 \
          "https://github.com/shader-slang/slang/releases/download/v${version}/slang-${version}-linux-x86_64.tar.gz" \
          --output "$archive"
        tar -xzf "$archive" -C "$root"
        slangc="$(find "$root" -type f -name slangc -print -quit)"
        if [[ -z "$slangc" || ! -x "$slangc" ]]; then
          echo "Pinned slangc executable was not found under $root"
          exit 1
        fi
        version_output="$("$slangc" -version 2>&1)"
        printf '%s\n' "$version_output"
        grep -Eq '(^|[^0-9.])2026\.14\.1([^0-9.]|$)' <<<"$version_output"
        echo "ARC_SLANGC_EXECUTABLE=$slangc" >> "$GITHUB_ENV"
        echo "$(dirname "$slangc")" >> "$GITHUB_PATH"

    - name: Install Slang 2026.14.1 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '2026.14.1'
        $archive = Join-Path $env:RUNNER_TEMP "slang-${version}.zip"
        $root = Join-Path $env:RUNNER_TEMP "slang-${version}"
        $url = "https://github.com/shader-slang/slang/releases/download/v${version}/slang-${version}-windows-x86_64.zip"

        if (Test-Path $root) { Remove-Item $root -Recurse -Force }
        & curl.exe --fail --location --retry 3 $url --output $archive
        if ($LASTEXITCODE -ne 0) { throw "Failed to download pinned Slang ${version}" }
        Expand-Archive -Path $archive -DestinationPath $root -Force

        $slangc = Get-ChildItem -Path $root -Recurse -File -Filter slangc.exe | Select-Object -First 1
        if (-not $slangc) { throw "Pinned slangc.exe was not found under $root" }
        $versionOutput = (& $slangc.FullName -version 2>&1 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) { throw "Pinned slangc failed its version check" }
        Write-Host $versionOutput
        if ($versionOutput -notmatch '(^|[^0-9.])2026\.14\.1([^0-9.]|$)') {
          throw "Expected Slang 2026.14.1, got: $versionOutput"
        }

        "ARC_SLANGC_EXECUTABLE=$($slangc.FullName)" >> $env:GITHUB_ENV
        $slangc.DirectoryName >> $env:GITHUB_PATH
