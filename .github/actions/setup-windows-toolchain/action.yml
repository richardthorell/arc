name: Set Up Windows Toolchain
description: Configure MSVC, sccache, Vulkan, and the pinned Slang compiler for Windows CI jobs.

runs:
  using: composite
  steps:
    - name: Set Up MSVC
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $installationPath) { throw "Visual Studio with the x64 C++ toolchain was not found" }
        $devCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
        & cmd.exe /s /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" |
          ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
            }
          }

    # Compiler caching is an optimization, not a build requirement.
    # GitHub release asset downloads for sccache can fail with HTTP 504.
    - name: Enable available compiler cache (optional)
      shell: pwsh
      run: |
        $cache = Get-Command sccache -ErrorAction SilentlyContinue
        if ($cache) {
          "CMAKE_C_COMPILER_LAUNCHER=$($cache.Source)" >> $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=$($cache.Source)" >> $env:GITHUB_ENV
          "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> $env:GITHUB_ENV
          & $cache.Source --zero-stats
          Write-Host "Using preinstalled sccache compiler cache."
        } else {
          Write-Host "No preinstalled sccache found; compiling directly with MSVC."
        }

    - name: Set Up Vulkan SDK 1.4.350.0
      uses: ./.github/actions/setup-vulkan

    - name: Set Up Slang 2026.14.1
      uses: ./.github/actions/setup-slang
