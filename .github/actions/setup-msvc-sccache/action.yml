name: Set up MSVC sccache
description: Install and enable the pinned sccache toolchain for CMake/MSVC builds.

runs:
  using: composite
  steps:
    - name: Install sccache 0.17.0
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.17.0

    - name: Enable sccache for CMake
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_VERSION=arc-msvc-windows-v2" >> "$GITHUB_ENV"
        echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"
          echo "MSVC sccache: read-only PR mode; reusing the cache warmed by main."
        else
          echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"
          echo "MSVC sccache: read-write trusted mode; warming the shared cache."
        fi
