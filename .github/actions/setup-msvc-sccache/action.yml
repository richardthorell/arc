name: Set up MSVC sccache
description: Install and enable the pinned sccache toolchain for CMake/MSVC builds.

runs:
  using: composite
  steps:
    - name: Install sccache 0.17.0
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.17.0

    - name: Enable sccache for CMake
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
