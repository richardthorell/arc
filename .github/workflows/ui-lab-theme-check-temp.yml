name: UI Lab Theme Check Temp

on:
  push:
    branches:
      - feature/ui-lab-expanded-controls

permissions:
  contents: write

jobs:
  validate-theme-picker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/ui-lab-expanded-controls

      - name: Set Up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install Electron Dependencies
        run: npm ci --prefix editor

      - name: Format UI Lab Theme Files
        working-directory: editor
        run: >-
          npx prettier --write
          src/renderer/src/themeRegistry.ts
          src/renderer/src/uiLab/UiLab.test.tsx
          src/renderer/src/uiLab/UiLabThemePicker.tsx
          src/renderer/src/uiLab/UiLabThemePicker.test.tsx
          src/renderer/src/uiLab/UiLabWindow.tsx
          src/renderer/src/uiLab/uiLabWindow.css

      - name: Commit Formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/themeRegistry.ts editor/src/renderer/src/uiLab/UiLab.test.tsx editor/src/renderer/src/uiLab/UiLabThemePicker.tsx editor/src/renderer/src/uiLab/UiLabThemePicker.test.tsx editor/src/renderer/src/uiLab/UiLabWindow.tsx editor/src/renderer/src/uiLab/uiLabWindow.css
          git commit -m "Format UI Lab theme picker"
          git push origin HEAD:feature/ui-lab-expanded-controls

      - name: Check UI Lab Theme Formatting
        working-directory: editor
        run: >-
          npx prettier --check
          src/renderer/src/themeRegistry.ts
          src/renderer/src/uiLab/UiLab.test.tsx
          src/renderer/src/uiLab/UiLabThemePicker.tsx
          src/renderer/src/uiLab/UiLabThemePicker.test.tsx
          src/renderer/src/uiLab/UiLabWindow.tsx
          src/renderer/src/uiLab/uiLabWindow.css

      - name: Lint UI Lab Theme Files
        working-directory: editor
        run: >-
          npx eslint
          src/renderer/src/themeRegistry.ts
          src/renderer/src/uiLab/UiLab.test.tsx
          src/renderer/src/uiLab/UiLabThemePicker.tsx
          src/renderer/src/uiLab/UiLabThemePicker.test.tsx
          src/renderer/src/uiLab/UiLabWindow.tsx
          --max-warnings 0

      - name: Typecheck Editor
        working-directory: editor
        run: npm run typecheck

      - name: Test UI Lab
        working-directory: editor
        run: >-
          npx vitest run
          src/renderer/src/uiLab/UiLab.test.tsx
          src/renderer/src/uiLab/UiLabThemePicker.test.tsx
          --pool=threads
          --maxWorkers=1
