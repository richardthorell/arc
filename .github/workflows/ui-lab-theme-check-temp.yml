name: UI Lab Theme Check Temp

on:
  push:
    branches:
      - feature/ui-lab-expanded-controls

jobs:
  validate-theme-picker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set Up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install Electron Dependencies
        run: npm ci --prefix editor

      - name: Check Theme Picker Formatting
        working-directory: editor
        run: >-
          npx prettier --check
          src/renderer/src/themeRegistry.ts
          src/renderer/src/uiLab/UiLabThemePicker.tsx
          src/renderer/src/uiLab/UiLabThemePicker.test.tsx
          src/renderer/src/uiLab/UiLabWindow.tsx
          src/renderer/src/uiLab/uiLabWindow.css

      - name: Lint Theme Picker
        working-directory: editor
        run: >-
          npx eslint
          src/renderer/src/themeRegistry.ts
          src/renderer/src/uiLab/UiLabThemePicker.tsx
          src/renderer/src/uiLab/UiLabThemePicker.test.tsx
          src/renderer/src/uiLab/UiLabWindow.tsx
          --max-warnings 0

      - name: Typecheck Editor
        working-directory: editor
        run: npm run typecheck

      - name: Test Editor
        working-directory: editor
        run: npm test
