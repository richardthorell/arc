name: PR Regenerate Built-in Shaders

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate Built-in Shaders
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Pull Request Head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set Up Vulkan SDK 1.4.350.0
        uses: ./.github/actions/setup-vulkan
      - name: Regenerate Built-in Shader Header
        run: |
          python3 tools/compile_builtin_shaders.py \
            --source-root assets/shaders \
            --output-dir out/generated/shaders \
            --header engine/render-vulkan/src/builtin_shaders.h \
            --glslc glslc \
            --spirv-val spirv-val \
            --write
      - name: Commit Generated Header
        run: |
          if git diff --quiet -- engine/render-vulkan/src/builtin_shaders.h; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render-vulkan/src/builtin_shaders.h
          git commit -m "Regenerate built-in shaders"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
