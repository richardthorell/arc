name: PR Regenerate Built-in Shaders

on:
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate Built-in Shaders
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Up Vulkan SDK 1.4.350.0
        uses: ./.github/actions/setup-vulkan
      - name: Regenerate Built-in Shader Header
        run: |
          python3 tools/compile_builtin_shaders.py \
            --source-root assets/shaders \
            --output-dir out/generated/shaders \
            --header engine/render-vulkan/src/builtin_shaders.h \
            --glslc glslc \
            --spirv-val spirv-val \
            --write
      - name: Upload Generated Header
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-builtin-shaders
          path: engine/render-vulkan/src/builtin_shaders.h
