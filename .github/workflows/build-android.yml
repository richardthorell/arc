name: Android Native Host

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'tools/ecs_codegen.py'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Android arm64 NDK / APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Pinned Android Toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set Up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android arm64 Debug APK
        working-directory: engine/platform/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: arc-android-arm64-debug
          path: engine/platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
