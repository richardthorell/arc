name: Android Native Host

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'tools/ecs_codegen.py'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Android arm64 NDK / APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Pinned Android Toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu runners already ship Android SDK cmdline-tools. Avoid
          # setup-android@v3, which tries to install removed SDK package "tools".
          test -n "${ANDROID_HOME:-}"
          # Runner SDK tools live under cmdline-tools/<version>/bin and are
          # not guaranteed to be exported to PATH.
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            echo "::error::Android SDK command-line tools not found beneath $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set Up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Build Android arm64 Debug APK
        working-directory: engine/platform/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arc-android-arm64-debug
          path: engine/platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
