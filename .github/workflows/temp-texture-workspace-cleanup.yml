name: Temp Texture Workspace Cleanup

on:
  push:
    branches: [feat/texture-editor-view]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/texture-editor-view
          fetch-depth: 0
      - name: Fix texture workspace chrome and stale layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dock = Path('editor/src/renderer/src/layout/WorkspaceDock.tsx')
          text = dock.read_text()
          old = """const editorWorkspaceStorageKey = (projectKey: string, kind: EditorDocumentKind) =>\n  storageKey(projectKey, `editor-${kind}`);\n"""
          new = """const editorWorkspaceStorageKey = (projectKey: string, kind: EditorDocumentKind) =>\n  storageKey(projectKey, kind === 'texture' ? 'editor-texture-v2' : `editor-${kind}`);\n"""
          if old not in text:
              raise SystemExit('editor workspace storage key block not found')
          dock.write_text(text.replace(old, new, 1))

          css = Path('editor/src/renderer/src/layout/WorkspaceDock.css')
          text = css.read_text()
          old = """.workbench-shell .workspace-dock-shell-editor-shader .workspace-dock {\n  --dv-tabs-and-actions-container-height: 0px;\n}\n\n.workbench-shell .workspace-dock-shell-editor-shader .workspace-dock .dv-tabs-and-actions-container {\n  display: none;\n}\n"""
          new = """.workbench-shell .workspace-dock-shell-editor-shader .workspace-dock,\n.workbench-shell .workspace-dock-shell-editor-texture .workspace-dock {\n  --dv-tabs-and-actions-container-height: 0px;\n}\n\n.workbench-shell .workspace-dock-shell-editor-shader .workspace-dock .dv-tabs-and-actions-container,\n.workbench-shell .workspace-dock-shell-editor-texture .workspace-dock .dv-tabs-and-actions-container {\n  display: none;\n}\n"""
          if old not in text:
              raise SystemExit('asset editor dock chrome CSS block not found')
          css.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temp-texture-workspace-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor/src/renderer/src/layout/WorkspaceDock.tsx editor/src/renderer/src/layout/WorkspaceDock.css .github/workflows/temp-texture-workspace-cleanup.yml
          git commit -m 'Fix texture editor workspace chrome'
          git push origin HEAD:feat/texture-editor-view
