name: Model Editor Layout Runner

on:
  push:
    branches:
      - feat/skeleton-model-workflow

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply layout changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('editor/src/renderer/src/layout/WorkspaceDock.tsx')
          text = workspace.read_text()
          old = "if (kind === 'shader' || kind === 'material' || kind === 'texture') {"
          new = "if (\n    kind === 'shader' ||\n    kind === 'material' ||\n    kind === 'texture' ||\n    kind === 'model' ||\n    kind === 'skeleton'\n  ) {"
          if old not in text:
              raise SystemExit('WorkspaceDock pattern not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '// Asset editors own the complete document workspace. Shader, Material, and Texture\n    // currently compose their document-specific supporting regions internally,',
              '// Asset editors own the complete document workspace. Shader, Material, Texture,\n    // Model, and Skeleton compose their document-specific supporting regions internally,',
              1,
          )
          workspace.write_text(text)

          model = Path('editor/src/renderer/src/model/ModelEditor.tsx')
          text = model.read_text()
          text = text.replace("import { UiButton } from '../ui';", "import { UiButton, UiPanel } from '../ui';", 1)
          text = text.replace(
              '      <aside className="model-editor-sidebar">',
              '      <UiPanel\n        aria-label="Model details"\n        className="model-editor-sidebar editor-property-panel"\n        role="complementary"\n        variant="inspector"\n      >',
              1,
          )
          text = text.replace('      </aside>\n    </div>\n', '      </UiPanel>\n    </div>\n', 1)
          model.write_text(text)

          css = Path('editor/src/renderer/src/model/modelEditor.css')
          text = css.read_text()
          old = ".model-editor-sidebar {\n  border-left: 1px solid var(--border-subtle, #2b3138);\n  background: var(--surface-1, #171b20);\n  min-width: 0;\n  overflow: auto;\n}\n"
          new = ".model-editor-sidebar {\n  min-width: 0;\n  height: 100%;\n  border: 0;\n  border-left: 1px solid var(--border-subtle, #2b3138);\n  border-radius: 0;\n  overflow: auto;\n}\n"
          if old not in text:
              raise SystemExit('modelEditor.css pattern not found')
          css.write_text(text.replace(old, new, 1))
          PY
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Format
        working-directory: editor
        run: npx prettier --write src/renderer/src/layout/WorkspaceDock.tsx src/renderer/src/model/ModelEditor.tsx src/renderer/src/model/modelEditor.css
      - name: Test
        working-directory: editor
        run: |
          npm test -- --run src/renderer/src/model/modelSubassets.test.ts src/renderer/src/editors/modelEditorRegistration.test.ts src/renderer/src/editors/editorRegistry.test.ts
          npm run typecheck
      - name: Commit
        run: |
          rm .github/workflows/model-editor-layout-runner.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use asset editor workspace for model and skeleton"
          git push
