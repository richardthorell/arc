TEST_CASE("Flow F6.1 accepts only normalized Content-relative graph paths")
{
    using arc::editor::valid_flow_graph_path;
    REQUIRE(valid_flow_graph_path("Logic/Player.arcflow"));
    REQUIRE_FALSE(valid_flow_graph_path(""));
    REQUIRE_FALSE(valid_flow_graph_path("../Player.arcflow"));
    REQUIRE_FALSE(valid_flow_graph_path("Logic\\Player.arcflow"));
    REQUIRE_FALSE(valid_flow_graph_path("Logic/../Player.arcflow"));
    REQUIRE_FALSE(valid_flow_graph_path("Logic/Player.json"));
}

TEST_CASE("Flow F6.1 shares bytecode and keeps one VM per Play entity")
{
    const auto content = temporary_content_root();
    write_empty_flow(content / "Logic" / "Shared.arcflow");

    flow_test_application app;
    arc::framework::runtime host(app);
    auto& runtime_world = host.worlds().create({.name = "Flow Test",
                                                 .role = arc::framework::runtime_world_role::editor_preview,
                                                 .install_placeholder_systems = false});
    for (int index = 0; index < 2; ++index)
    {
        const auto entity = runtime_world.entities().create();
        runtime_world.entities().emplace<arc::scene::active_component>(entity);
        runtime_world.entities().emplace<arc::scene::flow_component>(
            entity, arc::scene::flow_component{"Logic/Shared.arcflow", true});
    }

    const auto installed = arc::editor::install_flow_play_runtime(runtime_world, content);
    REQUIRE(installed.succeeded);
    REQUIRE(installed.instances == 2);
    REQUIRE(installed.unique_programs == 1);
    REQUIRE(runtime_world.systems().size() == 2);

    host.start();
    const auto frame = host.advance(1.0 / 60.0);
    REQUIRE(frame.completed_ticks == 1);
    host.shutdown();

    std::error_code error;
    std::filesystem::remove_all(content, error);
}

TEST_CASE("Flow F6.1 rejects missing authored graphs before Play starts")
{
    const auto content = temporary_content_root();
    flow_test_application app;
    arc::framework::runtime host(app);
    auto& runtime_world = host.worlds().create({.name = "Missing Flow",
                                                 .role = arc::framework::runtime_world_role::editor_preview,
                                                 .install_placeholder_systems = false});
    const auto entity = runtime_world.entities().create();
    runtime_world.entities().emplace<arc::scene::flow_component>(
        entity, arc::scene::flow_component{"Logic/Missing.arcflow", true});

    const auto installed = arc::editor::install_flow_play_runtime(runtime_world, content);
    REQUIRE_FALSE(installed.succeeded);
    REQUIRE_FALSE(installed.error.empty());

    std::error_code error;
    std::filesystem::remove_all(content, error);
}
''')

          # Documentation.
          write('docs/flow-play-integration.md', r'''# Flow Play integration

Flow F6.1 binds authored `.arcflow` graphs to scene entities through the `Flow` component.
The component stores a normalized path relative to the project's `Content` directory and an enabled flag.

When Play starts, ARC clones the Authoring World first, then scans the isolated Play World for enabled Flow bindings.
Each unique graph path is read and compiled once into immutable Flow bytecode. Every bound entity receives its own
`vm_instance`, so graph variables and value slots never leak between entities that share the same graph asset.

`Begin Play` is dispatched after project-module BeginPlay and before the runtime world starts. Fixed simulation ticks
and physical input events run in the gameplay-command phase; frame `Tick` runs in presentation extraction. `End Play`
runs when the Play runtime world releases its Flow systems. All Flow world operations use the stable M3.5
`game_world_api_v1` bridge and therefore preserve normal scheduler command-buffer boundaries.

F6.1 exposes deterministic physical input action tokens until the higher-level input action-map layer is connected:
`Key.<code>`, `MouseButton.<code>`, `MouseWheel`, and `Focus`. Presses dispatch Triggered and releases dispatch Completed.
Mouse position changes are not Flow actions.

The binding set is established at Play start. Runtime-created entities do not automatically instantiate newly attached
Flow components in F6.1; that hot-instantiation lifecycle is intentionally left to a later Flow milestone.
''')
