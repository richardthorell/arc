name: Fix PR 185 prettier

on:
  push:
    branches:
      - fix/default-white-infinite-grid
    paths:
      - .github/workflows/fix-pr185-cook-prettier.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/default-white-infinite-grid

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0

      - name: Prettify RenderGraphPanel
        working-directory: editor
        run: npx --yes prettier@3.9.6 --write src/renderer/src/renderGraph/RenderGraphPanel.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/renderGraph/RenderGraphPanel.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "Format render graph panel"
            git push origin HEAD:fix/default-white-infinite-grid
          fi
