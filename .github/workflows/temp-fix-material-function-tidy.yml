name: Temp Fix Material Function Tidy

on:
  push:
    branches:
      - feature/material-shader-functions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/material-shader-functions
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Fix changed-file clang-tidy findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = '''
          std::string concatenate(std::initializer_list<std::string_view> parts)
          {
              std::size_t size{};
              for (const auto part : parts)
                  size += part.size();
              std::string result;
              result.reserve(size);
              for (const auto part : parts)
                  result.append(part);
              return result;
          }
          '''

          path = Path("engine/render-tools/src/common/material_function.cpp")
          text = path.read_text()
          text = text.replace("#include <algorithm>\n", "#include <algorithm>\n#include <cstddef>\n#include <initializer_list>\n", 1)
          marker = '''shader_compile_error validation_error(std::string message)
          {
              return {.code = shader_compile_error_code::validation_failed, .message = std::move(message)};
          }
          '''
          if marker not in text:
              raise RuntimeError("validation_error marker not found")
          text = text.replace(marker, marker + helper, 1)
          lines = text.splitlines()
          out = []
          skip = 0
          hits = set()
          for line in lines:
              if skip:
                  skip -= 1
                  continue
              indent = line[:len(line) - len(line.lstrip())]
              if 'validation_error(label + " references unknown function input' in line:
                  out.append(indent + 'validation_error(concatenate({label, " references unknown function input \'", input, "\'"})));')
                  hits.add("unknown-input")
              elif 'validation_error(label + " writes unknown function output' in line:
                  out.append(indent + 'validation_error(concatenate({label, " writes unknown function output \'", target_pin, "\'"})));')
                  hits.add("unknown-function-output")
              elif '"Material Function call \'" + call_id + "\' has an invalid or duplicate input' in line:
                  out.append(indent + 'concatenate({"Material Function call \'", call_id, "\' has an invalid or duplicate input \'", pin, "\'"})));')
                  hits.add("duplicate-input")
              elif 'validation_error("Material Function call \'" + call_id +' in line and 'references unknown output' not in line:
                  # This is the first of the two lines for the unknown-output diagnostic.
                  out.append(indent + 'validation_error(concatenate({"Material Function call \'", call_id, "\' references unknown output \'", pin, "\'"})));')
                  skip = 1
                  hits.add("unknown-call-output")
              elif '"Material Function call \'" + call_id + "\' uses unconnected output' in line:
                  out.append(indent + 'concatenate({"Material Function call \'", call_id, "\' uses unconnected output \'", pin, "\'"})));')
                  hits.add("unconnected-output")
              else:
                  out.append(line.replace('call_id + "::" + target_node', 'concatenate({call_id, "::", target_node})'))
                  if 'call_id + "::" + target_node' in line:
                      hits.add("target-node")
          expected = {"unknown-input", "unknown-function-output", "duplicate-input", "unknown-call-output", "target-node", "unconnected-output"}
          if hits != expected:
              raise RuntimeError(f"material_function replacements mismatch: got {sorted(hits)}, expected {sorted(expected)}")
          path.write_text("\n".join(out) + "\n")

          path = Path("engine/render-tools/src/common/material_graph_ir.cpp")
          text = path.read_text()
          text = text.replace("#include <cstddef>\n", "#include <cstddef>\n#include <initializer_list>\n", 1)
          marker = "using json = nlohmann::json;\n"
          if marker not in text:
              raise RuntimeError("material_graph_ir namespace marker not found")
          text = text.replace(marker, marker + helper, 1)
          old1 = '.message = "Material Function call \'" + source + "\' has no output pin \'" + source_pin + "\'"});'
          new1 = '.message = concatenate({"Material Function call \'", source, "\' has no output pin \'", source_pin, "\'"})});'
          old2 = '.message = "Material Function call \'" + target + "\' has no input pin \'" + target_pin + "\'"});'
          new2 = '.message = concatenate({"Material Function call \'", target, "\' has no input pin \'", target_pin, "\'"})});'
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise RuntimeError("material_graph_ir diagnostic replacements not found")
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text)

          path = Path("tools/asset_cooker/material_processor.cpp")
          text = path.read_text()
          text = text.replace("std::string normalized_path(std::filesystem::path path)",
                              "std::string normalized_path(const std::filesystem::path& path)", 1)
          text = text.replace("std::filesystem::path assets_root_for(std::filesystem::path source_path)",
                              "std::filesystem::path assets_root_for(const std::filesystem::path& source_path)", 1)
          lines = text.splitlines()
          out = []
          replaced = False
          index = 0
          while index < len(lines):
              line = lines[index]
              if index + 2 < len(lines) and line.strip() == "if (!nested_source)" and "Material Function '" in lines[index + 1]:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.extend([
                      line,
                      indent + "{",
                      indent + '    std::string message = "Material Function \'";',
                      indent + "    message.append(nested);",
                      indent + '    message.append("\' referenced by \'");',
                      indent + "    message.append(key);",
                      indent + '    message.append("\' could not be loaded: ");',
                      indent + "    message.append(nested_source.error());",
                      indent + "    return function_source_result::failure(std::move(message));",
                      indent + "}",
                  ])
                  index += 3
                  replaced = True
                  continue
              out.append(line)
              index += 1
          if not replaced:
              raise RuntimeError("material_processor nested-source diagnostic not found")
          path.write_text("\n".join(out) + "\n")
          PY

          clang-format-18 -i \
            engine/render-tools/src/common/material_function.cpp \
            engine/render-tools/src/common/material_graph_ir.cpp \
            tools/asset_cooker/material_processor.cpp

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/render-tools/src/common/material_function.cpp \
            engine/render-tools/src/common/material_graph_ir.cpp \
            tools/asset_cooker/material_processor.cpp
          if ! git diff --cached --quiet; then
            git commit -m "fix: satisfy material function static analysis"
            git push origin HEAD:feature/material-shader-functions
          fi
