name: Apply Android SDK Manager action

on:
  push:
    branches:
      - ui/android-sdk-manager-action

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/android-sdk-manager-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Apply changes
        run: python .github/scripts/apply_android_sdk_manager_action.py
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Format touched files
        working-directory: editor
        run: npx prettier --write src/main/androidSdkManager.ts src/main/androidSdkManager.test.ts src/main/main.ts src/preload/preload.ts src/renderer/src/settings/EditorPreferencesDialog.tsx src/renderer/src/settings/SettingsDialog.test.tsx
      - name: Run focused tests
        working-directory: editor
        run: npx vitest run src/main/androidSdkManager.test.ts src/renderer/src/settings/SettingsDialog.test.tsx
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/main/androidSdkManager.ts editor/src/main/androidSdkManager.test.ts editor/src/main/main.ts editor/src/preload/preload.ts editor/src/renderer/src/settings/EditorPreferencesDialog.tsx editor/src/renderer/src/settings/SettingsDialog.test.tsx
          git commit -m "Editor: add Android SDK Manager action"
          git rm .github/workflows/apply-android-sdk-manager-action.yml .github/scripts/apply_android_sdk_manager_action.py
          git commit -m "chore: remove temporary apply workflow"
          git push origin HEAD:ui/android-sdk-manager-action
