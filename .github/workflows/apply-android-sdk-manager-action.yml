name: Apply Android SDK Manager action

on:
  push:
    branches:
      - ui/android-sdk-manager-action

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/android-sdk-manager-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)} for {old[:80]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('editor/src/main/androidSdkManager.ts').write_text(r'''import fs from 'node:fs';
import path from 'node:path';

export type AndroidSdkManagerLauncher = {
  kind: 'gui' | 'cli';
  command: string;
  args: string[];
  cwd: string;
};

const fileExists = (filePath: string): boolean => {
  try {
    return fs.statSync(filePath).isFile();
  } catch {
    return false;
  }
};

const directoryExists = (directoryPath: string): boolean => {
  try {
    return fs.statSync(directoryPath).isDirectory();
  } catch {
    return false;
  }
};

const versionParts = (value: string): number[] => value.split(/[.-]/).map((part) => Number.parseInt(part, 10) || 0);

const compareVersionsDescending = (left: string, right: string): number => {
  const a = versionParts(left);
  const b = versionParts(right);
  const count = Math.max(a.length, b.length);
  for (let index = 0; index < count; ++index) {
    const delta = (b[index] ?? 0) - (a[index] ?? 0);
    if (delta !== 0) return delta;
  }
  return right.localeCompare(left);
};

const commandLineToolRoots = (sdkRoot: string): string[] => {
  const root = path.join(sdkRoot, 'cmdline-tools');
  const result = [path.join(root, 'latest')];
  if (directoryExists(root)) {
    try {
      result.push(
        ...fs
          .readdirSync(root, { withFileTypes: true })
          .filter((entry) => entry.isDirectory() && entry.name !== 'latest')
          .map((entry) => entry.name)
          .sort(compareVersionsDescending)
          .map((entry) => path.join(root, entry)),
      );
    } catch {
      // Keep the conventional latest candidate.
    }
  }
  return result;
};

export const resolveAndroidSdkManagerLauncher = (
  sdkRoot: string,
  platform: NodeJS.Platform = process.platform,
): AndroidSdkManagerLauncher | null => {
  const resolvedRoot = path.resolve(sdkRoot);
  if (platform === 'win32') {
    const legacyGui = path.join(resolvedRoot, 'SDK Manager.exe');
    if (fileExists(legacyGui)) return { kind: 'gui', command: legacyGui, args: [], cwd: resolvedRoot };
  }

  const executableSuffix = platform === 'win32' ? '.bat' : '';
  for (const toolRoot of commandLineToolRoots(resolvedRoot)) {
    const androidCli = path.join(toolRoot, 'bin', `android${executableSuffix}`);
    if (fileExists(androidCli)) {
      return {
        kind: 'cli',
        command: androidCli,
        args: [`--sdk=${resolvedRoot}`, 'sdk', 'list', '--all'],
        cwd: resolvedRoot,
      };
    }
    const sdkManager = path.join(toolRoot, 'bin', `sdkmanager${executableSuffix}`);
    if (fileExists(sdkManager)) {
      return {
        kind: 'cli',
        command: sdkManager,
        args: [`--sdk_root=${resolvedRoot}`, '--list'],
        cwd: resolvedRoot,
      };
    }
  }

  const legacyCli = path.join(resolvedRoot, 'tools', 'bin', `sdkmanager${executableSuffix}`);
  return fileExists(legacyCli)
    ? {
        kind: 'cli',
        command: legacyCli,
        args: [`--sdk_root=${resolvedRoot}`, '--list'],
        cwd: resolvedRoot,
      }
    : null;
};
''', encoding='utf-8')

          Path('editor/src/main/androidSdkManager.test.ts').write_text(r'''import fs from 'node:fs';
import os from 'node:os';
import path from 'node:path';

import { afterEach, describe, expect, it } from 'vitest';

import { resolveAndroidSdkManagerLauncher } from './androidSdkManager';

const roots: string[] = [];

const touch = (filePath: string): void => {
  fs.mkdirSync(path.dirname(filePath), { recursive: true });
  fs.writeFileSync(filePath, '', 'utf8');
};

const makeRoot = (): string => {
  const root = fs.mkdtempSync(path.join(os.tmpdir(), 'arc-android-sdk-manager-'));
  roots.push(root);
  return root;
};

afterEach(() => {
  for (const root of roots.splice(0)) fs.rmSync(root, { recursive: true, force: true });
});

describe('resolveAndroidSdkManagerLauncher', () => {
  it('prefers the legacy Windows SDK Manager GUI when present', () => {
    const root = makeRoot();
    const executable = path.join(root, 'SDK Manager.exe');
    touch(executable);
    touch(path.join(root, 'cmdline-tools', 'latest', 'bin', 'sdkmanager.bat'));

    expect(resolveAndroidSdkManagerLauncher(root, 'win32')).toEqual({
      kind: 'gui',
      command: executable,
      args: [],
      cwd: root,
    });
  });

  it('uses the current Android CLI when command-line tools provide it', () => {
    const root = makeRoot();
    const executable = path.join(root, 'cmdline-tools', 'latest', 'bin', 'android.bat');
    touch(executable);

    expect(resolveAndroidSdkManagerLauncher(root, 'win32')).toEqual({
      kind: 'cli',
      command: executable,
      args: [`--sdk=${root}`, 'sdk', 'list', '--all'],
      cwd: root,
    });
  });

  it('falls back to the sdkmanager command-line tool', () => {
    const root = makeRoot();
    const executable = path.join(root, 'cmdline-tools', '22.0', 'bin', 'sdkmanager.bat');
    touch(executable);

    expect(resolveAndroidSdkManagerLauncher(root, 'win32')).toEqual({
      kind: 'cli',
      command: executable,
      args: [`--sdk_root=${root}`, '--list'],
      cwd: root,
    });
  });

  it('returns null when the validated SDK has no manager tooling', () => {
    expect(resolveAndroidSdkManagerLauncher(makeRoot(), 'win32')).toBeNull();
  });
});
