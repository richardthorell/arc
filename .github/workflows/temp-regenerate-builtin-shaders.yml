name: Regenerate built-in shaders

on:
  push:
    branches:
      - materials/858-clear-coat

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: materials/858-clear-coat
      - name: Set Up Vulkan SDK 1.4.350.0
        uses: ./.github/actions/setup-vulkan
      - name: Regenerate built-in shader header
        run: |
          python3 tools/compile_builtin_shaders.py \
            --source-root assets/shaders \
            --output-dir "$RUNNER_TEMP/arc-generated-shaders" \
            --header engine/render-vulkan/src/builtin_shaders.h \
            --glslc glslc \
            --spirv-val spirv-val \
            --write
      - name: Commit generated header and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render-vulkan/src/builtin_shaders.h
          git rm .github/workflows/temp-regenerate-builtin-shaders.yml
          git commit -m "Renderer: regenerate built-in shaders"
          git push origin HEAD:materials/858-clear-coat
