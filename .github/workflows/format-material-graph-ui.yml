name: Format Material Graph UI

on:
  push:
    branches:
      - polish/material-graph-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/material-graph-ui
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - name: Format changed editor files
        run: |
          cd editor
          npx prettier --write \
            src/renderer/src/material/MaterialGraphEditor.tsx \
            src/renderer/src/material/MaterialGraphEditor.test.tsx \
            src/renderer/src/material/materialEditor.css \
            src/renderer/src/ui/UiContextMenu.tsx \
            src/renderer/src/ui/UiContextMenu.css \
            src/renderer/src/ui/UiContextMenu.test.tsx \
            src/renderer/src/ui/UiNodeCard.tsx \
            src/renderer/src/ui/UiNodeCard.css \
            src/renderer/src/ui/UiNodeCard.test.tsx \
            src/renderer/src/ui/index.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/format-material-graph-ui.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(editor): format material graph UI" || exit 0
          git push origin HEAD:polish/material-graph-ui
