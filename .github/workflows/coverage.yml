name: Coverage

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: LLVM Coverage
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache-coverage
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep instrumentation and report tooling on the same LLVM major version.
      - name: Install LLVM and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 ninja-build ccache
      - name: Install Slang 2026.14.1
        run: |
          set -euo pipefail
          version=2026.14.1
          archive="$RUNNER_TEMP/slang-${version}.tar.gz"
          root="$RUNNER_TEMP/slang-${version}"
          curl --fail --location --retry 3 \
            "https://github.com/shader-slang/slang/releases/download/v${version}/slang-${version}-linux-x86_64.tar.gz" \
            --output "$archive"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          slangc="$(find "$root" -type f -name slangc -print -quit)"
          test -n "$slangc"
          version_output="$("$slangc" -version 2>&1)"
          printf '%s\n' "$version_output"
          grep -Eq '(^|[^0-9.])2026\.14\.1([^0-9.]|$)' <<<"$version_output"
          echo "ARC_SLANGC_EXECUTABLE=$slangc" >> "$GITHUB_ENV"
      - name: Restore Compiler Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: arc-ccache-clang18-coverage-v1-${{ github.sha }}
          restore-keys: |
            arc-ccache-clang18-coverage-v1-
      - name: Reset Compiler Cache Stats
        run: ccache --zero-stats
      - name: Verify Coverage Tools
        run: |
          llvm-profdata-18 --version
          llvm-cov-18 --version
      - name: Configure
        run: >
          cmake --preset coverage-clang
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DARC_SLANGC_EXECUTABLE="$ARC_SLANGC_EXECUTABLE"
      - name: Build
        run: cmake --build --preset coverage-clang --parallel
      - name: Generate Report
        env:
          LLVM_PROFDATA: llvm-profdata-18
          LLVM_COV: llvm-cov-18
        run: python3 tools/generate_coverage.py
      - name: Compiler Cache Stats
        if: always()
        run: ccache --show-stats
      - name: Upload Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llvm-coverage
          path: out/coverage
