name: LLVM Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keep instrumentation and report tooling on the same LLVM major version.
      - name: Install LLVM and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 ninja-build
      - name: Verify coverage tools
        run: |
          llvm-profdata-18 --version
          llvm-cov-18 --version
      - name: Configure
        run: cmake --preset coverage-clang
      - name: Build
        run: cmake --build --preset coverage-clang --parallel
      - name: Generate report
        env:
          LLVM_PROFDATA: llvm-profdata-18
          LLVM_COV: llvm-cov-18
        run: python3 tools/generate_coverage.py
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llvm-coverage
          path: out/coverage
