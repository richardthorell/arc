name: LLVM Coverage

on:
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build
      - name: Configure
        run: cmake --preset coverage-clang
      - name: Build
        run: cmake --build --preset coverage-clang --parallel
      - name: Generate report
        run: python3 tools/generate_coverage.py
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llvm-coverage
          path: out/coverage
