reaming_mode_name(value.streaming_mode)) + '}';\n                return {.request_id = request_id, .succeeded = true, .payload_json = json};\n            }\n            else if constexpr (std::is_same_v<query_type, host_asset_thumbnail_query>)\n            {''')
