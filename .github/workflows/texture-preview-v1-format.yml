name: Texture Preview V1 Format

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/texture-preview-v1-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/texture-viewer-v1-native-preview
          fetch-depth: 0
      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          npm ci --prefix editor
      - name: Format V1 changes
        run: |
          clang-format-18 -i \
            editor/native/inc/arc/editor/host_protocol_base.h \
            editor/native/inc/arc/editor/texture_preview_realizer.h \
            editor/native/src/host_protocol_base.inc \
            editor/native/src/arc_host_impl.inc \
            editor/native/src/texture_preview_realizer.cpp
          npx --prefix editor prettier --write \
            src/assetPreview/AssetPreviewViewport.tsx \
            src/texture/TextureEditor.tsx \
            src/texture/TextureEditorToolbar.tsx \
            src/texture/textureEditorViewState.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/texture-preview-v1-format.yml
          git add editor/native editor/src/renderer/src
          git diff --cached --quiet || git commit -m "style(editor): format native texture preview"
          git push origin HEAD:feature/texture-viewer-v1-native-preview
