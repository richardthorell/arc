name: Skeleton Stage 3 Picking

on:
  push:
    branches:
      - feat/skeleton-editor-visualization

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skeleton-editor-visualization
          fetch-depth: 0

      - name: Apply viewport picking
        run: python3 tools/apply_skeleton_stage3_picking_patch.py

      - name: Format native changes
        run: |
          clang-format-18 -i \
            editor/native/inc/arc/editor/editor_gizmo.h \
            editor/native/src/editor_gizmo.cpp \
            editor/native/src/arc_host.cpp

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Format editor UI changes
        working-directory: editor
        run: npx prettier --write src/renderer/src/viewport/ViewportPanel.tsx

      - name: Test and typecheck editor UI
        working-directory: editor
        run: |
          npx vitest run src/renderer/src/inspector/SkeletonInspector.test.tsx
          npm run typecheck

      - name: Configure native tests
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B out/build/skeleton-stage3-picking -G Ninja \
            -DARC_BUILD_EDITOR=ON \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_BUILD_ASSET_COOKER=OFF \
            -DARC_BUILD_PROJECT_TOOL=OFF \
            -DARC_BUILD_ENGINE_TESTS=ON

      - name: Build native editor tests
        run: cmake --build out/build/skeleton-stage3-picking --target arc_editor_host_tests -j2

      - name: Run skeleton tests
        run: out/build/skeleton-stage3-picking/editor/native/tests/arc_editor_host_tests "[skeleton]"

      - name: Verify formatting
        run: |
          python3 tools/check_format.py --clang-format clang-format-18
          git diff --check

      - name: Commit verified picking implementation
        run: |
          rm -f .github/workflows/skeleton-stage3-picking-temp.yml tools/apply_skeleton_stage3_picking_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add skeleton viewport bone picking"
          git push origin HEAD:feat/skeleton-editor-visualization
