name: Fix PR 210 GCC linkage
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/feat/skeleton-model-workflow'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix asset preview type linkage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('editor/native/src/arc_host_impl.inc')
          s = p.read_text()
          old = '''namespace arc::editor
{
namespace
{
constexpr std::string_view mesh_assignment_prefix = "__arc_mesh__/";
'''
          new = '''namespace arc::editor
{
enum class asset_preview_kind : std::uint8_t
{
    none,
    material,
    shader,
    model
};

namespace
{
constexpr std::string_view mesh_assignment_prefix = "__arc_mesh__/";
'''
          if old not in s:
              raise SystemExit('namespace insertion point not found')
          s = s.replace(old, new, 1)

          old_enum = '''enum class asset_preview_kind : std::uint8_t
{
    none,
    material,
    shader,
    model
};

struct asset_preview_identity
'''
          if old_enum not in s:
              raise SystemExit('original anonymous enum not found')
          s = s.replace(old_enum, 'struct asset_preview_identity\n', 1)
          p.write_text(s)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/src/arc_host_impl.inc
          git commit -m "Fix GCC asset preview type linkage"
          git rm .github/workflows/temp-fix-gcc-pr210.yml
          git commit -m "Remove temporary GCC fix workflow"
          git push
