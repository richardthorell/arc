name: ECS Action Buttons Temp

on:
  push:
    branches:
      - fix/shared-control-typography
    paths:
      - .github/workflows/ui-action-buttons-temp.yml

permissions:
  contents: write

jobs:
  update-ecs-actions:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/shared-control-typography

      - name: Use shared UiButton for ECS actions
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('editor/src/renderer/src/inspector/SchemaComponents.tsx')
          text = schema.read_text()
          text = text.replace(
              "import { UiSelect, UiTextInput } from '../ui';",
              "import { UiButton, UiSelect, UiTextInput } from '../ui';",
              1,
          )
          old = '''          {field.actions.map((action) => (
            <button
              aria-label={action.label}
              className={action.danger ? 'is-danger' : ''}
              disabled={action.disabled?.(context)}
              key={action.id}
              onClick={() => onAction(action.id)}
              title={action.tooltip}
              type="button"
            >
              {action.label}
            </button>
          ))}'''
          new = '''          {field.actions.map((action) => (
            <UiButton
              aria-label={action.label}
              disabled={action.disabled?.(context)}
              key={action.id}
              onClick={() => onAction(action.id)}
              title={action.tooltip}
              type="button"
              variant={action.danger ? 'danger' : 'default'}
            >
              {action.label}
            </UiButton>
          ))}'''
          if old not in text:
              raise SystemExit('ECS action button block not found')
          schema.write_text(text.replace(old, new, 1))

          css_path = Path('editor/src/renderer/src/inspector/inspector.css')
          css = css_path.read_text()
          old_css = '''
.inspector-action-buttons button {
  min-width: 0;
  height: var(--inspector-control-height);
  border: 1px solid #3a4852;
  border-radius: 3px;
  color: #d1d7dc;
  background: linear-gradient(#29343c, #202930);
  cursor: pointer;
  font: inherit;
}

.inspector-action-buttons button:hover:not(:disabled) {
  border-color: #587287;
  background: linear-gradient(#33434e, #27343d);
}

.inspector-action-buttons button.is-danger:hover:not(:disabled) {
  border-color: #9d5555;
  color: #ffd5d5;
}

.inspector-action-buttons button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}
'''
          if old_css not in css:
              raise SystemExit('legacy ECS action button CSS not found')
          css = css.replace(old_css, '''
.inspector-action-buttons .ui-button {
  width: 100%;
}
''', 1)
          css_path.write_text(css)
          PY

      - name: Commit update and remove temporary workflow
        run: |
          git rm .github/workflows/ui-action-buttons-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/inspector/SchemaComponents.tsx editor/src/renderer/src/inspector/inspector.css
          git commit -m "Use UiButton for ECS action fields"
          git push origin HEAD:fix/shared-control-typography
