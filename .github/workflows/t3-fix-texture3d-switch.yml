name: T3 Texture3D switch fix

on:
  push:
    branches:
      - feature/texture-dimensions-t3-typed-sampling

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch missing Texture3D switch case
        shell: python
        run: |
          from pathlib import Path

          path = Path("engine/render-vulkan/src/vulkan_backend_materials.cpp")
          text = path.read_text()
          old = """            case shader_parameter_type::texture_2d:\n            case shader_parameter_type::texture_cube:\n            case shader_parameter_type::sampler:\n"""
          new = """            case shader_parameter_type::texture_2d:\n            case shader_parameter_type::texture_cube:\n            case shader_parameter_type::texture_3d:\n            case shader_parameter_type::sampler:\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one target switch block, found {count}")
          path.write_text(text.replace(old, new, 1))

      - name: Validate patch
        run: |
          git diff --check
          grep -A4 -B1 "case shader_parameter_type::texture_2d:" engine/render-vulkan/src/vulkan_backend_materials.cpp | tail -n 6

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render-vulkan/src/vulkan_backend_materials.cpp
          git rm .github/workflows/t3-fix-texture3d-switch.yml
          git commit -m "fix(render): handle Texture3D runtime parameters"
          git push origin HEAD:feature/texture-dimensions-t3-typed-sampling
