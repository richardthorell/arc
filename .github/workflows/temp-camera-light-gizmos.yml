name: Camera and Light Gizmos

on:
  push:
    branches:
      - feature/viewport-scene-camera-switching

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[camera-light-gizmos]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/viewport-scene-camera-switching
      - name: Implement camera and light viewport gizmos
        shell: bash
        run: |
          python3 tools/temp_camera_light_gizmos.py
          clang-format-18 -i editor/native/src/editor_gizmo.cpp editor/native/tests/editor_tests.cpp
          git diff --check
          cmake -S . -B out/build/camera-light-gizmos -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DARC_BUILD_EDITOR=ON \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_BUILD_SAMPLES=OFF \
            -DARC_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build out/build/camera-light-gizmos --target arc_editor_host_tests --parallel
          out/build/camera-light-gizmos/editor/native/tests/arc_editor_host_tests "editor viewport shows camera and light icons plus selected camera frustum"
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898218+github-actions[bot]@users.noreply.github.com"
          git add editor/native/src/editor_gizmo.cpp editor/native/tests/editor_tests.cpp
          git commit -m "feat(editor): add camera and light viewport gizmos [camera-light-gizmos]"
          git push origin HEAD:feature/viewport-scene-camera-switching
