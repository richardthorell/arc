name: Temporary asset hover details validation

on:
  push:
    branches:
      - fix/asset-hover-details

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asset-hover-details
      - name: Apply asset hover patch
        run: python3 scripts/temporary_patch_asset_hover_details.py
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Format changed files
        working-directory: editor
        run: npx prettier --write src/renderer/src/services/editorHostTypes.ts src/renderer/src/content/assetPresentation.ts src/renderer/src/content/ContentAssetCard.tsx src/renderer/src/content/ContentAssetCard.test.tsx
      - name: Typecheck editor
        working-directory: editor
        run: npm run typecheck
      - name: Test asset hover details
        working-directory: editor
        run: npx vitest run src/renderer/src/content/ContentAssetCard.test.tsx src/renderer/src/content/assetPresentation.test.ts --pool=threads --maxWorkers=1
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/services/editorHostTypes.ts editor/src/renderer/src/content/assetPresentation.ts editor/src/renderer/src/content/ContentAssetCard.tsx editor/src/renderer/src/content/ContentAssetCard.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Improve asset hover details by type"
            git push origin HEAD:fix/asset-hover-details
          fi
