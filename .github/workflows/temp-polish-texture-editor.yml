name: Temp Polish Texture Editor

on:
  push:
    branches: [feat/texture-editor-view]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/texture-editor-view
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply mip preview sizing and format files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('editor/src/renderer/src/texture/TextureEditor.tsx')
          text = p.read_text()
          text = text.replace(
              "  const viewState = useTextureEditorViewState(document.id);\n  const zoom = viewState.zoom;",
              "  const viewState = useTextureEditorViewState(document.id);\n  const zoom = viewState.zoom;\n  const mipScale = 1 / 2 ** viewState.mipLevel;\n  const displayWidth = Math.max(1, Math.round((preview?.width ?? 1) * mipScale));\n  const displayHeight = Math.max(1, Math.round((preview?.height ?? 1) * mipScale));",
          )
          text = text.replace("availableWidth / preview.width, availableHeight / preview.height", "availableWidth / displayWidth, availableHeight / displayHeight")
          text = text.replace(
              "  }, [document.id, preview?.path, preview?.width, preview?.height]);",
              "  }, [displayHeight, displayWidth, document.id, preview?.path]);",
          )
          text = text.replace("preview.width * zoom", "displayWidth * zoom")
          text = text.replace("preview.height * zoom", "displayHeight * zoom")
          text = text.replace("<HorizontalRuler width={preview.width} zoom={zoom} />", "<HorizontalRuler width={displayWidth} zoom={zoom} />")
          text = text.replace("<VerticalRuler height={preview.height} zoom={zoom} />", "<VerticalRuler height={displayHeight} zoom={zoom} />")
          p.write_text(text)
          PY

          npx prettier@3.9.6 --write \
            editor/src/renderer/src/ui/UiPanel.tsx \
            editor/src/renderer/src/ui/UiPanel.css \
            editor/src/renderer/src/ui/UiPanelSection.tsx \
            editor/src/renderer/src/ui/index.ts \
            editor/src/renderer/src/inspector/SchemaComponents.tsx \
            editor/src/renderer/src/editors/editorRegistry.ts \
            editor/src/renderer/src/texture/TextureEditor.tsx \
            editor/src/renderer/src/texture/TextureEditorToolbar.tsx \
            editor/src/renderer/src/texture/textureEditorToolbar.css \
            editor/src/renderer/src/texture/textureEditorViewState.ts \
            editor/src/renderer/src/texture/textureEditor.css

          rm .github/workflows/temp-polish-texture-editor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor/src/renderer/src/ui editor/src/renderer/src/inspector/SchemaComponents.tsx editor/src/renderer/src/editors/editorRegistry.ts editor/src/renderer/src/texture .github/workflows/temp-polish-texture-editor.yml
          git commit -m 'Polish texture editor controls and shared sections'
          git push origin HEAD:feat/texture-editor-view
