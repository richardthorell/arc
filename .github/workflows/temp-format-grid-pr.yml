name: Temp Format Grid PR

on:
  push:
    branches:
      - feature/editor-grid-colors

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/editor-grid-colors
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci --prefix editor

      - name: Format and validate editor
        working-directory: editor
        run: |
          npx prettier --write src/renderer/src/viewport/ViewportPanel.tsx
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Commit formatting fix
        run: |
          rm -f .github/workflows/temp-format-grid-pr.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format editor grid viewport changes"
          git push origin HEAD:feature/editor-grid-colors
