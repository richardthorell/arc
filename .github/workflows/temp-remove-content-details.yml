name: Temporary Content Browser Details Regression Fix

on:
  push:
    branches: [feature/resizable-utility-sidebar]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/resizable-utility-sidebar
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - name: Remove regressed Content Browser details pane
        run: |
          python3 - <<'PY'
          from pathlib import Path

          panel = Path('editor/src/renderer/src/content/ContentBrowserPanel.tsx')
          text = panel.read_text()
          text = text.replace('  onAssetAction,\n  onTextureStreamingMode,\n  thumbnailProvider,', '  onAssetAction,\n  thumbnailProvider,', 1)
          text = text.replace("  const selected =\n    assets.find((asset) => asset.id === selectedAssetId) ?? assets.find((asset) => selection.has(asset.id)) ?? null;\n", '', 1)
          start = text.find('          {selected && (\n            <aside className="content-asset-details">')
          if start == -1:
              raise SystemExit('details pane start not found')
          end_marker = '          )}\n        </>\n      )}'
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('details pane end not found')
          text = text[:start] + text[end + len('          )}\n'):]
          panel.write_text(text)

          test = Path('editor/src/renderer/src/content/ContentBrowserPanel.test.tsx')
          text = test.read_text()
          start = text.find("  it('edits eligible texture streaming modes and reports last-good runtime state', () => {")
          if start == -1:
              raise SystemExit('streaming details test start not found')
          next_test = text.find("  it('uses shared ARC controls in the Content Browser toolbar'", start)
          if next_test == -1:
              raise SystemExit('next test not found')
          text = text[:start] + text[next_test:]
          old = """  it('selects assets and opens the persistent asset details side panel', () => {\n    const view = renderBrowser();\n    fireEvent.click(view.getByText('Hero Rock'));\n\n    expect(view.container.querySelector('.content-asset-details')).toBeInTheDocument();\n    expect(view.getByText('Dependencies (0)')).toBeInTheDocument();\n    expect(view.getByText('References (0)')).toBeInTheDocument();\n  });\n"""
          new = """  it('selects assets without opening a persistent details side panel', () => {\n    const view = renderBrowser();\n    fireEvent.click(view.getByText('Hero Rock'));\n\n    expect(view.container.querySelector('.content-asset-details')).not.toBeInTheDocument();\n    expect(view.queryByText('Dependencies (0)')).not.toBeInTheDocument();\n    expect(view.queryByText('References (0)')).not.toBeInTheDocument();\n  });\n"""
          if old not in text:
              raise SystemExit('persistent details test not found')
          test.write_text(text.replace(old, new, 1))

          css = Path('editor/src/renderer/src/content/contentBrowser.css')
          text = css.read_text()
          text = text.replace(
              '/* Asset cards prioritize the preview and identity. Secondary operations stay in\n   the selected-asset details pane instead of competing with every thumbnail. */',
              '/* Asset cards prioritize preview and identity. Secondary operations stay out of\n   the dense grid and belong in focused asset/editor workflows. */',
              1,
          )
          css.write_text(text)
          PY
      - name: Validate editor changes
        working-directory: editor
        run: |
          npx prettier --write src/renderer/src/content/ContentBrowserPanel.tsx src/renderer/src/content/ContentBrowserPanel.test.tsx src/renderer/src/content/contentBrowser.css
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run src/renderer/src/content/ContentBrowserPanel.test.tsx --pool=threads --maxWorkers=1
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/content/ContentBrowserPanel.tsx editor/src/renderer/src/content/ContentBrowserPanel.test.tsx editor/src/renderer/src/content/contentBrowser.css
          git commit -m "Remove regressed Content Browser details pane"
          git push origin HEAD:feature/resizable-utility-sidebar
