name: Apply Main Vulkan Format Fix

on:
  push:
    branches: [fix/main-vulkan-format]

permissions:
  contents: write

jobs:
  apply-format-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/main-vulkan-format

      - name: Apply Lambda Formatting Fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("engine/render-vulkan/src/vulkan_backend.cpp")
          text = path.read_text()
          old = """        const auto is_static_caster = [&](const draw_mesh_event& draw)\n        {\n"""
          new = """        const auto is_static_caster = [&](const draw_mesh_event& draw) {\n"""
          if text.count(old) != 1:
              raise SystemExit("expected exactly one unformatted is_static_caster lambda")
          path.write_text(text.replace(old, new))
          PY

      - name: Verify C++ Formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          python3 tools/check_format.py --clang-format clang-format-18

      - name: Commit Fix
        run: |
          rm .github/workflows/apply-main-vulkan-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Vulkan lambda formatting"
          git push origin HEAD:fix/main-vulkan-format
