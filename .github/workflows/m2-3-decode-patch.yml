name: Apply M2.3 decode patch

on:
  push:
    branches:
      - m2/terrain-async-page-streaming

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2/terrain-async-page-streaming
          fetch-depth: 0
      - name: Patch page decoder
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/m2_patch.py
          python3 /tmp/m2_patch.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/src/common/virtual_mesh_builder.cpp
          git commit -m "feat: decode externally streamed virtual geometry pages"
          git push origin HEAD:m2/terrain-async-page-streaming
