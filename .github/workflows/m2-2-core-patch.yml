name: Apply M2.2 core storage patch

on:
  push:
    branches:
      - m2/terrain-lazy-cooked-regions

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: add range-addressable virtual geometry packing'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2/terrain-lazy-cooked-regions
          fetch-depth: 0
      - name: Patch generic cooked storage primitives
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/m2_patch.py
          python3 /tmp/m2_patch.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/assets engine/render
          git commit -m "feat: add range-addressable virtual geometry packing"
          git push origin HEAD:m2/terrain-lazy-cooked-regions
