name: Temp Fix Material Function Tidy V2

on:
  push:
    branches:
      - feature/material-shader-functions
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/material-shader-functions
          fetch-depth: 0

      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Apply static-analysis fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = '''
          std::string concatenate(std::initializer_list<std::string_view> parts)
          {
              std::size_t size{};
              for (const auto part : parts)
                  size += part.size();
              std::string result;
              result.reserve(size);
              for (const auto part : parts)
                  result.append(part);
              return result;
          }
          '''

          # material_function.cpp
          path = Path("engine/render-tools/src/common/material_function.cpp")
          text = path.read_text()
          text = text.replace("#include <algorithm>\n", "#include <algorithm>\n#include <cstddef>\n#include <initializer_list>\n", 1)
          marker = '''shader_compile_error validation_error(std::string message)
          {
              return {.code = shader_compile_error_code::validation_failed, .message = std::move(message)};
          }
          '''
          if marker not in text:
              raise RuntimeError("material_function validation helper marker missing")
          text = text.replace(marker, marker + helper, 1)
          lines = text.splitlines()
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              indent = line[:len(line) - len(line.lstrip())]
              next_line = lines[i + 1] if i + 1 < len(lines) else ""
              if 'validation_error(label + " references unknown function input' in line:
                  out.append(indent + 'validation_error(concatenate({label, " references unknown function input \'", input, "\'"})));')
              elif 'validation_error(label + " writes unknown function output' in line:
                  out.append(indent + 'validation_error(concatenate({label, " writes unknown function output \'", target_pin, "\'"})));')
              elif '"Material Function call \'" + call_id + "\' has an invalid or duplicate input' in line:
                  out.append(indent + 'concatenate({"Material Function call \'", call_id, "\' has an invalid or duplicate input \'", pin, "\'"})));')
              elif 'validation_error("Material Function call \'" + call_id +' in line and 'references unknown output' in next_line:
                  out.append(indent + 'validation_error(concatenate({"Material Function call \'", call_id, "\' references unknown output \'", pin, "\'"})));')
                  i += 1
              elif 'validation_error("Material Function call \'" + call_id +' in line and 'is missing required input' in next_line:
                  out.append(indent + 'return endpoint_result::failure(validation_error(concatenate(')
                  continuation_indent = indent + '    '
                  out.append(continuation_indent + '{"Material Function call \'", call_id, "\' is missing required input \'", boundary->second, "\'"})));')
                  i += 1
              elif 'invalid or multiply-connected output' in line:
                  out.append(indent + 'validation_error(concatenate({"Material Function has an invalid or multiply-connected output \'", pin, "\'"})));')
              elif 'uses unconnected output' in line:
                  out.append(indent + 'validation_error(concatenate({"Material Function call \'", call_id, "\' uses unconnected output \'", pin, "\'"})));')
              else:
                  line = line.replace('call_id + "::" + target_node', 'concatenate({call_id, "::", target_node})')
                  line = line.replace('call_id + "::" + node.value("id", "")', 'concatenate({call_id, "::", node.value("id", "")})')
                  line = line.replace('call_id + "::default::" + boundary->second', 'concatenate({call_id, "::default::", boundary->second})')
                  line = line.replace('call_id + "::" + node', 'concatenate({call_id, "::", node})')
                  out.append(line)
              i += 1
          path.write_text("\n".join(out) + "\n")

          # material_graph_ir.cpp
          path = Path("engine/render-tools/src/common/material_graph_ir.cpp")
          text = path.read_text()
          text = text.replace("#include <cstddef>\n", "#include <cstddef>\n#include <initializer_list>\n", 1)
          marker = "using json = nlohmann::json;\n"
          if marker not in text:
              raise RuntimeError("material_graph_ir namespace marker missing")
          text = text.replace(marker, marker + helper, 1)
          old1 = '.message = "Material Function call \'" + source + "\' has no output pin \'" + source_pin + "\'"});'
          new1 = '.message = concatenate({"Material Function call \'", source, "\' has no output pin \'", source_pin, "\'"})});'
          old2 = '.message = "Material Function call \'" + target + "\' has no input pin \'" + target_pin + "\'"});'
          new2 = '.message = concatenate({"Material Function call \'", target, "\' has no input pin \'", target_pin, "\'"})});'
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise RuntimeError("material_graph_ir diagnostics missing")
          path.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1))

          # material_processor.cpp
          path = Path("tools/asset_cooker/material_processor.cpp")
          text = path.read_text()
          text = text.replace("std::string normalized_path(std::filesystem::path path)",
                              "std::string normalized_path(const std::filesystem::path& path)", 1)
          text = text.replace("std::filesystem::path assets_root_for(std::filesystem::path source_path)",
                              "std::filesystem::path assets_root_for(const std::filesystem::path& source_path)", 1)
          lines = text.splitlines()
          out = []
          i = 0
          found = False
          while i < len(lines):
              line = lines[i]
              if line.strip() == "if (!nested_source)" and i + 2 < len(lines) and "Material Function '" in lines[i + 1]:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.extend([
                      line,
                      indent + "{",
                      indent + '    std::string message = "Material Function \'";',
                      indent + "    message.append(nested);",
                      indent + '    message.append("\' referenced by \'");',
                      indent + "    message.append(key);",
                      indent + '    message.append("\' could not be loaded: ");',
                      indent + "    message.append(nested_source.error());",
                      indent + "    return function_source_result::failure(std::move(message));",
                      indent + "}",
                  ])
                  i += 3
                  found = True
                  continue
              out.append(line)
              i += 1
          if not found:
              raise RuntimeError("material_processor nested function diagnostic missing")
          path.write_text("\n".join(out) + "\n")
          PY

          clang-format-18 -i \
            engine/render-tools/src/common/material_function.cpp \
            engine/render-tools/src/common/material_graph_ir.cpp \
            tools/asset_cooker/material_processor.cpp

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/render-tools/src/common/material_function.cpp \
            engine/render-tools/src/common/material_graph_ir.cpp \
            tools/asset_cooker/material_processor.cpp
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: satisfy material function static analysis"
            git push origin HEAD:feature/material-shader-functions
          fi
