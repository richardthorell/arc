name: Product - Linux Clang

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-vulkan:
    name: Clang 18 Vulkan and native host compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain family
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build
      - name: Set up Vulkan SDK 1.4.350.0
        uses: ./.github/actions/setup-vulkan
      - name: Configure
        run: >
          cmake -S . -B out/build/clang-vulkan -G Ninja
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=ON
          -DARC_BUILD_RENDER_VULKAN=ON
          -DARC_BUILD_SAMPLES=ON
          -DARC_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build out/build/clang-vulkan --parallel
      - name: Validate shaders
        run: cmake --build out/build/clang-vulkan --target arc-shaders-check
      - name: Test
        run: ctest --test-dir out/build/clang-vulkan --output-on-failure
      - name: Package and smoke headless runtime
        run: |
          cmake --install out/build/clang-vulkan --prefix out/dist/linux
          cpack --config out/build/clang-vulkan/CPackConfig.cmake -C RelWithDebInfo
          python3 tools/run_process_smoke.py out/dist/linux/bin/arc_headless --ticks 10 --no-sleep
          python3 tools/verify_distribution.py out/dist/linux --require bin/arc_headless --require build-manifest.json
      - name: Install Debug and Shipping SDK configurations
        run: |
          cmake -S . -B out/build/sdk-debug -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug -DARC_BUILD_EDITOR=OFF -DARC_BUILD_RENDER_VULKAN=ON -DARC_BUILD_SAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build out/build/sdk-debug --parallel
          cmake --install out/build/sdk-debug --prefix out/dist/linux
          cmake -S . -B out/build/sdk-shipping -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Shipping -DARC_BUILD_RENDER_VULKAN=ON -DARC_BUILD_PROJECT_TOOL=OFF -DARC_BUILD_SAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build out/build/sdk-shipping --parallel
          cmake --install out/build/sdk-shipping --prefix out/dist/linux
      - name: Build an external headless project from the installed SDK
        run: |
          out/dist/linux/bin/arc-project create --name ExternalServer --destination out/external-server --template blank-headless --templates out/dist/linux/share/arc/templates --engine 0.1.0
          cmake -S out/external-server -B out/external-server/Build/ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/dist/linux
          cmake --build out/external-server/Build/ci --parallel
          cmake -S out/external-server -B out/external-server/Build/ci-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/dist/linux
          cmake --build out/external-server/Build/ci-debug --parallel
          cmake -S out/external-server -B out/external-server/Build/ci-shipping -G Ninja -DCMAKE_BUILD_TYPE=Shipping -DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/dist/linux
          cmake --build out/external-server/Build/ci-shipping --parallel
          ! grep -R -F "${{ github.workspace }}" out/dist/linux/lib/cmake/ARC out/external-server --exclude-dir=Build
      - name: Upload headless package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-headless-linux-x64
          path: |
            out/dist/linux
            out/build/clang-vulkan/packages/*.tar.gz

  address-undefined:
    name: Clang 18 ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build
      - name: Configure
        run: >
          cmake -S . -B out/build/asan -G Ninja
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=Debug
          -DARC_ENABLE_ADDRESS_SANITIZER=ON
          -DARC_ENABLE_UNDEFINED_SANITIZER=ON
          -DARC_BUILD_RENDER_VULKAN=OFF
          -DARC_BUILD_EDITOR=OFF
          -DBUILD_TESTING=ON
      - run: cmake --build out/build/asan --parallel
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir out/build/asan --output-on-failure

  thread:
    name: Clang 18 ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build
      - name: Configure
        run: >
          cmake -S . -B out/build/tsan -G Ninja
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_ENABLE_THREAD_SANITIZER=ON
          -DARC_BUILD_RENDER_VULKAN=OFF
          -DARC_BUILD_EDITOR=OFF
          -DBUILD_TESTING=ON
      - run: cmake --build out/build/tsan --parallel
      - name: Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir out/build/tsan --output-on-failure

  no-coroutines:
    name: Coroutine-disabled engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build
      - run: >
          cmake -S . -B out/build/no-coroutines -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_ENABLE_JOB_COROUTINES=OFF
          -DARC_BUILD_ASSET_COOKER=OFF
          -DBUILD_TESTING=ON
      - run: cmake --build out/build/no-coroutines --parallel
      - run: ctest --test-dir out/build/no-coroutines --output-on-failure
