name: Temporary UI Lab Activity Counter

on:
  push:
    branches: [feature/activity-bar-counters-v2]

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-bar-counters-v2
          fetch-depth: 0

      - name: Add activity buttons to UI Lab
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('editor/src/renderer/src/uiLab/UiLabContentCards.tsx')
          text = path.read_text()
          text = text.replace("import { useMemo } from 'react';", "import { useMemo } from 'react';\nimport { GitBranch } from 'lucide-react';", 1)
          text = text.replace("import { ContentAssetCard } from '../content/ContentAssetCard';", "import { ContentAssetCard } from '../content/ContentAssetCard';\nimport { ActivityBarButton } from '../layout/ActivityBar';", 1)
          anchor = '    <div className="ui-lab-content-card-showcase content-browser-v2">'
          showcase = '''    <div className="ui-lab-content-card-showcase content-browser-v2">
      <section className="ui-lab-activity-buttons" aria-label="Side-bar button examples">
        <strong>Side-bar buttons</strong>
        <div className="ui-lab-activity-button-row">
          <div className="activity-bar ui-lab-activity-button-sample">
            <ActivityBarButton aria-label="Repository without changes" title="Version Control" variant="ghost">
              <GitBranch size={20} />
            </ActivityBarButton>
          </div>
          <div className="activity-bar ui-lab-activity-button-sample">
            <ActivityBarButton
              aria-label="Repository with changes"
              counter={7}
              counterLabel="7 changed files"
              title="Version Control"
              variant="ghost"
            >
              <GitBranch size={20} />
            </ActivityBarButton>
          </div>
        </div>
      </section>'''
          if anchor not in text:
              raise SystemExit('UI Lab insertion point not found')
          path.write_text(text.replace(anchor, showcase, 1))

          css_path = Path('editor/src/renderer/src/uiLab/uiLabContentCards.css')
          css = css_path.read_text()
          css += '''

.ui-lab-activity-buttons {
  display: grid;
  gap: var(--arc-space-4);
  margin-bottom: var(--arc-space-8);
}

.ui-lab-activity-button-row {
  display: flex;
  align-items: flex-start;
  gap: var(--arc-space-6);
}

.ui-lab-activity-button-sample {
  width: var(--arc-activity-collapsed-width);
  min-height: 46px;
  padding: var(--arc-space-2);
}
'''
          css_path.write_text(css)

          test_path = Path('editor/src/renderer/src/uiLab/UiLabContentCards.test.tsx')
          test = test_path.read_text()
          marker = '    render(<UiLabContentCards />);'
          addition = '''    render(<UiLabContentCards />);
    expect(screen.getByRole('button', { name: 'Repository without changes' })).toBeInTheDocument();
    expect(screen.getByLabelText('7 changed files')).toHaveTextContent('7');'''
          if marker not in test:
              raise SystemExit('UI Lab test insertion point not found')
          test_path.write_text(test.replace(marker, addition, 1))
          PY

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Run targeted tests
        working-directory: editor
        run: npx vitest run src/renderer/src/layout/ActivityBar.test.tsx src/renderer/src/uiLab/UiLabContentCards.test.tsx

      - name: Remove helper and commit
        run: |
          rm .github/workflows/temp-ui-lab-activity-counter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add activity buttons to UI Lab"
          git push origin HEAD:feature/activity-bar-counters-v2
