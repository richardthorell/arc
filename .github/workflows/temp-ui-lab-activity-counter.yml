name: Temporary UI Lab Activity Counter

on:
  push:
    branches: [feature/activity-bar-counters-v2]

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-bar-counters-v2
          fetch-depth: 0

      - name: Add activity buttons to UI Lab
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('editor/src/renderer/src/uiLab/UiLabContentCards.tsx')
          text = path.read_text()
          text = text.replace("import { useMemo } from 'react';\n", "import { useMemo } from 'react';\nimport { GitBranch } from 'lucide-react';\n")
          text = text.replace("import { ContentAssetCard } from '../content/ContentAssetCard';\n", "import { ContentAssetCard } from '../content/ContentAssetCard';\nimport { ActivityBarButton } from '../layout/ActivityBar';\n")
          needle = '''  return (\n    <div className="ui-lab-content-card-showcase content-browser-v2">\n'''
          replacement = '''  return (\n    <div className="ui-lab-content-card-showcase content-browser-v2">\n      <section className="ui-lab-activity-buttons" aria-label="Side-bar button examples">\n        <strong>Side-bar buttons</strong>\n        <div className="ui-lab-activity-button-row">\n          <div className="activity-bar ui-lab-activity-button-sample">\n            <ActivityBarButton aria-label="Repository without changes" title="Version Control" variant="ghost">\n              <GitBranch size={20} />\n            </ActivityBarButton>\n          </div>\n          <div className="activity-bar ui-lab-activity-button-sample">\n            <ActivityBarButton\n              aria-label="Repository with changes"\n              counter={7}\n              counterLabel="7 changed files"\n              title="Version Control"\n              variant="ghost"\n            >\n              <GitBranch size={20} />\n            </ActivityBarButton>\n          </div>\n        </div>\n      </section>\n'''
          if needle not in text:
              raise SystemExit('UI Lab insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))

          css_path = Path('editor/src/renderer/src/uiLab/uiLabContentCards.css')
          css = css_path.read_text()
          css += '''\n.ui-lab-activity-buttons {\n  display: grid;\n  gap: var(--arc-space-4);\n  margin-bottom: var(--arc-space-8);\n}\n\n.ui-lab-activity-button-row {\n  display: flex;\n  align-items: flex-start;\n  gap: var(--arc-space-6);\n}\n\n.ui-lab-activity-button-sample {\n  width: var(--arc-activity-collapsed-width);\n  min-height: 46px;\n  padding: var(--arc-space-2);\n}\n'''
          css_path.write_text(css)

          test_path = Path('editor/src/renderer/src/uiLab/UiLabContentCards.test.tsx')
          test = test_path.read_text()
          marker = "    render(<UiLabContentCards />);\n"
          addition = "    expect(screen.getByRole('button', { name: 'Repository without changes' })).toBeInTheDocument();\n    expect(screen.getByLabelText('7 changed files')).toHaveTextContent('7');\n"
          if marker not in test:
              raise SystemExit('UI Lab test insertion point not found')
          test_path.write_text(test.replace(marker, marker + addition, 1))
          PY

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Run targeted tests
        working-directory: editor
        run: npx vitest run src/renderer/src/layout/ActivityBar.test.tsx src/renderer/src/uiLab/UiLabContentCards.test.tsx

      - name: Remove helper and commit
        run: |
          rm .github/workflows/temp-ui-lab-activity-counter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add activity buttons to UI Lab"
          git push origin HEAD:feature/activity-bar-counters-v2
