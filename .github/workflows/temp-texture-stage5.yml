          const curveTangent = (curve: TextureCurve, i: number) => { if (i === 0) return curveSlope(curve[0], curve[1]); if (i === curve.length - 1) return curveSlope(curve[i - 1], curve[i]); const l=curveSlope(curve[i-1],curve[i]),r=curveSlope(curve[i],curve[i+1]); return l*r<=0?0:(l+r)/2; };
          export const evaluateTextureCurve = (curve: TextureCurve, input: number) => { const x=clamp(input); let ri=curve.findIndex(p=>p.x>x); if(ri<0)return curve.at(-1)?.y??x;if(ri===0)return curve[0].y;const li=ri-1,a=curve[li],b=curve[ri],w=Math.max(1e-6,b.x-a.x),t=(x-a.x)/w;if(a.interpolation==='constant')return a.y;if(a.interpolation==='linear')return a.y+(b.y-a.y)*t;const m0=a.interpolation==='manual'?a.outTangent:curveTangent(curve,li),m1=b.interpolation==='manual'?b.inTangent:curveTangent(curve,ri),t2=t*t,t3=t2*t;return clamp((2*t3-3*t2+1)*a.y+(t3-2*t2+t)*w*m0+(-2*t3+3*t2)*b.y+(t3-t2)*w*m1); };
          const mapped = (rgba: readonly number[], source: TextureChannelSource) => {''')
          replace(path, '''      value[channel] = clamp((value[channel] - settings.inputBlack) / range);
                value[channel] = value[channel] ** (1 / settings.gamma);''', '''      value[channel] = clamp((value[channel] - settings.inputBlack) / range);
