          type CurveKey='curveMaster'|'curveR'|'curveG'|'curveB'|'curveA'; const channels:Array<[CurveKey,string]>=[['curveMaster','Master'],['curveR','R'],['curveG','G'],['curveB','B'],['curveA','A']];
          export function TextureCurveControls({asset,histogram}:{asset:AssetItem;histogram?:{r:number[];g:number[];b:number[];a:number[]}}){ const {settings}=useTextureSettings(asset.guid,asset.generation); const [draft,setDraft]=useState<TextureSettingsSnapshot|null>(settings); const [active,setActive]=useState<CurveKey>('curveMaster'); const timer=useRef<number|null>(null); useEffect(()=>setDraft(settings),[settings]); useEffect(()=>()=>{if(timer.current!==null)window.clearTimeout(timer.current)},[]); if(!asset.guid||!draft||asset.readOnly)return null;
            const update=(patch:TextureSettingsPatch)=>{setDraft(c=>c?{...c,...patch}:c);window.dispatchEvent(new CustomEvent('arc:texture-settings-preview',{detail:{guid:asset.guid,patch}}));if(timer.current!==null)window.clearTimeout(timer.current);timer.current=window.setTimeout(()=>void patchTextureSettings(asset.guid!,patch),250)};
            const h:UiCurveHistogram|undefined=active==='curveR'?histogram?.r:active==='curveG'?histogram?.g:active==='curveB'?histogram?.b:active==='curveA'?histogram?.a:histogram?histogram.r.map((v,i)=>v+histogram.g[i]+histogram.b[i]):undefined;
