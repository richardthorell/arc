      - name: Format
        run: |
          clang-format -i engine/render-tools/inc/arc/render_tools/texture_cooker.h engine/render-tools/src/common/texture_cooker.cpp engine/render-tools/tests/texture_cooker_tests.cpp editor/native/inc/arc/editor/host_protocol_base.h editor/native/src/host_protocol_base.inc editor/native/src/arc_host_base.inc
          cd editor && npx prettier --write src/renderer/src/ui/UiCurveEditor.tsx src/renderer/src/ui/UiCurveEditor.css src/renderer/src/ui/UiCurveEditor.test.tsx src/renderer/src/ui/index.ts src/renderer/src/texture/TextureCurveControls.tsx src/renderer/src/texture/TextureEditor.tsx src/renderer/src/texture/textureEditor.css src/renderer/src/texture/textureSettings.ts src/renderer/src/texture/texturePreviewProcessing.ts src/renderer/src/texture/texturePreviewProcessing.test.ts
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Validate editor
        working-directory: editor
        run: |
          npm run typecheck
          npm test -- --run src/renderer/src/ui/UiCurveEditor.test.tsx src/renderer/src/texture/texturePreviewProcessing.test.ts src/renderer/src/texture/TextureEditor.test.tsx src/renderer/src/texture/TextureStage3Controls.test.tsx
      - name: Configure native
        run: cmake -S . -B out/build/stage5 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DARC_BUILD_ENGINE_TESTS=ON
      - name: Build native
        run: cmake --build out/build/stage5 --target arc_render_tools_tests arc-editor-host -j2
      - name: Test native
        run: ctest --test-dir out/build/stage5 -R arc_render_tools_tests --output-on-failure
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Stage 5 texture curve editor"
          git push origin HEAD:feat/texture-curve-editor-stage5
