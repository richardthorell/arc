name: Temp Format Material Functions

on:
  push:
    branches:
      - feature/material-shader-functions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/material-shader-functions
          fetch-depth: 0

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Format Stage 12 sources
        run: |
          clang-format-18 -i \
            engine/render-tools/inc/arc/render_tools/material_graph.h \
            engine/render-tools/src/common/material_function.cpp \
            engine/render-tools/src/common/material_graph_codegen.cpp \
            engine/render-tools/src/common/material_graph_ir.cpp \
            tools/asset_cooker/material_processor.cpp

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/render-tools/inc/arc/render_tools/material_graph.h \
            engine/render-tools/src/common/material_function.cpp \
            engine/render-tools/src/common/material_graph_codegen.cpp \
            engine/render-tools/src/common/material_graph_ir.cpp \
            tools/asset_cooker/material_processor.cpp
          if ! git diff --cached --quiet; then
            git commit -m "style: format material function implementation"
            git push origin HEAD:feature/material-shader-functions
          fi
