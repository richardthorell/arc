name: Apply M3.3 terrain sculpt payload strokes

on:
  push:
    branches:
      - m3/terrain-sculpt-payload-strokes

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: persist M3.3 sculpt strokes to terrain layers'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m3/terrain-sculpt-payload-strokes
          fetch-depth: 0
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Apply M3.3 integration
        run: python3 tools/m3_3_patch.py
      - name: Format native changes
        run: |
          clang-format-18 -i \
            engine/scene/inc/arc/scene/terrain_asset.h \
            engine/scene/src/common/terrain_asset.cpp \
            engine/scene/src/common/terrain_edit_layers.cpp \
            engine/scene/inc/arc/scene/terrain_evaluator.h \
            engine/scene/src/common/terrain_evaluator.cpp \
            engine/scene/inc/arc/scene/terrain.h \
            engine/scene/src/common/terrain.cpp \
            engine/scene/tests/terrain_m3_sculpt_stroke_tests.cpp \
            editor/native/src/arc_host_base.inc
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine editor
          git commit -m 'feat: persist M3.3 sculpt strokes to terrain layers'
          git push origin HEAD:m3/terrain-sculpt-payload-strokes
