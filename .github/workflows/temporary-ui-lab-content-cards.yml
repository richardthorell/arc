name: Temporary UI Lab content cards validation

on:
  push:
    branches:
      - ui-lab/content-browser-cards

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-lab/content-browser-cards
      - name: Apply UI Lab patch
        run: python3 scripts/temporary_patch_ui_lab_content_cards.py
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Format changed editor files
        working-directory: editor
        run: npx prettier --write src/renderer/src/uiLab/UiLab.tsx src/renderer/src/uiLab/UiLabContentCards.tsx src/renderer/src/uiLab/UiLabContentCards.test.tsx src/renderer/src/uiLab/uiLabContentCards.css
      - name: Typecheck editor
        working-directory: editor
        run: npm run typecheck
      - name: Test UI Lab content cards
        working-directory: editor
        run: npx vitest run src/renderer/src/uiLab/UiLabContentCards.test.tsx src/renderer/src/uiLab/UiLab.test.tsx --pool=threads --maxWorkers=1
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/uiLab/UiLab.tsx editor/src/renderer/src/uiLab/UiLabContentCards.tsx editor/src/renderer/src/uiLab/UiLabContentCards.test.tsx editor/src/renderer/src/uiLab/uiLabContentCards.css
          if ! git diff --cached --quiet; then
            git commit -m "Show Content Browser cards in UI Lab"
            git push origin HEAD:ui-lab/content-browser-cards
          fi
