permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/editor-host-contention
      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
      - name: Apply host contention fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('editor/native/src/arc_host_process_main.cpp')
          s = p.read_text()

          old = '''        if (renderer_running) return true;
        {
            std::lock_guard lock(setup_mutex_);
            setup_complete_ = false;
            setup_error_.clear();
        }
        if (!running_.exchange(true))
            render_task_ = jobs_->submit({.name = "editor.shared_viewport",
                                          .priority = arc::jobs::job_priority::critical,
                                          .affinity = arc::jobs::job_affinity::render_thread},
                                         [this] { render_loop(); });
        std::unique_lock lock(setup_mutex_);
        if (!setup_cv_.wait_for(lock, std::chrono::seconds(10), [this] { return setup_complete_; }))
            setup_error_ = "Timed out creating shared viewport renderer";
        error = setup_error_;
        lock.unlock();
        if (!error.empty() && render_task_.valid()) (void)render_task_.wait_result();
        return error.empty();
'''
          new = '''        if (renderer_running) return true;
        {
            std::lock_guard lock(setup_mutex_);
            setup_complete_ = false;
            setup_error_.clear();
        }
        if (!running_.exchange(true))
            render_task_ = jobs_->submit({.name = "editor.shared_viewport",
                                          .priority = arc::jobs::job_priority::critical,
                                          .affinity = arc::jobs::job_affinity::render_thread},
                                         [this] { render_loop(); });
        // Shared viewport setup runs on the render thread. Do not synchronously wait here:
        // this function is called by the stdin command loop and a wait stalls every editor
        // query/command while Vulkan is starting. Setup failures are reported by the render
        // thread and the viewport can be recreated by the renderer if needed.
        error.clear();
        return true;
'''
          if old not in s: raise SystemExit('create_shared block not found')
          s = s.replace(old, new, 1)

          old = '''        {
            std::lock_guard lock(host_mutex_);
            host_->request_viewport(arc::editor::host_viewport_request{.viewport_id = viewport_id_,
                                                                       .frame_index = frame_index_++,
                                                                       .width = value.width,
                                                                       .height = value.height});
            auto present = backend_->present_surface_frame(value.width, value.height);
            rendered = present.has_value();
            if (!rendered) message = std::move(present.error().message);
        }
'''
          new = '''        {
            std::lock_guard lock(host_mutex_);
            host_->request_viewport(arc::editor::host_viewport_request{.viewport_id = viewport_id_,
                                                                       .frame_index = frame_index_++,
                                                                       .width = value.width,
