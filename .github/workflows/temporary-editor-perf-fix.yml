name: Temporary editor performance fix
"on":
  push:
    branches: [perf/editor-host-contention]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/editor-host-contention
      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
      - name: Apply patch
        run: python3 .github/scripts/temporary_editor_perf_fix.py
      - name: Validate TypeScript
        run: |
          npm ci --prefix editor
          npm run typecheck --prefix editor
      - name: Validate native host
        run: |
          cmake -S . -B out/build/perf-fix -G Ninja -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/perf-fix --target arc_host_process --parallel 2
      - name: Commit implementation
        run: |
          rm .github/workflows/temporary-editor-perf-fix.yml .github/scripts/temporary_editor_perf_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reduce editor host contention and request backlog'
          git push
