name: Temporary model import inspect 2
on:
  push:
    branches:
      - feature/model-drag-drop-obj
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-drag-drop-obj
      - name: Inspect
        run: |
          echo '=== entity commands ==='
          grep -RInE "entity\.create|createEntity|host_create_entity|setMaterial|__arc_mesh__|viewport\.pick" editor/src editor/native --include='*.ts' --include='*.tsx' --include='*.cpp' --include='*.h' | head -n 700 || true
          echo '=== workbench create snippets ==='
          grep -n -A20 -B20 "entity.create\|host.command('entity" editor/src/renderer/src/app/Workbench.tsx | head -n 500 || true
