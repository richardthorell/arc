name: Temporary model import inspect 2
on:
  push:
    branches:
      - feature/model-drag-drop-obj
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-drag-drop-obj
      - name: Inspect
        run: |
          echo '=== create execution ==='
          grep -RIn -A40 -B15 "host_create_entity_command" editor/native/src editor/native/inc | head -n 900 || true
          echo '=== pick execution ==='
          grep -RInE -A45 -B20 "viewport\.pick|object_pick|pick_result|request_object_pick" editor/native engine/render editor/src | head -n 1200 || true
          echo '=== transform payload ==='
          grep -RIn -A20 -B10 "entity.setTransform" editor/src editor/native | head -n 500 || true
