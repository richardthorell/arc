name: Finish cubemap preview wiring

on:
  push:
    branches:
      - feat/tinyexr-texture-import

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: wire generic cubemap preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tinyexr-texture-import
          fetch-depth: 0

      - name: Wire generic texture previews into asset.thumbnail
        shell: python
        run: |
          from pathlib import Path

          path = Path('editor/native/src/arc_host_impl.inc')
          text = path.read_text()

          include_anchor = '#include <arc/editor/terrain_heightmap_io.h>\n'
          include_replacement = include_anchor + '#include <arc/editor/texture_preview.h>\n'
          if '#include <arc/editor/texture_preview.h>' not in text:
              assert include_anchor in text
              text = text.replace(include_anchor, include_replacement, 1)

          macro_anchor = '#define execute execute_base\n'
          if '#define asset_thumbnail asset_thumbnail_base' not in text:
              assert macro_anchor in text
              text = text.replace(macro_anchor, '#define asset_thumbnail asset_thumbnail_base\n' + macro_anchor, 1)

          undef_anchor = '#undef execute\n\nnamespace arc::editor\n'
          if '#undef asset_thumbnail' not in text:
              assert undef_anchor in text
              text = text.replace(undef_anchor, '#undef execute\n#undef asset_thumbnail\n\nnamespace arc::editor\n', 1)

          query_anchor = 'host_response arc_host::query(const host_query_envelope& query) const\n{\n'
          assert query_anchor in text

          method = r'''std::optional<host_asset_thumbnail_snapshot> arc_host::asset_thumbnail(std::string_view path,
                                                                       std::uint32_t max_size) const
{
    const auto resolved = resolve_editor_asset(state_->assets, state_->asset_registry.get(), state_->project.root,
                                               std::filesystem::path{path});
    if (!resolved) return std::nullopt;

    auto extension = resolved->path.extension().string();
    std::transform(extension.begin(), extension.end(), extension.begin(),
                   [](unsigned char value) { return static_cast<char>(std::tolower(value)); });
    const bool model_asset = extension == ".fbx" || extension == ".obj" || extension == ".glb" || extension == ".gltf";
    if (model_asset || is_material_asset_path(resolved->path) || !render::is_supported_texture_asset(resolved->path))
        return asset_thumbnail_base(path, max_size);

    const auto loaded = render::load_texture_asset(resolved->path);
    if (!loaded.succeeded()) return std::nullopt;

    const auto requested_size = std::clamp(max_size, 32u, 256u);
    const auto preview = build_texture_preview_image(loaded.texture, requested_size);
    if (!preview.valid()) return std::nullopt;
    const auto bmp = encode_texture_preview_bmp(preview);
    if (bmp.empty()) return std::nullopt;

    return host_asset_thumbnail_snapshot{.path = std::string(path),
                                         .width = preview.width,
                                         .height = preview.height,
                                         .data_url = "data:image/bmp;base64," + base64_encode(bmp)};
}

'''
          if 'arc_host::asset_thumbnail(std::string_view path' not in text:
              text = text.replace(query_anchor, method + query_anchor, 1)

          thumbnail_query = r'''    if (const auto* thumbnail_query = std::get_if<host_asset_thumbnail_query>(&query.payload))
    {
        const auto thumbnail = asset_thumbnail(thumbnail_query->path, thumbnail_query->max_size);
        host_response response;
        response.request_id = query.request_id;
        response.succeeded = thumbnail.has_value();
        if (thumbnail)
            response.payload_json = to_json(*thumbnail);
        else
            response.error = "Texture thumbnail could not be generated";
        response.scene_revision = state_->scene_revision;
        response.world_epoch = state_->world_epoch;
        response.frame_revision = state_->viewport_frame_index;
        return response;
    }
'''
          if 'std::get_if<host_asset_thumbnail_query>(&query.payload)' not in text:
              text = text.replace(query_anchor, query_anchor + thumbnail_query, 1)

          path.write_text(text)

          workflow = Path('.github/workflows/zz-finish-cubemap-preview.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/src/arc_host_impl.inc .github/workflows/zz-finish-cubemap-preview.yml
          git commit -m "feat(editor): preview cubemaps as texture crosses"
          git push origin HEAD:feat/tinyexr-texture-import
