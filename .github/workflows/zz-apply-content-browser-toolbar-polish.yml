name: Apply Content Browser Toolbar Polish

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'editor/content-browser-toolbar-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        shell: bash
        run: |
          python3 tools/ci/apply_content_browser_toolbar_polish.py
          rm tools/ci/apply_content_browser_toolbar_polish.py
          rm .github/workflows/zz-apply-content-browser-toolbar-polish.yml
      - name: Commit result
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "editor: use shared controls in content browser toolbar"
          git push origin HEAD:${{ github.head_ref }}
