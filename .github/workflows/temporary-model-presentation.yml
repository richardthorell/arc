name: Temporary model presentation
on:
  push:
    branches:
      - fix/model-asset-presentation-pr
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-asset-presentation-pr
      - name: Patch content browser presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          card = Path('editor/src/renderer/src/content/ContentAssetCard.tsx')
          text = card.read_text()
          text = text.replace("import { ContentAssetCard }", "import { ContentAssetCard }") if False else text
          text = text.replace(
              "import { UiFloatingSurface } from '../ui';\n",
              "import { UiFloatingSurface } from '../ui';\nimport { assetDragType, assetPresentationIcon, assetPresentationLabel } from './assetPresentation';\n",
              1,
          )
          start = text.index("const assetTypeLabels: Record<AssetItem['kind'], string> = {")
          end = text.index("};\n\nconst TOOLTIP_DELAY_MS", start) + 3
          text = text[:start] + text[end:]
          text = text.replace("<span>{assetTypeLabels[asset.kind]}</span>", "<span>{assetPresentationLabel(asset)}</span>")
          text = text.replace("<DocumentTypeIcon kind={asset.kind} size={12} />", "<DocumentTypeIcon kind={assetPresentationIcon(asset)} size={12} />")
          text = text.replace("<span>{assetTypeLabels[asset.kind]}</span>", "<span>{assetPresentationLabel(asset)}</span>")
          text = text.replace("JSON.stringify({ guid: asset.guid ?? '', type: asset.kind, pathHint: asset.path })", "JSON.stringify({ guid: asset.guid ?? '', type: assetDragType(asset), pathHint: asset.path })")
          card.write_text(text)

          browser = Path('editor/src/renderer/src/content/ContentBrowserPanel.tsx')
          text = browser.read_text()
          text = text.replace(
              "import { ContentAssetCard } from './ContentAssetCard';\n",
              "import { ContentAssetCard } from './ContentAssetCard';\nimport { assetPresentationKind, type AssetPresentationKind } from './assetPresentation';\n",
              1,
          )
          text = text.replace("  { value: 'scene', label: 'Scene' },\n  { value: 'mesh', label: 'Mesh' },", "  { value: 'scene', label: 'Scene' },\n  { value: 'model', label: 'Model' },\n  { value: 'mesh', label: 'Mesh' },", 1)
          text = text.replace("const [kind, setKind] = useState<AssetItem['kind'] | 'all'>('all');", "const [kind, setKind] = useState<AssetPresentationKind | 'all'>('all');", 1)
          text = text.replace("(kind === 'all' || asset.kind === kind)", "(kind === 'all' || assetPresentationKind(asset) === kind)", 1)
          text = text.replace("const a = sort === 'name' ? left.name : sort === 'type' ? left.kind : left.status;", "const a = sort === 'name' ? left.name : sort === 'type' ? assetPresentationKind(left) : left.status;", 1)
          text = text.replace("const b = sort === 'name' ? right.name : sort === 'type' ? right.kind : right.status;", "const b = sort === 'name' ? right.name : sort === 'type' ? assetPresentationKind(right) : right.status;", 1)
          browser.write_text(text)
          PY
      - name: Add tests
        run: |
          cat > editor/src/renderer/src/content/assetPresentation.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import type { AssetItem } from '../services/editorHostTypes';
          import { assetDragType, assetPresentationIcon, assetPresentationKind, assetPresentationLabel } from './assetPresentation';

          const asset = (path: string, kind: AssetItem['kind'] = 'scene') => ({ kind, path });

          describe('model asset presentation', () => {
            for (const extension of ['fbx', 'obj', 'glb', 'gltf']) {
              it(`presents .${extension} imported scenes as models`, () => {
                const value = asset(`Content/Models/robot.${extension}`);
                expect(assetPresentationKind(value)).toBe('model');
                expect(assetPresentationLabel(value)).toBe('Model');
                expect(assetPresentationIcon(value)).toBe('mesh');
                expect(assetDragType(value)).toBe('mesh');
              });
            }

            it('keeps native ARC scenes as scenes', () => {
              const value = asset('Content/Scenes/demo.arcscene');
              expect(assetPresentationKind(value)).toBe('scene');
              expect(assetPresentationLabel(value)).toBe('Scene');
            });

            it('keeps actual mesh assets as meshes', () => {
              const value = asset('Content/Meshes/cube.arcmesh', 'mesh');
              expect(assetPresentationKind(value)).toBe('mesh');
              expect(assetPresentationIcon(value)).toBe('mesh');
              expect(assetDragType(value)).toBe('mesh');
            });
          });
          EOF
      - name: Validate
        working-directory: editor
        run: |
          npm ci
          npx prettier --write src/renderer/src/content/ContentAssetCard.tsx src/renderer/src/content/ContentBrowserPanel.tsx src/renderer/src/content/assetPresentation.ts src/renderer/src/content/assetPresentation.test.ts
          npm run typecheck
          npx vitest run src/renderer/src/content/assetPresentation.test.ts src/renderer/src/viewport/viewportAssetDrop.test.ts
      - name: Cleanup and commit
        run: |
          rm .github/workflows/temporary-model-presentation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Present imported model sources as models'
          git push
