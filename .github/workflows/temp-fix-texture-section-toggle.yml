name: Temp Fix Texture Section Toggle

on:
  push:
    branches:
      - feat/texture-editor-view

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/texture-editor-view
      - name: Fix section toggle keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('editor/src/renderer/src/texture/TextureEditor.tsx')
          s = p.read_text().replace("toggleSection('vmipmaps')", "toggleSection('mipmaps')").replace("toggleSection('tstreaming')", "toggleSection('streaming')")
          p.write_text(s)
          PY
          rm .github/workflows/temp-fix-texture-section-toggle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/texture/TextureEditor.tsx .github/workflows/temp-fix-texture-section-toggle.yml
          git commit -m "Fix texture section toggle keys"
          git push
