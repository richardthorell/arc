name: Flow F1 Integration Patch

on:
  push:
    branches:
      - feature/flow-graph-f1-language-editor

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/flow-graph-f1-language-editor
          fetch-depth: 0

      - name: Apply Flow F1 Integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_flow_f1_integration.py
          git rm .github/scripts/apply_flow_f1_integration.py .github/workflows/flow-f1-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/content/ContentBrowserPanel.tsx editor/native/src/arc_host_base.inc
          git diff --cached --check
          git commit -m "feat: integrate Flow assets with content discovery"
          git push origin HEAD:feature/flow-graph-f1-language-editor
