name: Skeleton Stage 3

on:
  push:
    branches:
      - feat/skeleton-editor-visualization

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skeleton-editor-visualization
          fetch-depth: 0

      - name: Apply Stage 3 implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_skeleton_stage3_patch.py')
          text = path.read_text()
          text = text.replace("needle = '''    if (type == \"viewport.cameraInput\")\\n    {\\n'''", "needle = '''    else if (type == \"viewport.cameraInput\")\\n    {\\n'''")
          text = text.replace("addition = '''    if (type == \"viewport.setSkeletonJoint\")\\n", "addition = '''    else if (type == \"viewport.setSkeletonJoint\")\\n")
          path.write_text(text)
          PY
          python3 tools/apply_skeleton_stage3_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/src/renderer/src/inspector/SkeletonInspector.test.tsx')
          text = path.read_text().replace("expect(screen.getByText('Hips')).toBeVisible();", "expect(screen.getAllByText('Hips')[0]).toBeVisible();")
          path.write_text(text)
          PY

      - name: Format native changes
        run: |
          clang-format-18 -i \
            editor/native/inc/arc/editor/editor_state.h \
            editor/native/src/editor_state.cpp \
            editor/native/inc/arc/editor/editor_gizmo.h \
            editor/native/src/editor_gizmo.cpp \
            editor/native/inc/arc/editor/host_protocol_base.h \
            editor/native/src/host_protocol_base.inc \
            editor/native/src/arc_host_base.inc \
            editor/native/src/arc_host.cpp \
            editor/native/tests/skinned_scene_import_tests.cpp

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Format editor UI changes
        working-directory: editor
        run: npx prettier --write src/renderer/src/viewport/ViewportPanel.tsx src/renderer/src/inspector/inspectorTypes.ts src/renderer/src/inspector/InspectorPanel.tsx src/renderer/src/inspector/SkeletonInspector.tsx src/renderer/src/inspector/SkeletonInspector.test.tsx src/renderer/src/inspector/skeletonInspector.css

      - name: Test and typecheck editor UI
        working-directory: editor
        run: |
          npx vitest run src/renderer/src/inspector/SkeletonInspector.test.tsx
          npm run typecheck

      - name: Configure native tests
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B out/build/skeleton-stage3 -G Ninja \
            -DARC_BUILD_EDITOR=ON \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_BUILD_ASSET_COOKER=OFF \
            -DARC_BUILD_PROJECT_TOOL=OFF \
            -DARC_BUILD_ENGINE_TESTS=ON

      - name: Build native editor tests
        run: cmake --build out/build/skeleton-stage3 --target arc_editor_host_tests -j2

      - name: Run skeleton tests
        run: out/build/skeleton-stage3/editor/native/tests/arc_editor_host_tests "[skeleton]"

      - name: Verify formatting
        run: |
          python3 tools/check_format.py --clang-format clang-format-18
          git diff --check

      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/skeleton-stage3-temp.yml tools/apply_skeleton_stage3_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Show imported skeletons in the editor"
          git push origin HEAD:feat/skeleton-editor-visualization
