name: Temporary implement model drop
on:
  push:
    branches: [feature/model-drag-drop-obj]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-drag-drop-obj
          fetch-depth: 0
      - name: Apply viewport mesh drop patch
        run: python3 .github/model_phase2.py
      - name: Validate editor
        working-directory: editor
        run: |
          npm ci
          npx prettier --write src/renderer/src/viewport/ViewportPanel.tsx src/renderer/src/viewport/viewportAssetDrop.ts src/renderer/src/viewport/viewportAssetDrop.test.ts
          npm run typecheck
          npx vitest run src/renderer/src/viewport/viewportAssetDrop.test.ts
      - name: Format native host
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y clang-format-18 >/dev/null
          clang-format-18 -i editor/native/src/arc_host_base.inc
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor
          git commit -m 'Instantiate dropped meshes in the viewport'
          git push origin HEAD:feature/model-drag-drop-obj
