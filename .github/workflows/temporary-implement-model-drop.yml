name: Temporary implement model drop
on:
  push:
    branches: [feature/model-drag-drop-obj]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-drag-drop-obj
          fetch-depth: 0
      - name: Patch editor model import bridge
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise RuntimeError(f'missing pattern in {path}: {old[:80]}')
              p.write_text(text.replace(old,new,1))

          p='editor/src/preload/preload.ts'
          rep(p,"} from './externalTextureImport';\n","} from './externalTextureImport';\nimport { importExternalModel, isSupportedModelPath, type ExternalModelImportResult } from './externalModelImport';\n")
          rep(p,"const waitForImportedTexture = async (relativePath: string): Promise<ImportedHostAsset> => {\n","const importDroppedModel = async (file: File, destinationFolder?: string): Promise<ExternalModelImportResult> => {\n  const sourcePath = webUtils.getPathForFile(file);\n  if (!sourcePath) throw new Error(`Could not resolve dropped file '${file.name}'`);\n  const snapshot = (await ipcRenderer.invoke('project:snapshot')) as ArcProjectBrowserSnapshot | null;\n  const project = snapshot?.activeProject;\n  if (!project) throw new Error('Open an ARC project before importing models');\n  return importExternalModel(sourcePath, project, destinationFolder);\n};\n\nconst waitForImportedAsset = async (relativePath: string, label = 'asset'): Promise<ImportedHostAsset> => {\n")
          rep(p,"if (asset?.state === 'failed') throw new Error(asset.diagnostic || `Texture import failed: ${relativePath}`);","if (asset?.state === 'failed') throw new Error(asset.diagnostic || `${label} import failed: ${relativePath}`);")
          rep(p,"throw new Error(`Timed out waiting for texture import: ${relativePath}`);","throw new Error(`Timed out waiting for ${label} import: ${relativePath}`);")
          rep(p,"const replayImportedAssetDrop = (target: Element, asset: ImportedHostAsset): void => {","const replayImportedAssetDrop = (target: Element, asset: ImportedHostAsset, type = asset.typeId, coordinates?: { clientX: number; clientY: number }): void => {")
          rep(p,"      type: asset.typeId,","      type,")
          rep(p,"  target.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer }));","  target.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer, clientX: coordinates?.clientX ?? 0, clientY: coordinates?.clientY ?? 0 }));")
          rep(p,"const installExternalTextureDropHandling = (): void => {","const externalModelFiles = (event: DragEvent): File[] => Array.from(event.dataTransfer?.files ?? []).filter((file) => {\n  const sourcePath = webUtils.getPathForFile(file);\n  return Boolean(sourcePath && isSupportedModelPath(sourcePath));\n});\n\nconst installExternalAssetDropHandling = (): void => {")
          rep(p,"    const files = externalTextureFiles(event);\n    if (!files.length) return;\n    event.preventDefault();\n\n    const pickerTarget = event.target instanceof Element ? event.target.closest('.asset-reference-control') : null;","    const files = externalTextureFiles(event);\n    const modelFiles = externalModelFiles(event);\n    if (!files.length && !modelFiles.length) return;\n    const target = event.target instanceof Element ? event.target : null;\n    if (modelFiles.length && target?.closest('.content-browser-v2')) return;\n    event.preventDefault();\n\n    const pickerTarget = target?.closest('.asset-reference-control') ?? null;\n    const viewportTarget = target?.closest('.arc-viewport-body') ?? null;\n    const dropCoordinates = { clientX: event.clientX, clientY: event.clientY };")
          rep(p,"        const asset = await waitForImportedTexture(pickerImport.path);","        const asset = await waitForImportedAsset(pickerImport.path, 'texture');")
          rep(p,"        replayImportedAssetDrop(pickerTarget, asset);","        replayImportedAssetDrop(pickerTarget, asset);\n\n        if (viewportTarget) {\n          for (const file of modelFiles) {\n            const imported = await importDroppedModel(file);\n            const modelAsset = await waitForImportedAsset(imported.path, 'model');\n            await sleep(75);\n            replayImportedAssetDrop(viewportTarget, modelAsset, 'mesh', dropCoordinates);\n          }\n        }")
          rep(p,"    importTexture: (file: File): Promise<ExternalTextureImportResult> => importDroppedTexture(file),","    importTexture: (file: File): Promise<ExternalTextureImportResult> => importDroppedTexture(file),\n    importModel: (file: File, destinationFolder?: string): Promise<ExternalModelImportResult> => importDroppedModel(file, destinationFolder),")
          rep(p,"installExternalTextureDropHandling();","installExternalAssetDropHandling();")

          p='editor/src/renderer/src/content/ContentBrowserPanel.tsx'
          rep(p,"const folderKey = (source: LocalBrowserSource, path: string) => `${source}:${normalizedPath(path)}`;","const folderKey = (source: LocalBrowserSource, path: string) => `${source}:${normalizedPath(path)}`;\nconst modelFileExtensions = new Set(['fbx', 'glb', 'gltf', 'obj']);\nconst isModelFile = (file: File) => modelFileExtensions.has(file.name.split('.').at(-1)?.toLocaleLowerCase() ?? '');")
          rep(p,"      onDrop={(event) => {\n        if (!activeOnlineSource && event.dataTransfer.files.length > 0) onCommand('file.importScene');\n      }}","      onDrop={(event) => {\n        if (activeOnlineSource || !project) return;\n        const files = Array.from(event.dataTransfer.files).filter(isModelFile);\n        if (!files.length) return;\n        event.preventDefault();\n        event.stopPropagation();\n        const destination = projectFolderPath(folder);\n        void Promise.all(files.map((file) => window.arc.projects.importModel(file, destination))).catch((error) => console.error('[ARC] Model import failed', error));\n      }}")

          p='editor/src/renderer/src/inspector/SchemaComponents.tsx'
          rep(p,"const meshAssetExtensions = ['.glb', '.gltf', '.fbx'] as const;","const meshAssetExtensions = ['.glb', '.gltf', '.fbx', '.obj'] as const;")
          p='editor/src/main/main.ts'
          rep(p,"{ name: 'Scene Assets', extensions: ['arcscene', 'glb', 'gltf', 'fbx', 'scene'] },","{ name: 'Scene Assets', extensions: ['arcscene', 'glb', 'gltf', 'fbx', 'obj', 'scene'] },")
      - name: Format and validate editor
        working-directory: editor
        run: |
          npm ci
          npx prettier --write src/preload/externalModelImport.ts src/preload/preload.ts src/renderer/src/content/ContentBrowserPanel.tsx src/renderer/src/inspector/SchemaComponents.tsx src/main/main.ts
          npm run typecheck
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor
          git commit -m 'Add external model drag and drop import'
          git push origin HEAD:feature/model-drag-drop-obj
