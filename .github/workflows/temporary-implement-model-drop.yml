import os from 'node:os';
import path from 'node:path';
import { afterEach, describe, expect, it } from 'vitest';

import { importExternalModel, isSupportedModelPath } from './externalModelImport';
import type { ProjectSnapshot } from './assetSourceBridge';

const temporaryRoots: string[] = [];
const makeRoot = () => {
  const root = fs.mkdtempSync(path.join(os.tmpdir(), 'arc-model-import-'));
  temporaryRoots.push(root);
  return root;
};
const projectAt = (root: string, writable = true): ProjectSnapshot => ({
  name: 'Test',
  descriptorPath: path.join(root, 'Test.arcproject'),
  projectRoot: root,
  engineVersion: 'dev',
  writable,
  sourceControl: false,
  assets: [],
  renderStats: { fps: 0, frameTimeMs: 0, drawCalls: 0 },
});

afterEach(() => {
  for (const root of temporaryRoots.splice(0)) fs.rmSync(root, { recursive: true, force: true });
});

describe('external model import', () => {
  it('recognizes supported model formats including OBJ', () => {
    for (const file of ['mesh.FBX', 'mesh.glb', 'mesh.gltf', 'mesh.obj']) expect(isSupportedModelPath(file)).toBe(true);
    expect(isSupportedModelPath('mesh.dae')).toBe(false);
  });

  it('copies into the requested Content folder and avoids overwriting files', () => {
    const root = makeRoot();
    const external = makeRoot();
    const source = path.join(external, 'crate.obj');
    fs.writeFileSync(source, 'v 0 0 0\n');
    const first = importExternalModel(source, projectAt(root), 'Content/Props');
    const second = importExternalModel(source, projectAt(root), 'Content/Props');
    expect(first.path).toBe('Content/Props/crate.obj');
    expect(second.path).toBe('Content/Props/crate_1.obj');
    expect(fs.readFileSync(path.join(root, first.path), 'utf8')).toBe('v 0 0 0\n');
  });

  it('defaults to Content/Models and rejects unsafe destinations', () => {
    const root = makeRoot();
    const external = makeRoot();
    const source = path.join(external, 'crate.glb');
    fs.writeFileSync(source, 'data');
    expect(importExternalModel(source, projectAt(root)).path).toBe('Content/Models/crate.glb');
    expect(() => importExternalModel(source, projectAt(root), '../escape')).toThrow();
    expect(() => importExternalModel(source, projectAt(root), 'Other')).toThrow();
    expect(() => importExternalModel(source, projectAt(root, false))).toThrow('read-only');
  });
});
''')

