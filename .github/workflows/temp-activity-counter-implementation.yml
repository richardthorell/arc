name: Temporary Activity Counter Implementation

on:
  push:
    branches: [feature/activity-bar-counters]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-bar-counters
          fetch-depth: 0

      - name: Apply changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          Path('editor/src/renderer/src/layout/ActivityBar.tsx').write_text(r'''import { useEffect, useState } from 'react';
          import type { ComponentProps, ReactNode } from 'react';
          import { Settings } from 'lucide-react';

          import { activityRegistry } from '../app/panelRegistry';
          import type { ActivityId, ActivityRegistration } from '../app/workbenchTypes';
          import { UiButton } from '../ui';

          import './ActivityBar.css';

          type ActivityBarButtonProps = Omit<ComponentProps<typeof UiButton>, 'children'> & {
            children: ReactNode;
            counter?: number;
            counterLabel?: string;
          };

          export function ActivityBarButton({
            children,
            className = '',
            counter = 0,
            counterLabel,
            ...props
          }: ActivityBarButtonProps) {
            const showCounter = Number.isFinite(counter) && counter > 0;
            return (
              <UiButton className={['activity-button', className].filter(Boolean).join(' ')} {...props}>
                {children}
                {showCounter && (
                  <span
                    aria-label={counterLabel ?? `${counter} unread`}
                    className="activity-button-counter"
                    data-testid="activity-button-counter"
                  >
                    {counter}
                  </span>
                )}
              </UiButton>
            );
          }

          type ActivityBarProps = {
            activeActivity: ActivityId;
            expanded?: boolean;
            onExpandedChange?: (expanded: boolean) => void;
            onSelectActivity: (activity: ActivityId) => void;
            onSettings: () => void;
          };

          const utilityActivities = activityRegistry.filter((activity) => activity.id !== 'scene');

          export function ActivityBar({
            activeActivity,
            expanded = false,
            onExpandedChange,
            onSelectActivity,
            onSettings,
          }: ActivityBarProps) {
            const [versionControlCount, setVersionControlCount] = useState(0);

            useEffect(() => {
              let disposed = false;
              const refreshVersionControlCount = () => {
                const snapshot = window.arc?.sourceControl?.snapshot;
                if (!snapshot) return;
                void snapshot()
                  .then((next) => {
                    if (!disposed) setVersionControlCount(next?.available ? next.files.length : 0);
                  })
                  .catch(() => {
                    if (!disposed) setVersionControlCount(0);
                  });
              };

              refreshVersionControlCount();
              const interval = window.setInterval(refreshVersionControlCount, 2500);
              window.addEventListener('focus', refreshVersionControlCount);
              return () => {
                disposed = true;
                window.clearInterval(interval);
                window.removeEventListener('focus', refreshVersionControlCount);
              };
            }, []);

            const renderActivity = (activity: ActivityRegistration) => {
              const Icon = activity.icon;
              const active = expanded && activeActivity === activity.id;
              const counter = activity.id === 'versionControl' ? versionControlCount : undefined;
              return (
                <ActivityBarButton
                  active={active}
                  aria-label={activity.title}
                  aria-pressed={active}
                  counter={counter}
                  counterLabel={counter ? `${counter} changed ${counter === 1 ? 'file' : 'files'}` : undefined}
                  key={activity.id}
                  onClick={() => {
                    if (activeActivity === activity.id && expanded) {
                      onExpandedChange?.(false);
                      return;
                    }
                    onSelectActivity(activity.id);
                    onExpandedChange?.(true);
                  }}
                  title={activity.title}
                  variant="ghost"
                >
                  <Icon size={20} />
                </ActivityBarButton>
              );
            };

            return (
              <aside className="activity-bar utility-rail" aria-label="Global utilities">
                <div className="activity-items">{utilityActivities.map(renderActivity)}</div>
                <div className="activity-footer">
                  <ActivityBarButton
                    aria-label="Settings"
                    aria-haspopup="dialog"
                    onClick={onSettings}
                    title="Settings"
                    variant="ghost"
                  >
                    <Settings size={20} />
                  </ActivityBarButton>
                </div>
              </aside>
            );
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          Path('editor/src/renderer/src/layout/ActivityBar.css').write_text(r'''.activity-group-spaced {
            margin-top: auto;
          }

          .activity-bar {
            align-items: stretch;
            padding: var(--arc-space-4) var(--arc-space-2);
          }

          .activity-items {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
          }

          .activity-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: calc(100% - var(--arc-space-4));
            min-width: 0;
            height: 38px;
            margin: 0 var(--arc-space-2) var(--arc-space-2);
            padding: 0 var(--arc-space-3);
            border-radius: var(--arc-radius-3);
            font-size: var(--arc-text-sm);
            line-height: var(--arc-line-tight);
          }

          .activity-bar:not(.activity-bar-expanded) .activity-button {
            width: calc(var(--arc-activity-collapsed-width) - var(--arc-space-4));
            min-width: calc(var(--arc-activity-collapsed-width) - var(--arc-space-4));
          }

          .activity-button span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            white-space: nowrap;
          }

          .activity-bar-expanded .activity-button {
            justify-content: flex-start;
            gap: var(--arc-space-4);
            padding: 0 var(--arc-space-5);
          }

          .activity-button.active,
          .activity-button.is-active {
            color: var(--arc-color-text-strong);
            border-color: rgba(47, 129, 247, 0.2);
            background: rgba(31, 64, 116, 0.72);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
          }

          .activity-button.active::before {
            display: none;
          }

          .activity-collapse-button {
            align-self: center;
            margin-top: var(--arc-space-4);
          }

          .activity-button .activity-button-counter {
            position: absolute;
            top: -3px;
            right: -3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            overflow: visible;
            border: 2px solid var(--arc-color-bg-chrome);
            border-radius: 999px;
            color: var(--arc-color-text-inverse);
            background: var(--arc-color-accent);
            font-size: var(--arc-text-xxs);
            font-weight: 700;
            line-height: 13px;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          workbench = Path('editor/src/renderer/src/app/workbench.css')
          css = workbench.read_text(encoding='utf-8')
          start = css.index('.activity-group-spaced {')
          end = css.index('.ui-tree-row.tree-row {', start)
          workbench.write_text(css[:start] + css[end:], encoding='utf-8')

          test = Path('editor/src/renderer/src/layout/ActivityBar.test.tsx')
          text = test.read_text(encoding='utf-8')
          text = text.replace("import { ActivityBar } from './ActivityBar';", "import { ActivityBar, ActivityBarButton } from './ActivityBar';")
          addition = '''describe('ActivityBarButton', () => {
            it('only renders the optional counter when it is greater than zero', () => {
              const { rerender } = render(
                <ActivityBarButton aria-label="Repository" counter={0} variant="ghost">
                  Repository
                </ActivityBarButton>,
              );
              expect(screen.queryByTestId('activity-button-counter')).not.toBeInTheDocument();

              rerender(
                <ActivityBarButton aria-label="Repository" counter={7} counterLabel="7 changed files" variant="ghost">
                  Repository
                </ActivityBarButton>,
              );
              expect(screen.getByTestId('activity-button-counter')).toHaveTextContent('7');
              expect(screen.getByLabelText('7 changed files')).toBeInTheDocument();
            });
          });

          '''.replace('\n          ', '\n')
          text = text.replace("describe('ActivityBar', () => {\n", addition + "describe('ActivityBar', () => {\n", 1)
          test.write_text(text, encoding='utf-8')

          lab = Path('editor/src/renderer/src/uiLab/UiLab.tsx')
          text = lab.read_text(encoding='utf-8')
          text = text.replace('  Check,\n  ChevronRight,', '  Check,\n  ChevronRight,\n  GitBranch,')
          text = text.replace("import { MenuBar } from '../layout/MenuBar';", "import { ActivityBarButton } from '../layout/ActivityBar';\nimport { MenuBar } from '../layout/MenuBar';")
          marker = '          <LabCard title="Select button" caption="UiSelectButton">\n'
          card = '''          <LabCard title="Side-bar button" caption="ActivityBarButton">
            <div className="ui-lab-row">
              <div className="activity-bar" style={{ width: '56px', padding: 0 }}>
                <ActivityBarButton aria-label="Repository without changes" title="Version Control" variant="ghost">
                  <GitBranch size={20} />
                </ActivityBarButton>
              </div>
              <div className="activity-bar" style={{ width: '56px', padding: 0 }}>
                <ActivityBarButton
                  aria-label="Repository with changes"
                  counter={7}
                  counterLabel="7 changed files"
                  title="Version Control"
                  variant="ghost"
                >
                  <GitBranch size={20} />
                </ActivityBarButton>
              </div>
            </div>
          </LabCard>
          '''
          if marker not in text:
            raise SystemExit('UiLab insertion marker not found')
          lab.write_text(text.replace(marker, card + marker, 1), encoding='utf-8')

          lab_test = Path('editor/src/renderer/src/uiLab/UiLab.test.tsx')
          text = lab_test.read_text(encoding='utf-8')
          needle = "    expect(screen.getByText('Buttons')).toBeInTheDocument();\n"
          replacement = needle + "    expect(screen.getByRole('button', { name: 'Repository without changes' })).toBeInTheDocument();\n    expect(screen.getByLabelText('7 changed files')).toHaveTextContent('7');\n"
          lab_test.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        working-directory: editor
        run: npm ci

      - name: Test
        working-directory: editor
        run: npx vitest run src/renderer/src/layout/ActivityBar.test.tsx src/renderer/src/uiLab/UiLab.test.tsx

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/temp-activity-counter-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898218+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add activity bar counters"
          git push origin HEAD:feature/activity-bar-counters
