name: Fix main formatting temporary

on:
  push:
    branches:
      - fix/main-formatting
    paths:
      - .github/workflows/fix-main-formatting-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/main-formatting

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci --prefix editor

      - name: Apply formatting
        run: |
          python3 tools/check_format.py --clang-format clang-format-18 --fix
          npm run format --prefix editor

      - name: Verify formatting
        run: |
          python3 tools/check_format.py --clang-format clang-format-18
          npm run format:check --prefix editor

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "Fix repository formatting"
          git push origin HEAD:fix/main-formatting
