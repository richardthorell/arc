name: Temporary Format 356

on:
  push:
    branches: [assets/356-complete-metadata-search]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Up Node 22.23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install Electron Dependencies
        run: npm ci --prefix editor
      - name: Format Changed Editor Files
        run: |
          cd editor
          npx prettier --write \
            src/renderer/src/content/AssetMetadataDialog.tsx \
            src/renderer/src/content/ContentBrowserPanel.tsx \
            src/renderer/src/content/assetMetadataStore.test.ts \
            src/renderer/src/content/assetMetadataStore.ts \
            src/renderer/src/ui/UiTextInput.tsx
      - name: Commit Formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/content/AssetMetadataDialog.tsx \
            editor/src/renderer/src/content/ContentBrowserPanel.tsx \
            editor/src/renderer/src/content/assetMetadataStore.test.ts \
            editor/src/renderer/src/content/assetMetadataStore.ts \
            editor/src/renderer/src/ui/UiTextInput.tsx
          git commit -m "Format asset metadata implementation"
          git push origin HEAD:${GITHUB_REF_NAME}
