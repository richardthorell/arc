          new_map = '''              {filtered.map((asset) => {\n                const modelSubassets = assetPresentationKind(asset) === 'model' ? buildModelSubassets(asset) : [];\n                const expanded = expandedModels.has(asset.id);\n                return (\n                  <Fragment key={asset.id}>\n                    <ContentAssetCard\n                      asset={asset}\n                      favorite={favorites.has(favoriteId(asset))}\n                      selected={selection.has(asset.id)}\n                      thumbnailProvider={thumbnailProvider}\n                      onActivate={() => activateAsset(asset)}\n                      onFavorite={() => toggleFavorite(asset)}\n                      onReimport={() => asset.guid && onAssetAction('asset.reimport', asset.guid)}\n                      onSelect={(additive) => select(asset, additive)}\n                      expandable={modelSubassets.length > 0}\n                      expanded={expanded}\n                      onToggleExpand={() =>\n                        setExpandedModels((current) => {\n                          const next = new Set(current);\n                          if (next.has(asset.id)) next.delete(asset.id);\n                          else next.add(asset.id);\n                          return next;\n                        })\n                      }\n                    />\n                    {expanded && modelSubassets.length > 0 && (\n                      <div className=\"content-model-subassets\" role=\"group\" aria-label={`${asset.name} sub-assets`}>\n                        {modelSubassets.map((subasset) => (\n                          <button\n                            className=\"content-model-subasset\"\n                            key={subasset.id}\n                            onDoubleClick={() => subasset.kind === 'skeleton' && openSkeletonEditorDocument(asset)}\n                          >\n                            <span aria-hidden=\"true\">{subasset.kind === 'skeleton' ? '◇' : '□'}</span>\n                            <span>{subasset.name}</span>\n                            <small>{subasset.kind === 'skeleton' ? 'Skeleton' : 'Mesh'}</small>\n                          </button>\n                        ))}\n                      </div>\n                    )}\n                  </Fragment>\n                );\n              })}'''
          replace('editor/src/renderer/src/content/ContentBrowserPanel.tsx', old_map, new_map)
          replace('editor/src/renderer/src/content/ContentBrowserPanel.tsx',
            "import './contentBrowser.css';",
            "import './contentBrowser.css';\nimport '../model/modelEditor.css';")

          Path('editor/src/renderer/src/editors/modelEditorRegistration.test.ts').write_text(r'''// @vitest-environment jsdom
import { FileText } from 'lucide-react';
import { describe, expect, it } from 'vitest';
import type { AssetItem } from '../services/editorHostTypes';
import { createEditorDocumentForAsset, createEditorRegistry } from './editorRegistry';

const registry = createEditorRegistry({ level: { kind: 'level', title: 'Level', icon: FileText, allowMultiple: false, render: () => null, renderToolbar: () => null } });
const fbx: AssetItem = { id: 'hand', guid: 'hand', name: 'Hand.fbx', path: 'Content/Hand.fbx', kind: 'scene', status: 'ready', meshCount: 1, skeletonBoneCount: 27 };

describe('model editor registration', () => {
  it('opens FBX models in the model editor while keeping skeletons as sub-assets', () => {
    const target = createEditorDocumentForAsset(fbx, registry);
    expect(target?.document).toMatchObject({ id: 'model:hand', kind: 'model', assetSnapshot: fbx });
    expect(target?.registration.kind).toBe('model');
  });
});
''')
