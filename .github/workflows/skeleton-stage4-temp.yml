name: Skeleton Stage 4

on:
  push:
    branches: [feat/skeleton-model-workflow]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply stage 4 model/skeleton workflow
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          Path('editor/src/renderer/src/model').mkdir(parents=True, exist_ok=True)

          Path('editor/src/renderer/src/model/modelSubassets.ts').write_text(r'''import type { AssetItem } from '../services/editorHostTypes';

export type ModelSubasset = {
  id: string;
  kind: 'mesh' | 'skeleton';
  name: string;
  meshIndex?: number;
};

const modelBaseName = (asset: Pick<AssetItem, 'name' | 'path'>) => {
  const raw = asset.name || asset.path.replaceAll('\\\\', '/').split('/').at(-1) || 'Model';
  return raw.replace(/\.(fbx|glb|gltf|obj)$/i, '');
};

export function hasSkeletonMetadata(asset: AssetItem) {
  return Boolean((asset.skeletonJoints?.length ?? 0) > 0 || (asset.skeletonBoneCount ?? 0) > 0);
}

export function buildModelSubassets(asset: AssetItem): ModelSubasset[] {
  const result: ModelSubasset[] = [];
  const meshCount = Math.max(0, Math.round(asset.meshCount ?? (asset.kind === 'mesh' ? 1 : 0)));
  for (let index = 0; index < meshCount; index += 1) {
    result.push({
      id: `${asset.guid ?? asset.path}:mesh:${index}`,
      kind: 'mesh',
      name: meshCount === 1 ? 'Mesh' : `Mesh ${index + 1}`,
      meshIndex: index,
    });
  }
  if (hasSkeletonMetadata(asset)) {
    result.push({
      id: `${asset.guid ?? asset.path}:skeleton`,
      kind: 'skeleton',
      name: asset.skeletonName?.trim() || `${modelBaseName(asset)} Skeleton`,
    });
  }
  return result;
}

export type SkeletonCompatibility = 'compatible' | 'partial' | 'incompatible';

export function skeletonCompatibility(source: AssetItem, candidate: AssetItem): SkeletonCompatibility {
  const sourceJoints = source.skeletonJoints ?? [];
  const candidateJoints = candidate.skeletonJoints ?? [];
  const sourceCount = source.skeletonBoneCount ?? sourceJoints.length;
  const candidateCount = candidate.skeletonBoneCount ?? candidateJoints.length;
  if (!sourceCount || !candidateCount || sourceCount !== candidateCount) return 'incompatible';
  if (sourceJoints.length && candidateJoints.length) {
    const sourceNames = sourceJoints.map((joint) => joint.name);
    const candidateNames = candidateJoints.map((joint) => joint.name);
    return sourceNames.every((name, index) => name === candidateNames[index]) ? 'compatible' : 'partial';
  }
  return 'partial';
}

export function skeletonHierarchyDepth(asset: AssetItem) {
  if (asset.skeletonHierarchyDepth !== undefined) return asset.skeletonHierarchyDepth;
  const joints = asset.skeletonJoints ?? [];
  if (!joints.length) return 0;
  const byIndex = new Map(joints.map((joint) => [joint.index, joint]));
  let depth = 0;
  for (const joint of joints) {
    let current = joint;
    let currentDepth = 1;
    const seen = new Set<number>();
    while (current.parent >= 0 && !seen.has(current.index)) {
      seen.add(current.index);
      const parent = byIndex.get(current.parent);
      if (!parent) break;
      current = parent;
      currentDepth += 1;
    }
    depth = Math.max(depth, currentDepth);
  }
  return depth;
}
''')

          Path('editor/src/renderer/src/model/ModelEditor.tsx').write_text(r'''import { useMemo, useState } from 'react';
import { Bone, Box, CheckCircle2, ExternalLink, TriangleAlert, XCircle } from 'lucide-react';

import { AssetPreviewPanel, AssetPreviewPlaceholder } from '../assetPreview/AssetPreviewPanel';
import { openSkeletonEditorDocument } from '../editors/editorRegistry';
import type { EditorDocument } from '../editors/editorTypes';
import type { AssetItem } from '../services/editorHostTypes';
import { UiButton } from '../ui';
import { buildModelSubassets, hasSkeletonMetadata, skeletonCompatibility } from './modelSubassets';

import './modelEditor.css';

type ProjectAssetsResponse = { succeeded?: boolean; payload?: { assets?: AssetItem[] } };

const compatibilityIcon = (value: ReturnType<typeof skeletonCompatibility>) =>
  value === 'compatible' ? <CheckCircle2 size={13} /> : value === 'partial' ? <TriangleAlert size={13} /> : <XCircle size={13} />;

export function ModelEditor({ document }: { document: EditorDocument }) {
  const asset = document.assetSnapshot;
  const [activeSection, setActiveSection] = useState<'model' | 'skeleton'>('model');
  const [candidateAssets, setCandidateAssets] = useState<AssetItem[]>([]);
  const [assignedSkeleton, setAssignedSkeleton] = useState(asset?.guid ?? asset?.path ?? '');
  const subassets = useMemo(() => (asset ? buildModelSubassets(asset) : []), [asset]);

  if (!asset) return <div className="model-editor-empty">Model metadata is unavailable.</div>;
  const skeleton = hasSkeletonMetadata(asset);
  const boneCount = asset.skeletonBoneCount ?? asset.skeletonJoints?.length ?? 0;

  const loadSkeletonCandidates = async () => {
    try {
      const response = (await window.arc.host.query('project.assets')) as ProjectAssetsResponse;
      setCandidateAssets((response.payload?.assets ?? []).filter(hasSkeletonMetadata));
    } catch {
      setCandidateAssets([]);
    }
  };

  return (
    <div className="model-editor-shell">
      <AssetPreviewPanel
        title={asset.name}
        subtitle={asset.path}
        metadata={[
          { label: 'Meshes', value: asset.meshCount ?? 0 },
          { label: 'Vertices', value: asset.vertexCount?.toLocaleString() ?? '—' },
          { label: 'Triangles', value: asset.triangleCount?.toLocaleString() ?? '—' },
          { label: 'Skeleton', value: skeleton ? `${boneCount} bones` : 'None' },
        ]}
      >
        <AssetPreviewPlaceholder
          label="Model preview"
          description={skeleton ? 'Skinned model with imported skeleton metadata.' : 'Static model preview.'}
        />
      </AssetPreviewPanel>

      <aside className="model-editor-sidebar">
        <div className="model-editor-tabs" role="tablist" aria-label="Model editor sections">
          <button className={activeSection === 'model' ? 'active' : ''} onClick={() => setActiveSection('model')}>
            <Box size={14} /> Model
          </button>
          <button
            className={activeSection === 'skeleton' ? 'active' : ''}
            disabled={!skeleton}
            onClick={() => setActiveSection('skeleton')}
          >
            <Bone size={14} /> Skeleton
          </button>
        </div>

        {activeSection === 'model' ? (
          <div className="model-editor-section">
            <h3>Sub-assets</h3>
            <div className="model-subasset-list">
              {subassets.map((subasset) => (
                <button
                  key={subasset.id}
                  className="model-subasset-row"
                  onDoubleClick={() => subasset.kind === 'skeleton' && openSkeletonEditorDocument(asset)}
                >
                  {subasset.kind === 'skeleton' ? <Bone size={14} /> : <Box size={14} />}
                  <span>{subasset.name}</span>
                  <small>{subasset.kind === 'skeleton' ? 'Skeleton' : 'Mesh'}</small>
                </button>
              ))}
              {!subassets.length && <p>No model sub-assets were reported by the importer.</p>}
            </div>
          </div>
        ) : (
          <div className="model-editor-section">
            <div className="model-editor-section-heading">
              <h3>{asset.skeletonName || 'Skeleton'}</h3>
              <UiButton type="button" variant="toolbar" onClick={() => openSkeletonEditorDocument(asset)}>
                Open <ExternalLink size={12} />
              </UiButton>
            </div>
            <dl className="model-skeleton-summary">
              <div><dt>Bones</dt><dd>{boneCount}</dd></div>
              <div><dt>Root</dt><dd>{asset.skeletonRootBone || asset.skeletonJoints?.find((joint) => joint.parent < 0)?.name || '—'}</dd></div>
              <div><dt>Hierarchy depth</dt><dd>{asset.skeletonHierarchyDepth ?? '—'}</dd></div>
              <div><dt>Bind pose</dt><dd>{asset.skeletonJoints?.length ? 'Available' : 'Metadata only'}</dd></div>
            </dl>
            <label className="model-skeleton-picker">
              <span>Skeleton assignment</span>
              <select
                value={assignedSkeleton}
                onFocus={() => void loadSkeletonCandidates()}
                onChange={(event) => setAssignedSkeleton(event.target.value)}
              >
                <option value={asset.guid ?? asset.path}>{asset.skeletonName || `${asset.name} Skeleton`} (Imported)</option>
                {candidateAssets
                  .filter((candidate) => (candidate.guid ?? candidate.path) !== (asset.guid ?? asset.path))
                  .map((candidate) => {
                    const compatibility = skeletonCompatibility(asset, candidate);
                    return (
                      <option key={candidate.guid ?? candidate.path} value={candidate.guid ?? candidate.path} disabled={compatibility === 'incompatible'}>
                        {candidate.skeletonName || candidate.name} · {compatibility}
                      </option>
                    );
                  })}
              </select>
            </label>
            <div className="model-compatibility-legend">
              <span>{compatibilityIcon('compatible')} compatible</span>
              <span>{compatibilityIcon('partial')} partially compatible</span>
              <span>{compatibilityIcon('incompatible')} incompatible</span>
            </div>
            <p className="model-editor-note">Full animation retargeting is intentionally outside this milestone.</p>
          </div>
        )}
      </aside>
    </div>
  );
}

export function ModelEditorToolbar() {
  return <span className="model-editor-toolbar-label">Model</span>;
}
''')

          Path('editor/src/renderer/src/model/SkeletonAssetEditor.tsx').write_text(r'''import { useMemo } from 'react';
import { Bone, TriangleAlert } from 'lucide-react';

import type { EditorDocument } from '../editors/editorTypes';
import { UiTreeView } from '../ui';
import type { UiTreeNode } from '../ui';
import { skeletonHierarchyDepth } from './modelSubassets';

import './modelEditor.css';

function skeletonTree(document: EditorDocument): UiTreeNode[] {
  const joints = document.assetSnapshot?.skeletonJoints ?? [];
  const children = new Map<number, typeof joints>();
  for (const joint of joints) children.set(joint.parent, [...(children.get(joint.parent) ?? []), joint]);
  const build = (joint: (typeof joints)[number]): UiTreeNode => ({
    id: String(joint.index),
    label: joint.name,
    children: (children.get(joint.index) ?? []).map(build),
  });
  return (children.get(-1) ?? []).map(build);
}

export function SkeletonAssetEditor({ document }: { document: EditorDocument }) {
  const asset = document.assetSnapshot;
  const nodes = useMemo(() => skeletonTree(document), [document]);
  if (!asset) return <div className="model-editor-empty">Skeleton metadata is unavailable.</div>;
  const boneCount = asset.skeletonBoneCount ?? asset.skeletonJoints?.length ?? 0;
  const root = asset.skeletonRootBone || asset.skeletonJoints?.find((joint) => joint.parent < 0)?.name || '—';
  const warnings = asset.skeletonValidationWarnings ?? [];

  return (
    <div className="skeleton-asset-editor">
      <header>
        <div><Bone size={18} /><div><strong>{asset.skeletonName || `${asset.name} Skeleton`}</strong><span>Model sub-asset · {asset.name}</span></div></div>
      </header>
      <div className="skeleton-asset-body">
        <section className="skeleton-tree-card">
          <h3>Skeleton</h3>
          {nodes.length ? <UiTreeView ariaLabel="Skeleton asset hierarchy" nodes={nodes} defaultExpandedIds={nodes.map((node) => node.id)} /> : <p>Joint hierarchy metadata was not emitted by the importer.</p>}
        </section>
        <aside className="skeleton-asset-details">
          <h3>Details</h3>
          <dl>
            <div><dt>Bone count</dt><dd>{boneCount}</dd></div>
            <div><dt>Hierarchy depth</dt><dd>{skeletonHierarchyDepth(asset) || '—'}</dd></div>
            <div><dt>Root bone</dt><dd>{root}</dd></div>
            <div><dt>Bind pose</dt><dd>{asset.skeletonJoints?.length ? 'Available' : 'Metadata only'}</dd></div>
            <div><dt>Model reference</dt><dd>{asset.name}</dd></div>
          </dl>
          <h3>Validation</h3>
          {warnings.length ? warnings.map((warning) => <div className="skeleton-warning" key={warning}><TriangleAlert size={13} />{warning}</div>) : <p>No validation warnings.</p>}
        </aside>
      </div>
    </div>
  );
}

export function SkeletonAssetEditorToolbar() {
  return <span className="model-editor-toolbar-label">Skeleton</span>;
}
''')

