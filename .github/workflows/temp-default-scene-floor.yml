name: Temporary Default Scene Floor

on:
  push:
    branches:
      - feat/default-scene-checker-floor
    paths:
      - .github/workflows/temp-default-scene-floor.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/default-scene-checker-floor
          fetch-depth: 0
      - name: Apply default scene improvements
        run: echo ' '' | base64 -d | python3
      - name: Format native code
        run: clang-format-18 -i editor/native/inc/arc/editor/host_protocol_base.h editor/native/inc/arc/editor/editor_state.h editor/native/src/editor_state.cpp editor/native/src/arc_host_base.inc
      - name: Install editor dependencies
        run: npm ci --prefix editor
      - name: Format editor code
        run: npm run format --prefix editor -- --write
      - name: Typecheck editor
        run: npm run typecheck --prefix editor
      - name: Configure native editor
        run: cmake -S . -B out/build/default-scene -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DARC_BUILD_RENDER_VULKAN=OFF -DARC_BUILD_EDITOR=ON -DARC_BUILD_SAMPLES=OFF -DBUILD_TESTING=ON
      - name: Build editor host
        run: cmake --build out/build/default-scene --target arc-editor-host -j2
      - name: Check formatting
        run: python3 tools/check_format.py --clang-format clang-format-18
      - name: Commit implementation
        run: |
          rm .github/workflows/temp-default-scene-floor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve default scene checker floor"
          git push origin HEAD:feat/default-scene-checker-floor
