name: 02 · Windows x64 — MSVC (VS2022)

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      run_shaders:
        description: Validate built-in shaders for this pull request
        required: false
        type: boolean
        default: true
      run_cooker:
        description: Run the asset cook smoke for this pull request
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-test:
    name: MSVC (VS2022) · RelWithDebInfo — Native Build & Test
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Windows Toolchain
        uses: ./.github/actions/setup-windows-toolchain

      - name: Configure Native Products
        run: >
          cmake -S . -B out/build/ci-windows -G Ninja
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=ON
          -DARC_BUILD_RENDER_VULKAN=ON
          -DARC_BUILD_SAMPLES=ON
          -DARC_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON

      - name: Build Native Products
        run: cmake --build out/build/ci-windows --parallel

      - name: Validate Shaders
        if: ${{ github.event_name != 'pull_request' || inputs.run_shaders }}
        run: cmake --build out/build/ci-windows --target arc-shaders-check

      - name: Run Native Tests
        run: ctest --test-dir out/build/ci-windows --output-on-failure

      - name: Validate Relocated Shipping Smoke Harness
        run: python -m unittest discover -s tools/tests -p test_relocated_package.py -v

      - name: Stage Product Symbols
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _arc-product-symbols-windows-x64
          path: out/build/ci-windows/**/*.pdb
          if-no-files-found: error
          retention-days: 1

      - name: Compiler Cache Stats
        if: always()
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          } else {
            Write-Host "sccache not installed; compilation was uncached."
          }

  distribution:
    name: Content / SDK / Shipping Validation
    uses: ./.github/workflows/windows-distribution.yml
    with:
      run_cooker: ${{ inputs.run_cooker == true }}

  editor-package:
    name: MSVC (VS2022) — Electron Editor Package & Smoke
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Windows Toolchain
        uses: ./.github/actions/setup-windows-toolchain

      - name: Set Up Node 22.12
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install Electron Dependencies
        working-directory: editor
        run: npm ci

      - name: Configure Editor Package Build
        run: >
          cmake -S . -B out/build/editor-package -G Ninja
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=ON
          -DARC_BUILD_RENDER_VULKAN=ON
          -DARC_BUILD_SAMPLES=ON
          -DARC_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=OFF

      - name: Build Editor Package Dependencies
        run: cmake --build out/build/editor-package --parallel

      - name: Package Electron Editor
        working-directory: editor
        env:
          ARC_PACKAGED_HOST_PATH: ${{ github.workspace }}\out\build\editor-package\editor\native\arc_host_process.exe
          ARC_PACKAGED_PROJECT_TOOL_PATH: ${{ github.workspace }}\out\build\editor-package\tools\project_cli\arc-project.exe
          ARC_PACKAGED_TEMPLATES_PATH: ${{ github.workspace }}\templates
          ARC_PACKAGED_RENDER_VULKAN_PATH: ${{ github.workspace }}\out\build\editor-package\engine\render-vulkan\arc-render-vulkan.dll
          ARC_REQUIRE_PACKAGED_HOST: "1"
        run: npm run build

      - name: Smoke Editor and Native Samples
        run: |
          python tools/verify_distribution.py editor/out/arc-editor-win32-x64 --require resources/arc_host_process.exe --require resources/app.asar
          python tools/run_process_smoke.py --timeout 45 editor/out/arc-editor-win32-x64/arc-editor.exe --ci-smoke
          python tools/run_process_smoke.py --timeout 30 out/build/editor-package/samples/arc_sample_game.exe --ci-smoke
          python tools/run_process_smoke.py --timeout 30 out/build/editor-package/samples/arc_headless.exe --ticks 10 --no-sleep

      - name: Stage Editor Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _arc-editor-windows-x64
          path: editor/out/arc-editor-win32-x64
          if-no-files-found: error
          retention-days: 1

      - name: Compiler Cache Stats
        if: always()
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          } else {
            Write-Host "sccache not installed; compilation was uncached."
          }

  publish-artifacts:
    name: Linux x64 · GitHub Actions — Publish Windows Artifacts
    if: github.event_name != 'pull_request'
    needs: [build-test, distribution, editor-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Editor Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: _arc-editor-windows-x64
          path: staging/editor

      - name: Download Headless Runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: _arc-headless-windows-x64
          path: staging/headless

      - name: Download Sample Game
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: _arc-sample-game-windows-x64
          path: staging/sample-game

      - name: Download Debug Symbols
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: _arc-*-symbols-windows-x64
          path: staging/symbols
          merge-multiple: true

      - name: Download CMake Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: _arc-cmake-packages-windows-x64
          path: staging/cmake-packages

      - name: Publish Editor Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-editor-windows-x64
          path: staging/editor

      - name: Publish Headless Runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-headless-windows-x64
          path: staging/headless

      - name: Publish Sample Game
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-sample-game-windows-x64
          path: staging/sample-game

      - name: Publish Debug Symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-symbols-windows-x64
          path: staging/symbols

      - name: Publish CMake Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-cmake-packages-windows-x64
          path: staging/cmake-packages
