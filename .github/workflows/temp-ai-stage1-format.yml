name: Temporary AI Stage 1 Formatter

on:
  push:
    branches: [feature/ai-assistant-stage-1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-assistant-stage-1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - name: Format AI Stage 1 files
        working-directory: editor
        run: npx prettier --write src/renderer/src/ai/aiChat.ts src/renderer/src/ai/aiGateway.css src/renderer/src/ai/AiGatewayPanel.tsx
      - name: Validate targeted editor files
        working-directory: editor
        run: |
          npm run lint
          npm run typecheck
          npx vitest run --pool=threads --maxWorkers=1 src/renderer/src/ai/AiGatewayPanel.test.tsx src/renderer/src/ai/aiChat.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/ai/aiChat.ts editor/src/renderer/src/ai/aiGateway.css editor/src/renderer/src/ai/AiGatewayPanel.tsx
          git commit -m "Format AI assistant stage 1"
          git push origin HEAD:feature/ai-assistant-stage-1
