name: Diagnostic - Windows Cook

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cook-fixture:
    name: Cook fixture only
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) { throw "Visual Studio with the x64 C++ toolchain was not found" }
          $devCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          & cmd.exe /s /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
              }
            }

      - name: Configure cook tools
        run: >
          cmake -S . -B out/build/cook-diagnostic -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=OFF
          -DARC_BUILD_RENDER_VULKAN=OFF
          -DARC_BUILD_SAMPLES=OFF
          -DARC_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=OFF

      - name: Build cook tools
        run: cmake --build out/build/cook-diagnostic --target arc-project-cli arc-cook --parallel

      - name: Create cook fixture
        run: out/build/cook-diagnostic/tools/project_cli/arc-project.exe create --name CookFixture --destination out/cook-fixture --template rendering-sample --templates templates --engine 0.1.0

      - name: Cook fixture
        run: out/build/cook-diagnostic/tools/asset_cooker/arc-cook.exe package --project out/cook-fixture --profile windows-x64-vulkan --output out/cooked/windows-x64-vulkan

      - name: Verify cooked fixture
        run: out/build/cook-diagnostic/tools/asset_cooker/arc-cook.exe verify --project out/cook-fixture --profile windows-x64-vulkan --output out/cooked/windows-x64-vulkan

      - name: Verify warm cook cache hits
        shell: pwsh
        run: |
          $warmCook = (& out/build/cook-diagnostic/tools/asset_cooker/arc-cook.exe package --project out/cook-fixture --profile windows-x64-vulkan --output out/cooked/windows-x64-vulkan --json | ConvertFrom-Json)
          if ($warmCook.cooked -ne 0) { throw "Second fixture cook was not entirely cache-hit" }
