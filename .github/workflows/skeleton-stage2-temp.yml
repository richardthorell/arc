name: Skeleton Stage 2

on:
  push:
    branches:
      - feat/apply-imported-skeletons

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/apply-imported-skeletons

      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_skeleton_stage2_patch.py')
          text = path.read_text()
          start = text.index("old = '''        const auto& imported_mesh = imported.meshes[node.mesh_index];")
          end = text.index("new = '''", start)
          replacement = '''old = \'\'\'        scene::mesh_renderer_component renderer_component;
                  renderer_component.mesh = meshes[node.mesh_index];
                  renderer_component.material = materials[material_index];
                  scene.scene.emplace<scene::mesh_renderer_component>(entity, renderer_component);
                  scene.scene.emplace<scene::persistent_id_component>(entity, ecs::generate_entity_guid());
          \'\'\'
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python3 tools/apply_skeleton_stage2_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/native/src/editor_state.cpp')
          text = path.read_text()
          marker = '        scene.scene.emplace<scene::hierarchy_component>(entity);\n'
          insertion = '''        if (!skinned_bound)
          {
              if (has_skin_stream)
              {
                  arc::diagnostics::warn("editor.assets", "Imported skinned mesh '" +
                                                             (node.name.empty() ? std::string("Imported Mesh") : node.name) +
                                                             "' has no usable skeleton binding; using static rendering");
              }
              scene::mesh_renderer_component renderer_component;
              renderer_component.mesh = meshes[node.mesh_index];
              renderer_component.material = materials[material_index];
              scene.scene.emplace<scene::mesh_renderer_component>(entity, renderer_component);
          }
          scene.scene.emplace<scene::persistent_id_component>(entity, ecs::generate_entity_guid());
          '''
          if marker not in text:
              raise SystemExit('hierarchy marker not found')
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)
          PY

      - name: Format changed C++
        run: |
          clang-format-18 -i \
            editor/native/src/editor_state.cpp \
            editor/native/tests/skinned_scene_import_tests.cpp

      - name: Configure editor tests
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B out/build/skeleton-stage2 -G Ninja \
            -DARC_BUILD_EDITOR=ON \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_BUILD_ASSET_COOKER=OFF \
            -DARC_BUILD_PROJECT_TOOL=OFF \
            -DARC_BUILD_ENGINE_TESTS=ON

      - name: Build editor tests
        run: cmake --build out/build/skeleton-stage2 --target arc_editor_host_tests -j2

      - name: Run stage 2 tests
        run: out/build/skeleton-stage2/editor/native/tests/arc_editor_host_tests "[skeleton][import]"

      - name: Verify format and diff
        run: |
          python3 tools/check_format.py --clang-format clang-format-18
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/src/editor_state.cpp editor/native/tests/skinned_scene_import_tests.cpp
          git rm .github/workflows/skeleton-stage2-temp.yml tools/apply_skeleton_stage2_patch.py
          git diff --cached --check
          git commit -m "Bind imported skeletons to skinned entities"
          git push origin HEAD:feat/apply-imported-skeletons
