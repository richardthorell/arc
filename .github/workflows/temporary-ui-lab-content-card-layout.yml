name: Temporary UI Lab content card layout validation

on:
  push:
    branches:
      - fix/ui-lab-content-card-layout

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-lab-content-card-layout
      - name: Apply layout patch
        run: python3 scripts/temporary_patch_ui_lab_content_card_layout.py
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Format changed files
        working-directory: editor
        run: npx prettier --write src/renderer/src/uiLab/UiLab.tsx src/renderer/src/uiLab/UiLabContentCards.tsx src/renderer/src/uiLab/UiLabContentCards.test.tsx src/renderer/src/uiLab/uiLab.css src/renderer/src/uiLab/uiLabContentCards.css
      - name: Typecheck editor
        working-directory: editor
        run: npm run typecheck
      - name: Test UI Lab
        working-directory: editor
        run: npx vitest run src/renderer/src/uiLab/UiLab.test.tsx src/renderer/src/uiLab/UiLabContentCards.test.tsx --pool=threads --maxWorkers=1
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/uiLab/UiLab.tsx editor/src/renderer/src/uiLab/UiLabContentCards.tsx editor/src/renderer/src/uiLab/UiLabContentCards.test.tsx editor/src/renderer/src/uiLab/uiLab.css editor/src/renderer/src/uiLab/uiLabContentCards.css
          if ! git diff --cached --quiet; then
            git commit -m "Fix UI Lab content card layout"
            git push origin HEAD:fix/ui-lab-content-card-layout
          fi
