name: Apply Close Dialog Runtime

on:
  push:
    branches: [editor/use-close-dialog-and-import-lab]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: editor/use-close-dialog-and-import-lab
      - name: Wire renderer close dialog
        shell: python
        run: |
          from pathlib import Path

          main_path = Path('editor/src/main/main.ts')
          main = main_path.read_text()

          old_globals = """let allowWindowClose = false;\nlet closeConfirmationPending = false;\nlet shutdownPending = false;"""
          new_globals = """let allowWindowClose = false;\nlet closeConfirmationPending = false;\nlet closeChoiceResolve: ((choice: 'save' | 'discard' | 'cancel') => void) | null = null;\nlet shutdownPending = false;"""
          if old_globals not in main:
              raise SystemExit('main globals anchor not found')
          main = main.replace(old_globals, new_globals, 1)

          old_close = """const confirmWindowClose = async (target: BrowserWindow): Promise<void> => {\n  if (closeConfirmationPending) return;\n  closeConfirmationPending = true;\n  try {\n    const state = await hostClient?.query('scene.hierarchy');\n    const document = state?.payload as SceneDocumentState | undefined;\n    if (state?.succeeded && document?.dirty) {\n      const choice = await dialog.showMessageBox(target, {\n        type: 'warning',\n        title: 'Unsaved ARC Scene',\n        message: `Save changes to ${document.sceneName || 'Untitled'}?`,\n        detail: 'Unsaved scene authoring changes will be lost.',\n        buttons: ['Save', \"Don't Save\", 'Cancel'],\n        defaultId: 0,\n        cancelId: 2,\n        noLink: true,\n      });\n      if (choice.response === 2) return;\n      if (choice.response === 0) {\n        const saved = await saveSceneWithDialog(target, document.activeScenePath);\n        if (!saved?.succeeded) {\n          if (saved) dialog.showErrorBox('Scene Save Failed', saved.error || 'The scene could not be saved.');\n          return;\n        }\n      }\n    }\n    allowWindowClose = true;\n    target.close();\n  } catch (error) {\n    dialog.showErrorBox('Unable to Close Scene', error instanceof Error ? error.message : String(error));\n  } finally {\n    closeConfirmationPending = false;\n  }\n};"""
          new_close = """const requestWindowCloseChoice = (\n  target: BrowserWindow,\n  sceneName: string,\n): Promise<'save' | 'discard' | 'cancel'> =>\n  new Promise((resolve) => {\n    closeChoiceResolve = resolve;\n    target.webContents.send('nativeWindow:closeRequested', { sceneName: sceneName || 'Untitled' });\n  });\n\nconst confirmWindowClose = async (target: BrowserWindow): Promise<void> => {\n  if (closeConfirmationPending) return;\n  closeConfirmationPending = true;\n  try {\n    const state = await hostClient?.query('scene.hierarchy');\n    const document = state?.payload as SceneDocumentState | undefined;\n    if (state?.succeeded && document?.dirty) {\n      const choice = await requestWindowCloseChoice(target, document.sceneName || 'Untitled');\n      if (choice === 'cancel') return;\n      if (choice === 'save') {\n        const saved = await saveSceneWithDialog(target, document.activeScenePath);\n        if (!saved?.succeeded) {\n          if (saved) dialog.showErrorBox('Scene Save Failed', saved.error || 'The scene could not be saved.');\n          return;\n        }\n      }\n    }\n    allowWindowClose = true;\n    target.close();\n  } catch (error) {\n    dialog.showErrorBox('Unable to Close Editor', error instanceof Error ? error.message : String(error));\n  } finally {\n    closeChoiceResolve = null;\n    closeConfirmationPending = false;\n  }\n};"""
          if old_close not in main:
              raise SystemExit('confirmWindowClose anchor not found')
          main = main.replace(old_close, new_close, 1)

          old_ipc = """  ipcMain.handle('nativeWindow:close', () => activeWindow()?.close());\n  ipcMain.handle('nativeWindow:isMaximized', () => activeWindow()?.isMaximized() ?? false);"""
          new_ipc = """  ipcMain.handle('nativeWindow:close', () => activeWindow()?.close());\n  ipcMain.on('nativeWindow:closeResponse', (_event, choice: unknown) => {\n    if (choice !== 'save' && choice !== 'discard' && choice !== 'cancel') return;\n    const resolve = closeChoiceResolve;\n    closeChoiceResolve = null;\n    resolve?.(choice);\n  });\n  ipcMain.handle('nativeWindow:isMaximized', () => activeWindow()?.isMaximized() ?? false);"""
          if old_ipc not in main:
              raise SystemExit('nativeWindow IPC anchor not found')
          main = main.replace(old_ipc, new_ipc, 1)
          main_path.write_text(main)

          preload_path = Path('editor/src/preload/preload.ts')
          preload = preload_path.read_text()
          old_preload = """    close: (): Promise<void> => ipcRenderer.invoke('nativeWindow:close'),\n    isMaximized: (): Promise<boolean> => ipcRenderer.invoke('nativeWindow:isMaximized'),\n    onMaximizedChanged: (callback: (maximized: boolean) => void): (() => void) => {"""
          new_preload = """    close: (): Promise<void> => ipcRenderer.invoke('nativeWindow:close'),\n    respondToClose: (choice: 'save' | 'discard' | 'cancel'): void => ipcRenderer.send('nativeWindow:closeResponse', choice),\n    onCloseRequested: (callback: (request: { sceneName: string }) => void): (() => void) => {\n      const listener = (_event: Electron.IpcRendererEvent, request: { sceneName: string }) => callback(request);\n      ipcRenderer.on('nativeWindow:closeRequested', listener);\n      return () => ipcRenderer.removeListener('nativeWindow:closeRequested', listener);\n    },\n    isMaximized: (): Promise<boolean> => ipcRenderer.invoke('nativeWindow:isMaximized'),\n    onMaximizedChanged: (callback: (maximized: boolean) => void): (() => void) => {"""
          if old_preload not in preload:
              raise SystemExit('preload nativeWindow anchor not found')
          preload = preload.replace(old_preload, new_preload, 1)
          preload_path.write_text(preload)
      - name: Commit staged runtime wiring
        shell: bash
        run: |
          rm .github/workflows/apply-close-dialog-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/main/main.ts editor/src/preload/preload.ts .github/workflows/apply-close-dialog-runtime.yml
          git commit -m "feat(editor): use ARC dialog for window close"
          git push origin HEAD:editor/use-close-dialog-and-import-lab
