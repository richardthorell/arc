name: Temporary AI Stage 1 Test Formatter

on:
  push:
    branches: [feature/ai-assistant-stage-1]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-assistant-stage-1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - name: Format AI test
        working-directory: editor
        run: npx prettier --write src/renderer/src/ai/AiGatewayPanel.test.tsx
      - name: Verify formatting
        working-directory: editor
        run: npx prettier --check src/renderer/src/ai/AiGatewayPanel.test.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/ai/AiGatewayPanel.test.tsx
          git commit -m "Format AI assistant test"
          git push origin HEAD:feature/ai-assistant-stage-1
