name: Import material preview HDRI

on:
  push:
    branches:
      - feat/material-preview-studio
    paths:
      - .github/workflows/import-material-preview-hdri.yml

permissions:
  contents: write

jobs:
  import-hdri:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/material-preview-studio

      - name: Download and verify material preview HDRI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/environments
          curl --fail --location --retry 3 \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/4k/cobblestone_parish_road_4k.exr' \
            --output assets/environments/material_preview_studio_4k.exr
          echo 'a87a79fc226997e9a9fc0da72b2e6062d07f60466b5be818b7dd69f7efe1ed42  assets/environments/material_preview_studio_4k.exr' | sha256sum --check

      - name: Commit exact uploaded asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/environments/material_preview_studio_4k.exr
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'assets(editor): add material preview HDRI'
          git push origin HEAD:feat/material-preview-studio
