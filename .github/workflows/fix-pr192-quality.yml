name: Fix PR 192 Quality

on:
  push:
    branches:
      - feature/asset-titles-descriptions

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-quality]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/asset-titles-descriptions
      - name: Fix immediate asset details selection
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('editor/src/renderer/src/content/ContentBrowserPanel.tsx')
          text = p.read_text()
          old = "  const selected = assets.find((asset) => asset.id === selectedAssetId) ?? null;"
          new = "  const selected =\n    assets.find((asset) => asset.id === selectedAssetId) ??\n    assets.find((asset) => selection.has(asset.id)) ??\n    null;"
          if old not in text:
              raise SystemExit('selection line not found')
          p.write_text(text.replace(old, new, 1))
          PY
          npm ci --prefix editor
          npx --prefix editor prettier --write editor/src/renderer/src/content/ContentBrowserPanel.tsx
          npm test --prefix editor -- --run src/renderer/src/content/ContentBrowserPanel.test.tsx
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898218+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/content/ContentBrowserPanel.tsx
          git commit -m "fix(editor): show asset details immediately on selection [fix-quality]"
          git push origin HEAD:feature/asset-titles-descriptions
