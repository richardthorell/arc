name: Temporary Terrain Bridge Build Fix

on:
  push:
    branches:
      - feat/terrain-m0-compat-surface-ir
    paths:
      - .github/workflows/temp-fix-terrain-bridge-build.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/terrain-m0-compat-surface-ir
      - name: Fix dependent scene iteration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/native/src/arc_host_impl.inc')
          text = path.read_text(encoding='utf-8')
          old = '''    host.scene.scene.view<scene::terrain_component>().each(\n        [&](ecs::entity, scene::terrain_component& terrain)\n        {\n            if (!terrain.asset.guid.valid() && terrain.asset.path_hint.empty()) return;\n            const auto binding = scene::refresh_terrain_asset_binding(terrain, *host.asset_registry);\n            if (!binding.succeeded)\n                arc::diagnostics::warn("editor.terrain", "Terrain asset refresh failed: " + binding.message);\n        });\n'''
          new = '''    for (const auto entity : host.scene.scene.entities())\n    {\n        auto* terrain = host.scene.scene.template try_get<scene::terrain_component>(entity);\n        if (!terrain || (!terrain->asset.guid.valid() && terrain->asset.path_hint.empty())) continue;\n        const auto binding = scene::refresh_terrain_asset_binding(*terrain, *host.asset_registry);\n        if (!binding.succeeded)\n            arc::diagnostics::warn("editor.terrain", "Terrain asset refresh failed: " + binding.message);\n    }\n'''
          if text.count(old) != 1:
              raise RuntimeError('Expected terrain refresh block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          clang-format --version >/dev/null 2>&1 && clang-format -i editor/native/src/arc_host_impl.inc || true
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "arc-ci"
          git config user.email "actions@users.noreply.github.com"
          git add editor/native/src/arc_host_impl.inc
          git commit -m "Fix terrain asset refresh iteration"
          git push origin HEAD:feat/terrain-m0-compat-surface-ir
