name: Inspect Editor Overlay

on:
  push:
    branches:
      - feature/viewport-scene-camera-switching

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/viewport-scene-camera-switching
      - name: Inspect overlay and ECS APIs
        shell: bash
        run: |
          set +e
          echo '=== gizmo callers ==='
          grep -RInE "build_editor_gizmo_overlay|debug_overlay_stream|append_editor_grid_overlay" editor/native engine | head -200
          echo '=== ECS iteration ==='
          grep -RInE "\.view<|view<scene::|\.each\(|for_each" editor/native engine | head -200
          echo '=== camera component ==='
          grep -RInE "struct camera_component|class camera_component|camera_projection" engine editor/native/inc | head -120
          echo '=== light components ==='
          grep -RInE "struct (directional_light_component|point_light_component|spot_light_component|area_light_component)" engine | head -100
          exit 0
