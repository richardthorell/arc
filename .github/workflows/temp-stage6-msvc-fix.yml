name: Temporary Stage 6 MSVC Fix

on:
  push:
    branches:
      - feat/texture-compression-stage6
    paths:
      - .github/workflows/temp-stage6-msvc-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/texture-compression-stage6
          fetch-depth: 0
      - name: Scope stb warning suppression to third-party implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/render-tools/src/common/texture_cooker.cpp')
          text = path.read_text()
          old = '''#define STB_DXT_IMPLEMENTATION
          #include <stb_dxt.h>
          '''
          old = old.replace('          ', '')
          new = '''#ifdef _MSC_VER
          #pragma warning(push)
          #pragma warning(disable : 4244)
          #endif

          #define STB_DXT_IMPLEMENTATION
          #include <stb_dxt.h>

          #ifdef _MSC_VER
          #pragma warning(pop)
          #endif
          '''
          new = new.replace('          ', '')
          if old not in text:
              raise SystemExit('stb DXT include marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          clang-format-18 -i engine/render-tools/src/common/texture_cooker.cpp
      - name: Validate Clang build
        run: |
          cmake -S . -B out/build/stage6-msvc-fix -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_BUILD_EDITOR=OFF \
            -DARC_BUILD_ENGINE_TESTS=ON
          cmake --build out/build/stage6-msvc-fix --target arc_render_tools_tests -j2
          ctest --test-dir out/build/stage6-msvc-fix -R arc_render_tools_tests --output-on-failure
      - name: Commit fix
        run: |
          rm .github/workflows/temp-stage6-msvc-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix MSVC warnings from stb DXT implementation"
          git push origin HEAD:feat/texture-compression-stage6
