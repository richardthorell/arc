name: Temporary static analysis fix

on:
  push:
    branches:
      - fix/clang-format-main-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clang-format-main-20260830
          fetch-depth: 0

      - name: Patch clang-tidy findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('engine/render/src/common/texture_streaming_io.cpp'): [
                  ('{.load = std::move(load), .future = std::move(future), .started = std::chrono::steady_clock::now()}',
                   '{.load = load, .future = std::move(future), .started = std::chrono::steady_clock::now()}'),
              ],
              Path('engine/render/src/common/renderer.cpp'): [
                  ('writer.texture_stream_evict(std::move(eviction));',
                   'writer.texture_stream_evict(eviction);'),
              ],
              Path('engine/render/src/common/events.cpp'): [
                  ('texture_stream_evict_event{.eviction = std::move(eviction)}',
                   'texture_stream_evict_event{.eviction = eviction}'),
              ],
              Path('engine/render/src/common/texture_streaming.cpp'): [
                  ('    struct resource_entry\n    {\n        texture_handle handle{};\n        streamed_texture_descriptor descriptor;\n',
                   '    struct resource_entry\n    {\n        resource_entry(texture_handle resource, const streamed_texture_descriptor& streamed_descriptor)\n            : handle(resource), descriptor(streamed_descriptor)\n        {\n        }\n\n        texture_handle handle{};\n        streamed_texture_descriptor descriptor;\n'),
                  ('    implementation::resource_entry entry{.handle = resource, .descriptor = descriptor};',
                   '    implementation::resource_entry entry(resource, descriptor);'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Format modified files
        shell: bash
        run: |
          clang-format-18 -i \
            engine/render/src/common/texture_streaming_io.cpp \
            engine/render/src/common/renderer.cpp \
            engine/render/src/common/events.cpp \
            engine/render/src/common/texture_streaming.cpp

      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/temporary-static-analysis-fix.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/src/common/texture_streaming_io.cpp \
                  engine/render/src/common/renderer.cpp \
                  engine/render/src/common/events.cpp \
                  engine/render/src/common/texture_streaming.cpp \
                  .github/workflows/temporary-static-analysis-fix.yml
          git commit -m "Fix texture streaming static analysis findings"
          git push origin HEAD:fix/clang-format-main-20260830
