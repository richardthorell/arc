          python3 - <<'PY'
          from pathlib import Path

          index = Path('editor/src/renderer/src/ui/index.ts')
          text = index.read_text()
          if "export { UiPanelSection } from './UiPanelSection';" not in text:
              text = text.replace("export { UiPanel, UiPanelHeader } from './UiPanel';\n", "export { UiPanel, UiPanelHeader } from './UiPanel';\nexport { UiPanelSection } from './UiPanelSection';\n")
          index.write_text(text)

          schema = Path('editor/src/renderer/src/inspector/SchemaComponents.tsx')
