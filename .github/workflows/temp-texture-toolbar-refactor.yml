          cat > editor/src/renderer/src/texture/textureEditorViewState.ts <<'EOF'
          import { useSyncExternalStore } from 'react';

          export type TextureChannels = { r: boolean; g: boolean; b: boolean; a: boolean };
          export type TextureEditorViewState = {
            zoom: number;
            mipLevel: number;
            channels: TextureChannels;
          };

          const initialState = (): TextureEditorViewState => ({
            zoom: 1,
            mipLevel: 0,
            channels: { r: true, g: true, b: true, a: true },
          });

          const states = new Map<string, TextureEditorViewState>();
          const listeners = new Map<string, Set<() => void>>();

          export const getTextureEditorViewState = (id: string) => states.get(id) ?? initialState();

          export const setTextureEditorViewState = (id: string, patch: Partial<TextureEditorViewState>) => {
            const current = getTextureEditorViewState(id);
            const next = { ...current, ...patch };
            states.set(id, next);
            listeners.get(id)?.forEach((listener) => listener());
          };

          export const updateTextureChannels = (id: string, patch: Partial<TextureChannels>) => {
            const current = getTextureEditorViewState(id);
            setTextureEditorViewState(id, { channels: { ...current.channels, ...patch } });
          };

          export const useTextureEditorViewState = (id: string) =>
            useSyncExternalStore(
              (listener) => {
                const bucket = listeners.get(id) ?? new Set<() => void>();
                bucket.add(listener);
                listeners.set(id, bucket);
                return () => {
                  bucket.delete(listener);
                  if (!bucket.size) listeners.delete(id);
                };
              },
              () => getTextureEditorViewState(id),
              () => getTextureEditorViewState(id),
            );
          EOF

          cat > editor/src/renderer/src/texture/TextureEditorToolbar.tsx <<'EOF'
          import type { EditorDocument } from '../editors/editorTypes';
          import { UiIconButton } from '../ui';
          import { getTextureEditorViewState, setTextureEditorViewState, updateTextureChannels, useTextureEditorViewState } from './textureEditorViewState';
          import './textureEditorToolbar.css';

          const minZoom = 0.05;
          const maxZoom = 16;
          const clampZoom = (value: number) => Math.min(maxZoom, Math.max(minZoom, value));

          export function TextureEditorToolbar({ document }: { document: EditorDocument }) {
            const state = useTextureEditorViewState(document.id);
            const mipLevels = Math.max(1, document.assetSnapshot?.mipLevels ?? 1);
            const maxMip = mipLevels - 1;
            const setMipLevel = (value: number) =>
              setTextureEditorViewState(document.id, { mipLevel: Math.max(0, Math.min(maxMip, value)) });
            const toggleChannel = (channel: keyof typeof state.channels) =>
              updateTextureChannels(document.id, { [channel]: !getTextureEditorViewState(document.id).channels[channel] });

            return (
              <div className="texture-editor-toolbar" aria-label="Texture editor toolbar">
                <div className="texture-channel-group" aria-label="Texture channels">
                  {(['r', 'g', 'b', 'a'] as const).map((channel) => (
                    <button
                      aria-pressed={state.channels[channel]}
                      className={`texture-channel texture-channel-${channel} ${state.channels[channel] ? 'is-active' : ''}`}
                      key={channel}
                      onClick={() => toggleChannel(channel)}
                      type="button"
                    >
                      {channel.toUpperCase()}
                    </button>
                  ))}
                </div>
                <span className="texture-toolbar-separator" />
                <select
                  aria-label="Mip level"
                  disabled={mipLevels <= 1}
                  onChange={(event) => setMipLevel(Number(event.target.value))}
                  value={state.mipLevel}
                >
                  {Array.from({ length: mipLevels }, (_, level) => (
                    <option key={level} value={level}>Mip Level {level}</option>
                  ))}
                </select>
                <UiIconButton
                  disabled={state.mipLevel >= maxMip}
                  label="Increase mip level"
                  onClick={() => setMipLevel(state.mipLevel + 1)}
                  type="button"
                >+</UiIconButton>
                <UiIconButton
                  disabled={state.mipLevel <= 0}
                  label="Decrease mip level"
                  onClick={() => setMipLevel(state.mipLevel - 1)}
                  type="button"
                >−</UiIconButton>
                <span className="texture-toolbar-separator" />
                <label className="texture-zoom-control">
                  <span>Zoom</span>
                  <input
                    aria-label="Texture zoom"
                    max={1600}
                    min={5}
                    onChange={(event) => setTextureEditorViewState(document.id, { zoom: clampZoom(Number(event.target.value) / 100) })}
                    step={5}
                    type="range"
                    value={Math.round(state.zoom * 100)}
                  />
                  <output>{Math.round(state.zoom * 100)}%</output>
                </label>
              </div>
            );
          }
          EOF

