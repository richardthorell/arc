<TextureProperty label="Scope" value={asset.scope ?? 'project'} />\n          <TextureProperty label="Path" value={asset.path} />\n          {asset.guid && <TextureProperty label="GUID" value={asset.guid} />}\n        </UiPanelSection>\n      </div>''')
          s = s.replace("  const [zoom, setZoom] = useState(1);", "  const viewState = useTextureEditorViewState(document.id);\n  const zoom = viewState.zoom;")
          s = s.replace("      setZoom(clampZoom(Math.min(1, availableWidth / preview.width, availableHeight / preview.height)));", "      setTextureEditorViewState(document.id, {\n        zoom: clampZoom(Math.min(1, availableWidth / preview.width, availableHeight / preview.height)),\n      });")
