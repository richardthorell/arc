name: Temporary Texture Stage 2 Runner
on:
  push:
    branches: [feat/texture-import-policy-stage2]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/texture-import-policy-stage2
          fetch-depth: 0
      - name: Extract Stage 2 implementation
        run: |
          python3 -c "from pathlib import Path; t=Path('.github/workflows/temp-texture-stage2.yml').read_text(); b=t.split(\"python3 <<'PY'\\n\",1)[1].split('\\n          PY',1)[0]; Path('/tmp/stage2.py').write_text('\\n'.join((x[10:] if x.startswith('          ') else x) for x in b.splitlines()))"
          python3 /tmp/stage2.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engine/render-tools/src/common/texture_cooker.cpp')
          text = path.read_text()
          functions = {
              'parse_texture_import_preset': 'texture_import_preset',
              'parse_texture_semantic': 'texture_semantic',
              'parse_texture_color_space': 'texture_color_space',
              'parse_texture_streaming_mode': 'texture_streaming_mode',
              'parse_texture_compression_policy': 'texture_compression_policy',
              'parse_texture_power_of_two_policy': 'texture_power_of_two_policy',
              'parse_texture_filter_mode': 'texture_filter_mode',
              'parse_texture_mip_filter_mode': 'texture_mip_filter_mode',
              'parse_texture_address_mode': 'texture_address_mode',
              'parse_texture_mip_generation_filter': 'texture_mip_generation_filter',
          }
          for function, enum_type in functions.items():
              start = text.find(function + '(')
              if start < 0:
                  raise SystemExit(f'enum function missing: {function}')
              end = text.find('\n}', start)
              if end < 0:
                  raise SystemExit(f'enum function end missing: {function}')
              chunk = text[start:end]
              if 'return enum_value(' not in chunk:
                  raise SystemExit(f'enum call missing: {function}')
              chunk = chunk.replace('return enum_value(', f'return enum_value<{enum_type}>(', 1)
              text = text[:start] + chunk + text[end:]

          text = text.replace('''bool power_of_two(std::uint32_t value) noexcept\n{\n    return value != 0 && (value & (value - 1u)) == 0;\n}\n\n''', '')
          old = '''                if (length > 0.00001f)\n                    for (std::uint32_t channel = 0; channel < 3u; ++channel) accumulated[channel] /= length;\n                next[destination] = byte_channel(accumulated[0] * 0.5f + 0.5f);'''
          new = '''                if (length > 0.00001f)\n                    for (std::uint32_t channel = 0; channel < 3u; ++channel) accumulated[channel] /= length;\n                else\n                {\n                    accumulated[0] = 0.0f;\n                    accumulated[1] = 0.0f;\n                    accumulated[2] = 1.0f;\n                }\n                next[destination] = byte_channel(accumulated[0] * 0.5f + 0.5f);'''
          if old not in text:
              raise SystemExit('normal fallback marker missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('engine/render/src/common/texture_artifact.cpp')
          text = path.read_text()
          if 'constexpr std::uint32_t header_bytes = 160;' not in text:
              raise SystemExit('artifact header size marker missing')
          text = text.replace('constexpr std::uint32_t header_bytes = 160;', 'constexpr std::uint32_t header_bytes = 156;', 1)
          if 'output.patch(152, table_hash);' not in text:
              raise SystemExit('artifact hash offset marker missing')
          text = text.replace('output.patch(152, table_hash);', 'output.patch(148, table_hash);', 1)
          path.write_text(text)

          path = Path('editor/native/src/arc_host_base.inc')
          text = path.read_text()
          old = '''                    const auto parse_setting = [&](const std::string& source, auto parser, auto& target, const char* error)\n                    {'''
          new = '''                    const auto parse_setting = [&](const std::string& source, auto parser, auto& target)\n                    {'''
          if old not in text:
              raise SystemExit('parse_setting marker missing')
          text = text.replace(old, new, 1)
          for label in ('compression', 'powerOfTwo', 'minFilter', 'magFilter', 'mipFilter', 'wrapU', 'wrapV', 'mipGenerationFilter'):
              text = text.replace(f', settings.{ {"compression":"compression","powerOfTwo":"power_of_two","minFilter":"min_filter","magFilter":"mag_filter","mipFilter":"mip_filter","wrapU":"wrap_u","wrapV":"wrap_v","mipGenerationFilter":"mip_generation_filter"}[label] }, "{label}")', f', settings.{ {"compression":"compression","powerOfTwo":"power_of_two","minFilter":"min_filter","magFilter":"mag_filter","mipFilter":"mip_filter","wrapU":"wrap_u","wrapV":"wrap_v","mipGenerationFilter":"mip_generation_filter"}[label] })')
          path.write_text(text)
          PY
      - name: Format
        run: |
          clang-format -i engine/render/inc/arc/render/texture_artifact.h engine/render/src/common/texture_artifact.cpp engine/render-tools/inc/arc/render_tools/texture_cooker.h engine/render-tools/src/common/texture_cooker.cpp engine/render-tools/tests/texture_cooker_tests.cpp editor/native/inc/arc/editor/host_protocol_base.h editor/native/src/host_protocol_base.inc editor/native/src/arc_host_base.inc
          cd editor
          npx --yes prettier@3.9.6 --write src/renderer/src/texture/textureSettings.ts src/renderer/src/texture/TextureEditor.tsx src/renderer/src/texture/TextureEditor.test.tsx src/renderer/src/texture/textureEditor.css
      - name: Native validation
        run: |
          cmake -S . -B out/build/texture-stage2 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF
          cmake --build out/build/texture-stage2 --target arc_render_tools_tests arc-editor-host -j2
          ctest --test-dir out/build/texture-stage2 -R arc_render_tools_tests --output-on-failure
      - name: Editor validation
        run: |
          cd editor
          npm ci
          npm run typecheck
          npm test -- --run src/renderer/src/texture/TextureEditor.test.tsx src/renderer/src/editors/textureEditorRegistration.test.ts
      - name: Commit Stage 2
        if: success()
        run: |
          rm .github/workflows/temp-texture-stage2.yml .github/workflows/temp-texture-stage2-runner.yml .github/temp-texture-stage2-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add texture import policy Stage 2"
          git push origin HEAD:feat/texture-import-policy-stage2
