name: Apply M2.1 terrain regionization

on:
  push:
    branches:
      - m2/terrain-regionized-render-artifacts

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'M2.1: regionize terrain render artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2/terrain-regionized-render-artifacts
          fetch-depth: 0

      - name: Apply M2.1 implementation
        run: python3 tools/apply_m2_regionize.py

      - name: Format native files
        shell: bash
        run: |
          FORMATTER=""
          if command -v clang-format-18 >/dev/null 2>&1; then
            FORMATTER=clang-format-18
          elif command -v clang-format >/dev/null 2>&1; then
            FORMATTER=clang-format
          fi
          if [ -n "$FORMATTER" ]; then
            "$FORMATTER" -i \
              engine/render/inc/arc/render/render_world.h \
              engine/render/inc/arc/render/gpu_scene.h \
              engine/render/src/common/gpu_scene.cpp \
              engine/render/tests/gpu_scene_instance_identity_tests.cpp \
              engine/scene/inc/arc/scene/scene.h \
              engine/scene/inc/arc/scene/terrain.h \
              engine/scene/inc/arc/scene/terrain_render_geometry.h \
              engine/scene/inc/arc/scene/terrain_render_regions.h \
              engine/scene/src/common/render_scene.cpp \
              engine/scene/src/common/terrain_geometry_proxy.cpp \
              engine/scene/src/common/terrain_render_geometry.cpp \
              engine/scene/src/common/terrain_render_regions.cpp \
              engine/scene/src/common/terrain_surface_ir.cpp \
              engine/scene/tests/terrain_conventional_render_tests.cpp \
              engine/scene/tests/terrain_render_region_tests.cpp
          fi

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine docs/terrain-roadmap.md
          git diff --cached --check
          git commit -m "M2.1: regionize terrain render artifacts"
          git push origin HEAD:m2/terrain-regionized-render-artifacts
