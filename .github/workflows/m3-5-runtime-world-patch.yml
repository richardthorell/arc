name: Apply M3.5 runtime world API patch

on:
  push:
    branches:
      - feature/play-session-m35-runtime-world-api

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: expose runtime world operations to project modules'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/play-session-m35-runtime-world-api
          fetch-depth: 0
      - name: Apply M3.5 runtime world API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          Path('engine/project/inc/arc/project/runtime_world_api.h').write_text(r'''#pragma once

#include <cstddef>
#include <cstdint>

namespace arc::project
{

/** @brief ABI-safe transient entity handle used by project runtime callbacks. */
struct game_entity_v1
{
    std::uint32_t index{0xffffffffu};
    std::uint32_t generation{};

    [[nodiscard]] constexpr bool valid() const noexcept
    {
        return index != 0xffffffffu;
    }
};

/** @brief Entity handle returned for structural creation deferred to a scheduler phase boundary. */
struct game_deferred_entity_v1
{
    std::uint64_t buffer{};
    std::uint32_t ordinal{};

    [[nodiscard]] constexpr bool valid() const noexcept
    {
        return buffer != 0;
    }
};

/** @brief Target accepted by runtime structural operations; it may be immediate or deferred. */
struct game_entity_target_v1
{
    game_entity_v1 entity{};
    game_deferred_entity_v1 deferred{};
    bool is_deferred{};

    [[nodiscard]] constexpr bool valid() const noexcept
    {
        return is_deferred ? deferred.valid() : entity.valid();
    }
};

/** @brief Engine-owned components exposed through the stable project runtime API. */
enum class game_core_component_v1 : std::uint8_t
{
    name,
    transform,
    tag,
    active
};

/** @brief Scheduler access mode for a stable engine-owned component. */
enum class game_core_component_access_mode_v1 : std::uint8_t
{
    read,
    write
};

/** @brief Declared project-system access to one engine-owned component. */
struct game_core_component_access_v1
{
    game_core_component_v1 component{game_core_component_v1::transform};
    game_core_component_access_mode_v1 mode{game_core_component_access_mode_v1::read};
};

using game_core_component_mask_v1 = std::uint32_t;

[[nodiscard]] constexpr game_core_component_mask_v1 game_core_component_bit_v1(game_core_component_v1 component) noexcept
{
    return game_core_component_mask_v1{1u} << static_cast<std::uint8_t>(component);
}

/** @brief ABI-safe three-component vector. */
struct game_vector3_v1
{
    float x{};
    float y{};
    float z{};
};

/** @brief ABI-safe quaternion stored in `(x, y, z, w)` order. */
struct game_quaternion_v1
{
    float x{};
    float y{};
    float z{};
    float w{1.0f};
};

/** @brief ABI-safe local transform. Cached world data remains engine-owned. */
struct game_transform_v1
{
    game_vector3_v1 position{};
    game_quaternion_v1 rotation{};
    game_vector3_v1 scale{1.0f, 1.0f, 1.0f};
};

/** @brief Borrowed UTF-8 string view valid until the component is modified or the callback returns. */
struct game_string_view_v1
{
    const char* data{};
    std::size_t size{};

    [[nodiscard]] constexpr bool valid() const noexcept
    {
        return data != nullptr;
    }
};

/** @brief Stable entity query over the exposed engine-owned component set. */
struct game_world_query_v1
{
    std::size_t structure_size{sizeof(game_world_query_v1)};
    game_core_component_mask_v1 required_core_components{};
    game_core_component_mask_v1 excluded_core_components{};
};

/** @brief Entity query visitor. Return false to stop visiting further matches. */
using game_visit_entity_v1 = bool (*)(void* user_data, game_entity_v1 entity);

/**
 * @brief Stable runtime-world API supplied to project callbacks.
 *
 * The table and its user_data are borrowed for the duration of the owning callback. Structural changes requested
 * from an ECS system are recorded in that system's command buffer and become visible at the scheduler phase boundary;
 * BeginPlay and EndPlay operate directly because they execute outside scheduled system work.
 */
struct game_world_api_v1
{
    std::size_t structure_size{sizeof(game_world_api_v1)};
    void* user_data{};

    game_entity_target_v1 (*create_entity)(void* user_data){};
    bool (*destroy_entity)(void* user_data, game_entity_target_v1 entity){};
    bool (*entity_alive)(void* user_data, game_entity_v1 entity){};
    std::size_t (*entity_count)(void* user_data){};
    bool (*query_entities)(void* user_data, const game_world_query_v1* query, void* visitor_user_data,
                           game_visit_entity_v1 visitor){};

    bool (*has_core_component)(void* user_data, game_entity_v1 entity, game_core_component_v1 component){};
    bool (*remove_core_component)(void* user_data, game_entity_target_v1 entity, game_core_component_v1 component){};

    game_string_view_v1 (*read_name)(void* user_data, game_entity_v1 entity){};
    bool (*set_name)(void* user_data, game_entity_target_v1 entity, const char* value, std::size_t value_size){};
    bool (*read_transform)(void* user_data, game_entity_v1 entity, game_transform_v1* value){};
    bool (*set_transform)(void* user_data, game_entity_target_v1 entity, const game_transform_v1* value){};
    game_string_view_v1 (*read_tag)(void* user_data, game_entity_v1 entity){};
    bool (*set_tag)(void* user_data, game_entity_target_v1 entity, const char* value, std::size_t value_size){};
    bool (*read_active)(void* user_data, game_entity_v1 entity, bool* value){};
    bool (*set_active)(void* user_data, game_entity_target_v1 entity, bool value){};
};

} // namespace arc::project
''')

          replace_once(
              'engine/project/inc/arc/project/project_module.h',
              '#pragma once\n\n#include <cstddef>\n#include <cstdint>\n',
              '#pragma once\n\n#include <arc/project/runtime_world_api.h>\n\n#include <cstddef>\n#include <cstdint>\n')

          replace_once(
              'engine/project/inc/arc/project/project_module.h',
              '''/** @brief ABI-safe transient entity handle used by project runtime callbacks. */
struct game_entity_v1
{
    std::uint32_t index{0xffffffffu};
    std::uint32_t generation{};

    [[nodiscard]] constexpr bool valid() const noexcept
    {
        return index != 0xffffffffu;
    }
};

''',
              '')

          replace_once(
              'engine/project/inc/arc/project/project_module.h',
              '''    std::uint64_t tick_id{};
    std::uint64_t world_id{};
    float delta_seconds{};
''',
              '''    std::uint64_t tick_id{};
    std::uint64_t world_id{};
    const game_world_api_v1* world{}; ///< Stable runtime-world bridge valid only for this invocation.
    float delta_seconds{};
''')

          replace_once(
              'engine/project/inc/arc/project/project_module.h',
              '''    const game_system_component_access_v1* component_accesses{}; ///< Declared reflected project-component access.
    std::size_t component_access_count{};                        ///< Number of entries in @ref component_accesses.
    bool unrestricted_native_world_access{true}; ///< Preserve legacy native_context access and serialize this system.
''',
              '''    const game_system_component_access_v1* component_accesses{}; ///< Declared reflected project-component access.
    std::size_t component_access_count{};                        ///< Number of entries in @ref component_accesses.
    const game_core_component_access_v1* core_component_accesses{}; ///< Declared stable engine-component access.
    std::size_t core_component_access_count{};                      ///< Number of core-component declarations.
    bool unrestricted_native_world_access{true}; ///< Preserve legacy native_context access and serialize this system.
''')

          replace_once(
              'engine/project/inc/arc/project/project_module.h',
              '''struct game_play_context_v1
{
    std::size_t structure_size{sizeof(game_play_context_v1)};
    std::uint64_t world_id{}; ///< Runtime world that owns this Play session.
};
''',
              '''struct game_play_context_v1
{
    std::size_t structure_size{sizeof(game_play_context_v1)};
    std::uint64_t world_id{};            ///< Runtime world that owns this Play session.
    const game_world_api_v1* world{};    ///< Stable runtime-world bridge for this lifecycle callback.
};
''')

          replace_once(
              'editor/native/src/project_module_loader.h',
              '''    std::vector<project_system_component_access> component_accesses;
    bool unrestricted_native_world_access{true};
''',
              '''    std::vector<project_system_component_access> component_accesses;
    std::vector<project::game_core_component_access_v1> core_component_accesses;
    bool unrestricted_native_world_access{true};
''')

          p = Path('editor/native/src/project_module_loader.cpp')
          s = p.read_text()
          s = s.replace('#include <arc/framework/runtime_world.h>\n',
                        '#include <arc/framework/runtime_world.h>\n#include <arc/scene/components.h>\n', 1)

          start = s.index('struct project_play_session_guard')
          end = s.index('bool stable_component_id', start)
          bridge = r'''struct project_component_bridge_context
{
    ecs::world* world{};
    ecs::entity_command_buffer* commands{};
    const std::vector<project_system_component_access>* declared_accesses{};
    const std::vector<project::game_core_component_access_v1>* declared_core_accesses{};
    bool unrestricted_core_access{};
    bool violation{};
    std::string violation_message;
};

const char* core_component_name(project::game_core_component_v1 component) noexcept
{
    switch (component)
    {
        case project::game_core_component_v1::name:
            return "name";
        case project::game_core_component_v1::transform:
            return "transform";
        case project::game_core_component_v1::tag:
            return "tag";
        case project::game_core_component_v1::active:
            return "active";
    }
    return "unknown";
}

bool allows_project_component_access(const project_component_bridge_context& bridge, std::string_view component_id,
                                     project::game_system_component_access_mode_v1 requested) noexcept
{
    if (!bridge.declared_accesses) return false;
    const auto found = std::find_if(bridge.declared_accesses->begin(), bridge.declared_accesses->end(),
                                    [&](const project_system_component_access& access)
                                    { return access.component_id == component_id; });
    if (found == bridge.declared_accesses->end()) return false;
    return requested == project::game_system_component_access_mode_v1::read ||
           found->mode == project::game_system_component_access_mode_v1::write;
}

bool require_project_component_access(project_component_bridge_context& bridge, std::string_view component_id,
                                      project::game_system_component_access_mode_v1 requested) noexcept
{
    if (allows_project_component_access(bridge, component_id, requested)) return true;
    bridge.violation = true;
    bridge.violation_message =
        std::string(requested == project::game_system_component_access_mode_v1::write ? "write" : "read") +
        " access to undeclared project component '" + std::string(component_id) + "'";
    return false;
}

bool allows_core_component_access(const project_component_bridge_context& bridge,
                                  project::game_core_component_v1 component,
                                  project::game_core_component_access_mode_v1 requested) noexcept
{
    if (bridge.unrestricted_core_access) return true;
    if (!bridge.declared_core_accesses) return false;
    const auto found = std::find_if(bridge.declared_core_accesses->begin(), bridge.declared_core_accesses->end(),
                                    [&](const project::game_core_component_access_v1& access)
                                    { return access.component == component; });
    if (found == bridge.declared_core_accesses->end()) return false;
    return requested == project::game_core_component_access_mode_v1::read ||
           found->mode == project::game_core_component_access_mode_v1::write;
}

bool require_core_component_access(project_component_bridge_context& bridge, project::game_core_component_v1 component,
                                   project::game_core_component_access_mode_v1 requested) noexcept
{
    if (allows_core_component_access(bridge, component, requested)) return true;
    bridge.violation = true;
    bridge.violation_message =
        std::string(requested == project::game_core_component_access_mode_v1::write ? "write" : "read") +
        " access to undeclared core component '" + core_component_name(component) + "'";
    return false;
}

[[nodiscard]] ecs::entity native_entity(project::game_entity_v1 entity) noexcept
{
    return {entity.index, entity.generation};
}

[[nodiscard]] project::game_entity_v1 game_entity(ecs::entity entity) noexcept
{
    return {entity.index, entity.generation};
}

project_runtime_component_value* runtime_project_component(project_component_bridge_context& bridge,
                                                           project::game_entity_v1 entity,
                                                           std::string_view component_id) noexcept
{
    if (!bridge.world || component_id.empty() || !entity.valid()) return nullptr;
    const ecs::entity value = native_entity(entity);
    if (!bridge.world->alive(value)) return nullptr;
    auto* components = bridge.world->try_get<project_runtime_component_set>(value);
    return components ? find_project_runtime_component(*components, component_id) : nullptr;
}

bool has_runtime_project_component(void* user_data, project::game_entity_v1 entity, const char* component_id) noexcept
{
    if (!user_data || !component_id || !*component_id) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!require_project_component_access(bridge, component_id, project::game_system_component_access_mode_v1::read))
        return false;
    return runtime_project_component(bridge, entity, component_id) != nullptr;
}

const char* read_runtime_project_component_json(void* user_data, project::game_entity_v1 entity,
                                                const char* component_id) noexcept
{
    if (!user_data || !component_id || !*component_id) return nullptr;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!require_project_component_access(bridge, component_id, project::game_system_component_access_mode_v1::read))
        return nullptr;
    const auto* component = runtime_project_component(bridge, entity, component_id);
    return component ? component->json.c_str() : nullptr;
}

bool patch_runtime_project_component_json(void* user_data, project::game_entity_v1 entity, const char* component_id,
                                          const char* patch_json) noexcept
{
    if (!user_data || !component_id || !*component_id || !patch_json) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!require_project_component_access(bridge, component_id, project::game_system_component_access_mode_v1::write))
        return false;
    auto* component = runtime_project_component(bridge, entity, component_id);
    if (!component) return false;
    auto patch = nlohmann::json::parse(patch_json, nullptr, false);
    if (!patch.is_object()) return false;
    auto current = nlohmann::json::parse(component->json, nullptr, false);
    if (!current.is_object()) current = nlohmann::json::object();
    current.update(patch);
    current["typeId"] = component->stable_id;
    current["version"] = component->schema_version;
    component->json = current.dump();
    return true;
}

bool for_each_runtime_project_component(void* user_data, const char* component_id, void* visitor_user_data,
                                        project::game_visit_project_component_v1 visitor) noexcept
{
    if (!user_data || !component_id || !*component_id || !visitor) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!require_project_component_access(bridge, component_id, project::game_system_component_access_mode_v1::read))
        return false;
    if (!bridge.world) return false;
    for (const auto entity : bridge.world->entities())
    {
        const auto runtime_entity = game_entity(entity);
        const auto* component = runtime_project_component(bridge, runtime_entity, component_id);
        if (component && !visitor(visitor_user_data, runtime_entity, component->json.c_str())) return false;
    }
    return true;
}

bool has_core_component_unchecked(const ecs::world& world, ecs::entity entity,
                                  project::game_core_component_v1 component) noexcept
{
    switch (component)
    {
        case project::game_core_component_v1::name:
            return world.has<scene::name_component>(entity);
        case project::game_core_component_v1::transform:
            return world.has<scene::transform_component>(entity);
        case project::game_core_component_v1::tag:
            return world.has<scene::tag_component>(entity);
        case project::game_core_component_v1::active:
            return world.has<scene::active_component>(entity);
    }
    return false;
}

project::game_entity_target_v1 create_runtime_entity(void* user_data) noexcept
{
    if (!user_data) return {};
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!bridge.world) return {};
    if (bridge.commands)
    {
        const auto entity = bridge.commands->create();
        return {.deferred = {entity.buffer, entity.ordinal}, .is_deferred = true};
    }
    return {.entity = game_entity(bridge.world->create())};
}

bool destroy_runtime_entity(void* user_data, project::game_entity_target_v1 target) noexcept
{
    if (!user_data || !target.valid()) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!bridge.world) return false;
    if (bridge.commands)
    {
        if (target.is_deferred)
            bridge.commands->destroy(ecs::deferred_entity{target.deferred.buffer, target.deferred.ordinal});
        else
        {
            const auto entity = native_entity(target.entity);
            if (!bridge.world->alive(entity)) return false;
            bridge.commands->destroy(entity);
        }
        return true;
    }
    return !target.is_deferred && bridge.world->destroy(native_entity(target.entity));
}

bool runtime_entity_alive(void* user_data, project::game_entity_v1 entity) noexcept
{
    if (!user_data || !entity.valid()) return false;
    const auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    return bridge.world && bridge.world->alive(native_entity(entity));
}

std::size_t runtime_entity_count(void* user_data) noexcept
{
    if (!user_data) return 0;
    const auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    return bridge.world ? bridge.world->live_count() : 0;
}

bool query_runtime_entities(void* user_data, const project::game_world_query_v1* query, void* visitor_user_data,
                            project::game_visit_entity_v1 visitor) noexcept
{
    if (!user_data || !query || query->structure_size < sizeof(project::game_world_query_v1) || !visitor) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!bridge.world) return false;
    constexpr auto known_mask = project::game_core_component_bit_v1(project::game_core_component_v1::name) |
                                project::game_core_component_bit_v1(project::game_core_component_v1::transform) |
                                project::game_core_component_bit_v1(project::game_core_component_v1::tag) |
                                project::game_core_component_bit_v1(project::game_core_component_v1::active);
    if (((query->required_core_components | query->excluded_core_components) & ~known_mask) != 0) return false;

    constexpr project::game_core_component_v1 components[]{project::game_core_component_v1::name,
                                                           project::game_core_component_v1::transform,
                                                           project::game_core_component_v1::tag,
                                                           project::game_core_component_v1::active};
    for (const auto component : components)
    {
        const auto bit = project::game_core_component_bit_v1(component);
        if (((query->required_core_components | query->excluded_core_components) & bit) != 0 &&
            !require_core_component_access(bridge, component, project::game_core_component_access_mode_v1::read))
            return false;
    }

    for (const auto entity : bridge.world->entities())
    {
        bool matches = true;
        for (const auto component : components)
        {
            const auto bit = project::game_core_component_bit_v1(component);
            const bool present = has_core_component_unchecked(*bridge.world, entity, component);
            if ((query->required_core_components & bit) != 0 && !present) matches = false;
            if ((query->excluded_core_components & bit) != 0 && present) matches = false;
        }
        if (matches && !visitor(visitor_user_data, game_entity(entity))) break;
    }
    return true;
}

bool has_runtime_core_component(void* user_data, project::game_entity_v1 entity,
                                project::game_core_component_v1 component) noexcept
{
    if (!user_data || !entity.valid()) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!bridge.world ||
        !require_core_component_access(bridge, component, project::game_core_component_access_mode_v1::read))
        return false;
    const auto value = native_entity(entity);
    return bridge.world->alive(value) && has_core_component_unchecked(*bridge.world, value, component);
}

template <class Component>
bool set_runtime_core_component(project_component_bridge_context& bridge, project::game_entity_target_v1 target,
                                Component component) noexcept
{
    if (!bridge.world || !target.valid()) return false;
    if (bridge.commands)
    {
        if (target.is_deferred)
        {
            bridge.commands->add<Component>(ecs::deferred_entity{target.deferred.buffer, target.deferred.ordinal},
                                            std::move(component));
            return true;
        }
        const auto entity = native_entity(target.entity);
        if (!bridge.world->alive(entity)) return false;
        if (auto* existing = bridge.world->try_get<Component>(entity))
        {
            *existing = std::move(component);
            return true;
        }
        bridge.commands->add<Component>(entity, std::move(component));
        return true;
    }
    if (target.is_deferred) return false;
    const auto entity = native_entity(target.entity);
    if (!bridge.world->alive(entity)) return false;
    bridge.world->emplace<Component>(entity, std::move(component));
    return true;
}

template <class Component>
bool remove_runtime_core_component_value(project_component_bridge_context& bridge,
                                         project::game_entity_target_v1 target) noexcept
{
    if (!bridge.world || !target.valid()) return false;
    if (bridge.commands)
    {
        if (target.is_deferred)
            bridge.commands->remove<Component>(ecs::deferred_entity{target.deferred.buffer, target.deferred.ordinal});
        else
        {
            const auto entity = native_entity(target.entity);
            if (!bridge.world->alive(entity) || !bridge.world->has<Component>(entity)) return false;
            bridge.commands->remove<Component>(entity);
        }
        return true;
    }
    return !target.is_deferred && bridge.world->remove<Component>(native_entity(target.entity));
}

bool remove_runtime_core_component(void* user_data, project::game_entity_target_v1 target,
                                   project::game_core_component_v1 component) noexcept
{
    if (!user_data) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!require_core_component_access(bridge, component, project::game_core_component_access_mode_v1::write))
        return false;
    switch (component)
    {
        case project::game_core_component_v1::name:
            return remove_runtime_core_component_value<scene::name_component>(bridge, target);
        case project::game_core_component_v1::transform:
            return remove_runtime_core_component_value<scene::transform_component>(bridge, target);
        case project::game_core_component_v1::tag:
            return remove_runtime_core_component_value<scene::tag_component>(bridge, target);
        case project::game_core_component_v1::active:
            return remove_runtime_core_component_value<scene::active_component>(bridge, target);
    }
    return false;
}

project::game_string_view_v1 read_runtime_name(void* user_data, project::game_entity_v1 entity) noexcept
{
    if (!user_data || !entity.valid()) return {};
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!bridge.world || !require_core_component_access(bridge, project::game_core_component_v1::name,
                                                        project::game_core_component_access_mode_v1::read))
        return {};
    const auto& world = std::as_const(*bridge.world);
    const auto* value = world.try_get<scene::name_component>(native_entity(entity));
    return value ? project::game_string_view_v1{value->value.data(), value->value.size()} : project::game_string_view_v1{};
}

bool set_runtime_name(void* user_data, project::game_entity_target_v1 entity, const char* value,
                      std::size_t value_size) noexcept
{
    if (!user_data || (!value && value_size != 0)) return false;
    auto& bridge = *static_cast<project_component_bridge_context*>(user_data);
    if (!require_core_component_access(bridge, project::game_core_component_v1::name,
                                       project::game_core_component_access_mode_v1::write))
        return false;
    std::string text;
    if (value_size != 0) text.assign(value, value_size);
