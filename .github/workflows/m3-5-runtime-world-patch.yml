name: Apply M3.5 runtime world API patch

on:
  push:
    branches:
      - feature/play-session-m35-runtime-world-api

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: expose runtime world operations to project modules'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/play-session-m35-runtime-world-api
          fetch-depth: 0
      - name: Apply M3.5 runtime world API
        run: python3 .github/scripts/apply_m35_runtime_world.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m3-5-runtime-world-patch.yml .github/scripts/apply_m35_runtime_world.py
          git add engine/project/inc/arc/project/project_module.h \
                  engine/project/inc/arc/project/runtime_world_api.h \
                  editor/native/src/project_module_loader.h \
                  editor/native/src/project_module_loader.cpp \
                  editor/native/src/project_runtime_world_bridge.h \
                  editor/native/tests/game_module_fixture_system.cpp \
                  editor/native/tests/game_module_fixture_lifecycle.cpp
          git commit -m "feat: expose runtime world operations to project modules"
          git push origin HEAD:feature/play-session-m35-runtime-world-api
