name: Apply play session M1

on:
  push:
    branches:
      - feature/play-session-m1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/play-session-m1
          fetch-depth: 0

      - name: Apply play session foundation
        run: python3 .github/scripts/apply_play_session_m1.py

      - name: Fix generated JSON literals
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('editor/native/src/arc_host_base.inc')
          text = path.read_text()
          text = text.replace('return success("{"playSession":true}");', 'return success(R"({"playSession":true})");')
          text = text.replace('return success("{"pending":false,"playSession":true}");', 'return success(R"({"pending":false,"playSession":true})");')
          path.write_text(text)
          PY

      - name: Format changed C++
        run: |
          git add \
            engine/framework/inc/arc/framework/runtime_world.h \
            engine/framework/src/common/runtime_world.cpp \
            engine/framework/tests/framework_tests.cpp \
            editor/native/src/arc_host_base.inc \
            editor/native/tests/editor_tests.cpp
          set +e
          git clang-format-18 origin/main -- \
            engine/framework/inc/arc/framework/runtime_world.h \
            engine/framework/src/common/runtime_world.cpp \
            engine/framework/tests/framework_tests.cpp \
            editor/native/src/arc_host_base.inc \
            editor/native/tests/editor_tests.cpp
          format_status=$?
          set -e
          if [ "$format_status" -gt 1 ]; then exit "$format_status"; fi
          git reset

      - name: Configure focused native build
        run: >-
          cmake --preset editor-no-vulkan -G Ninja -DARC_BUILD_SAMPLES=OFF
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18

      - name: Build focused native tests
        run: cmake --build --preset editor-no-vulkan --target arc_framework_tests arc_editor_host_tests -j 2

      - name: Run focused native tests
        run: |
          framework_test="$(find out/build/editor-no-vulkan -type f -name arc_framework_tests -print -quit)"
          editor_test="$(find out/build/editor-no-vulkan -type f -name arc_editor_host_tests -print -quit)"
          test -n "$framework_test"
          test -n "$editor_test"
          "$framework_test"
          "$editor_test"

      - name: Commit changes
        run: |
          rm .github/workflows/temp-play-session-m1.yml
          rm .github/scripts/apply_play_session_m1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/framework/inc/arc/framework/runtime_world.h \
            engine/framework/src/common/runtime_world.cpp \
            engine/framework/tests/framework_tests.cpp \
            editor/native/src/arc_host_base.inc \
            editor/native/tests/editor_tests.cpp \
            .github/workflows/temp-play-session-m1.yml \
            .github/scripts/apply_play_session_m1.py
          git commit -m "Add isolated editor play sessions"
          git push origin HEAD:feature/play-session-m1
