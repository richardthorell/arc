name: Temporary material node menu cascade

on:
  push:
    branches:
      - fix/material-node-menu-cascade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/material-node-menu-cascade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Update material node menu
        run: python3 .github/scripts/patch_material_node_menu.py
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Format changed editor files
        working-directory: editor
        run: npx prettier --write src/renderer/src/material/MaterialGraphEditor.tsx src/renderer/src/material/MaterialGraphEditor.test.tsx src/renderer/src/material/materialEditor.css
      - name: Typecheck editor
        working-directory: editor
        run: npm run typecheck
      - name: Test material graph editor
        working-directory: editor
        run: npm test -- src/renderer/src/material/MaterialGraphEditor.test.tsx
      - name: Remove temporary helpers
        run: rm .github/workflows/temporary-material-node-menu-cascade.yml .github/scripts/patch_material_node_menu.py
      - name: Commit material node menu fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve material node menu navigation"
          git push origin HEAD:fix/material-node-menu-cascade
