name: Format PR 92

on:
  push:
    branches: [feature/material-picker-open-editor]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-pr92]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/material-picker-open-editor
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - name: Format changed editor files
        working-directory: editor
        run: npx prettier --write src/renderer/src/inspector/AssetPicker.tsx src/renderer/src/inspector/MaterialPickerOpen.test.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- editor/src/renderer/src/inspector/AssetPicker.tsx editor/src/renderer/src/inspector/MaterialPickerOpen.test.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/inspector/AssetPicker.tsx editor/src/renderer/src/inspector/MaterialPickerOpen.test.tsx
          git commit -m "style: format material picker [format-pr92]"
          git push origin HEAD:feature/material-picker-open-editor
