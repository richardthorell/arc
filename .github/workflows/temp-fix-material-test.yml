name: Temporary Material Test Fix

on:
  push:
    branches:
      - fix/main-build-2026-09-03

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/main-build-2026-09-03
          fetch-depth: 0

      - name: Update stale assertion
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('editor/native/tests/editor_tests.cpp'); s=p.read_text(); old='    REQUIRE_FALSE(packet.events.empty());\\n    REQUIRE(packet.events.back().type() == arc::render::render_event_type::material_upload);\\n    const auto& upload = std::get<arc::render::material_upload_event>(packet.events.back().payload);\\n'; new='    REQUIRE_FALSE(packet.events.empty());\\n    const auto upload_event = std::ranges::find_if(packet.events, [](const auto& event) { return event.type() == arc::render::render_event_type::material_upload; });\\n    REQUIRE(upload_event != packet.events.end());\\n    const auto& upload = std::get<arc::render::material_upload_event>(upload_event->payload);\\n'; assert old in s; p.write_text(s.replace(old,new,1))"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-format-18 ninja-build

      - name: Format
        run: clang-format-18 -i editor/native/tests/editor_tests.cpp

      - name: Configure
        run: cmake -S . -B out/build/material-test -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DARC_BUILD_SAMPLES=OFF -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build out/build/material-test --target arc_editor_host_tests --parallel

      - name: Test
        run: out/build/material-test/editor/native/tests/arc_editor_host_tests "editor material library reuses material handles and saves live updates"

      - name: Commit
        run: |
          rm .github/workflows/temp-fix-material-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/tests/editor_tests.cpp .github/workflows/temp-fix-material-test.yml
          git commit -m "Fix material library render event test"
          git push origin HEAD:fix/main-build-2026-09-03
