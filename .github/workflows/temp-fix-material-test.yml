name: Temporary Material Test Fix

on:
  push:
    branches:
      - fix/main-build-2026-09-03

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/main-build-2026-09-03
          fetch-depth: 0

      - name: Update stale material event assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/native/tests/editor_tests.cpp')
          text = path.read_text()
          old = '''    REQUIRE_FALSE(packet.events.empty());
    REQUIRE(packet.events.back().type() == arc::render::render_event_type::material_upload);
    const auto& upload = std::get<arc::render::material_upload_event>(packet.events.back().payload);
    REQUIRE(upload.handle == opened);
    REQUIRE(upload.material->roughness == Catch::Approx(0.21f));
'''
          new = '''    REQUIRE_FALSE(packet.events.empty());
    const auto upload_event = std::ranges::find_if(packet.events, [](const auto& event) {
        return event.type() == arc::render::render_event_type::material_upload;
    });
    REQUIRE(upload_event != packet.events.end());
    const auto& upload = std::get<arc::render::material_upload_event>(upload_event->payload);
    REQUIRE(upload.handle == opened);
    REQUIRE(upload.material->roughness == Catch::Approx(0.21f));
'''
          if old not in text:
              raise SystemExit('expected material test block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install Clang 18 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 ninja-build

      - name: Format test
        run: clang-format-18 -i editor/native/tests/editor_tests.cpp

      - name: Configure editor tests
        run: cmake -S . -B out/build/material-test -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DARC_BUILD_SAMPLES=OFF -DBUILD_TESTING=ON

      - name: Build editor tests
        run: cmake --build out/build/material-test --target arc_editor_host_tests --parallel

      - name: Run material regression
        run: out/build/material-test/editor/native/tests/arc_editor_host_tests "editor material library reuses material handles and saves live updates"

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/temp-fix-material-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/tests/editor_tests.cpp .github/workflows/temp-fix-material-test.yml
          git commit -m "Fix material library render event test"
          git push origin HEAD:fix/main-build-2026-09-03
