name: ARC one-shot Vulkan presentation refactor

on:
  push:
    branches:
      - agent/remove-imgui-vulkan-presentation

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-imgui-vulkan-presentation
          fetch-depth: 0

      - name: Refactor Vulkan presentation
        shell: bash
        run: |
          sed -i 's/ImGui texture handle/legacy texture handle/' tools/remove_imgui_refactor.py
          python3 tools/remove_imgui_refactor.py

      - name: Commit refactor
        shell: bash
        run: |
          rm .github/workflows/arc-remove-imgui-refactor.yml
          rm tools/remove_imgui_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decouple Vulkan presentation from ImGui"
          git push origin HEAD:agent/remove-imgui-vulkan-presentation
