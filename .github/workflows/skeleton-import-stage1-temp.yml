name: Skeleton Import Stage 1

on:
  push:
    branches:
      - feat/basic-skeleton-import

permissions:
  contents: write

env:
  CC: clang-18
  CXX: clang++-18

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/basic-skeleton-import

      - name: Apply skeleton importer implementation
        run: python3 tools/apply_skeleton_stage1_patch.py

      - name: Format changed C++
        run: |
          clang-format-18 -i \
            engine/render/inc/arc/render/mesh.h \
            engine/render/src/common/mesh.cpp \
            engine/render/tests/skeleton_import_tests.cpp

      - name: Configure render tests
        run: |
          cmake -S . -B out/build/skeleton -G Ninja \
            -DARC_BUILD_EDITOR=OFF \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_BUILD_ASSET_COOKER=OFF \
            -DARC_BUILD_PROJECT_TOOL=OFF \
            -DARC_BUILD_ENGINE_TESTS=ON

      - name: Build render tests
        run: cmake --build out/build/skeleton --target arc_render_tests -j2

      - name: Run skeleton tests
        run: out/build/skeleton/engine/render/tests/arc_render_tests "[skeleton]"

      - name: Configure ufbx compile coverage
        run: |
          cmake -S . -B out/build/skeleton-ufbx -G Ninja \
            -DARC_BUILD_EDITOR=ON \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_BUILD_ASSET_COOKER=OFF \
            -DARC_BUILD_PROJECT_TOOL=OFF \
            -DARC_BUILD_ENGINE_TESTS=OFF

      - name: Compile render with ufbx
        run: cmake --build out/build/skeleton-ufbx --target arc-render -j2

      - name: Verify format and diff
        run: |
          python3 tools/check_format.py --clang-format clang-format-18
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/inc/arc/render/mesh.h \
                  engine/render/src/common/mesh.cpp \
                  engine/render/tests/skeleton_import_tests.cpp
          git rm .github/workflows/skeleton-import-stage1-temp.yml tools/apply_skeleton_stage1_patch.py
          git diff --cached --check
          git commit -m "Import basic model skeletons"
          git push origin HEAD:feat/basic-skeleton-import
