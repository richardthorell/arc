name: ARC Vulkan shared texture export refactor

on:
  push:
    branches:
      - agent/vulkan-direct-shared-texture-export

permissions:
  contents: write

jobs:
  fix-host-fallback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Update non-Windows viewport fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('editor/native/src/arc_host_process_main.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''class native_viewport_controller
          {
          public:
              native_viewport_controller(std::shared_ptr<arc::editor::arc_host>, std::mutex&, arc::jobs::job_system&) {}

              void attach(std::string, std::uint64_t, std::int32_t, std::int32_t, std::uint32_t, std::uint32_t)
              {
                  std::cerr << "arc_host_process native viewport rendering is not available in this build\\n";
              }

              void resize(std::int32_t, std::int32_t, std::uint32_t, std::uint32_t) {}

              void detach(std::string_view) {}

              void stop() {}
          };
          '''
          new = '''class native_viewport_controller
          {
          public:
              native_viewport_controller(std::shared_ptr<arc::editor::arc_host>, std::mutex&, std::mutex&,
                                         arc::jobs::job_system&)
              {
              }

              void attach(std::string, std::uint64_t, std::int32_t, std::int32_t, std::uint32_t, std::uint32_t)
              {
                  std::cerr << "arc_host_process native viewport rendering is not available in this build\\n";
              }

              bool create_shared(std::string, std::uint64_t, std::uint32_t, std::uint32_t, std::string& error)
              {
                  error = "Shared viewport rendering is not available in this build";
                  return false;
              }

              void release_frame(std::string, std::uint64_t, std::uint64_t, std::string) {}

              void set_visible(std::string_view, bool) {}

              void pointer(const arc::editor::host_viewport_pointer_command&) {}

              void key(const arc::editor::host_viewport_key_command&) {}

              void resize(std::int32_t, std::int32_t, std::uint32_t, std::uint32_t) {}

              void detach(std::string_view) {}

              void stop() {}
          };
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one fallback block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflows and commit fix
        shell: bash
        run: |
          rm .github/workflows/arc-vulkan-shared-export-refactor.yml
          rm -f .github/workflows/arc-host-process-fallback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/src/arc_host_process_main.cpp .github/workflows/arc-vulkan-shared-export-refactor.yml
          git add -u .github/workflows/arc-host-process-fallback-fix.yml || true
          git diff --cached --check
          git commit -m "Fix non-Windows viewport controller fallback"
          git push
