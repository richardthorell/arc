name: Fix PR 189 public API policy

on:
  push:
    branches:
      - fix/main-formatting
    paths:
      - .github/workflows/fix-pr189-public-api-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/main-formatting

      - name: Mark public result types nodiscard
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('engine/render/inc/arc/render/gpu_driven.h'): (
                  'struct gpu_draw_compaction_result\n',
                  'struct [[nodiscard]] gpu_draw_compaction_result\n',
              ),
              Path('engine/render/inc/arc/render/virtual_geometry.h'): (
                  'struct virtual_geometry_page_upload_result\n',
                  'struct [[nodiscard]] virtual_geometry_page_upload_result\n',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'could not find expected declaration in {path}')
              path.write_text(text.replace(old, new, 1))

      - name: Verify policy and formatting
        run: |
          python3 tools/check_format.py --clang-format clang-format-18
          cmake -S . -B out/build/policy -G Ninja -DARC_BUILD_EDITOR=OFF -DARC_BUILD_RENDER_VULKAN=OFF -DBUILD_TESTING=ON
          ctest --test-dir out/build/policy -R '^arc-public-api-policy$' --output-on-failure

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/inc/arc/render/gpu_driven.h engine/render/inc/arc/render/virtual_geometry.h
          git diff --cached --check
          git commit -m "Fix render public API result annotations"
          git push origin HEAD:fix/main-formatting
