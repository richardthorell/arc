name: Apply platform validation UI update

on:
  push:
    branches:
      - ui/platform-validation-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/platform-validation-status
          fetch-depth: 0
      - name: Patch preferences UI and tests
        shell: python
        run: |
          from pathlib import Path

          dialog = Path('editor/src/renderer/src/settings/EditorPreferencesDialog.tsx')
          text = dialog.read_text(encoding='utf-8')
          text = text.replace(
              "const isAndroidPathSetting = (descriptor: EditorSettingDescriptor) =>\n  descriptor.section === 'Android' && descriptor.type === 'string';\n\n",
              '',
          )
          text = text.replace(
              "                const pathSetting = isPlatformPathSetting(descriptor);\n                const androidPathSetting = isAndroidPathSetting(descriptor);\n                const pathValidation = androidPathSetting ? snapshot?.pathValidation?.[descriptor.key] : undefined;",
              "                const pathSetting = isPlatformPathSetting(descriptor);\n                const pathValidation = pathSetting ? snapshot?.pathValidation?.[descriptor.key] : undefined;",
          )
          text = text.replace(
              "                          {pathValidation.message}\n                          {pathValidation.resolvedPath ? ` · ${pathValidation.resolvedPath}` : ''}",
              "                          {pathValidation.valid ? 'Validated' : pathValidation.message}\n                          {!pathValidation.valid && pathValidation.resolvedPath ? ` · ${pathValidation.resolvedPath}` : ''}",
          )
          dialog.write_text(text, encoding='utf-8')

          tests = Path('editor/src/renderer/src/settings/SettingsDialog.test.tsx')
          text = tests.read_text(encoding='utf-8')
          anchor = "  it('shows framework pages that do not have registered preferences yet', () => {"
          test = """  it('shows concise validation status for Android and Windows toolchains', async () => {\n    window.arc.settings.snapshot = vi.fn().mockResolvedValue({\n      revision: 9,\n      schema: [\n        {\n          key: 'platform.windows.visualStudioPath',\n          section: 'Windows',\n          label: 'Visual Studio',\n          description: 'Visual Studio installation root.',\n          type: 'string',\n          defaultValue: '',\n          scopes: ['user'],\n        },\n        {\n          key: 'platform.android.javaHome',\n          section: 'Android',\n          label: 'Java / JDK',\n          description: 'JDK root used by Android builds.',\n          type: 'string',\n          defaultValue: '',\n          scopes: ['user'],\n        },\n      ],\n      values: {\n        'platform.windows.visualStudioPath': 'C:\\\\Program Files\\\\Microsoft Visual Studio',\n        'platform.android.javaHome': 'C:\\\\Program Files\\\\Java\\\\jdk-26',\n      },\n      sources: {\n        'platform.windows.visualStudioPath': 'default',\n        'platform.android.javaHome': 'default',\n      },\n      restartRequired: [],\n      pathValidation: {\n        'platform.windows.visualStudioPath': {\n          valid: true,\n          resolvedPath: 'C:\\\\Program Files\\\\Microsoft Visual Studio',\n          message: 'Validated · Visual Studio C++',\n          source: 'default',\n        },\n        'platform.android.javaHome': {\n          valid: true,\n          resolvedPath: 'C:\\\\Program Files\\\\Java\\\\jdk-26',\n          message: 'Validated · Java 26',\n          source: 'default',\n        },\n      },\n      aiProviders: {\n        secureStorageAvailable: true,\n        providers: [\n          { id: 'openai', label: 'OpenAI', connected: false, connectionStatus: 'disconnected' },\n          { id: 'anthropic', label: 'Anthropic', connected: false, connectionStatus: 'disconnected' },\n        ],\n      },\n    });\n\n    render(<EditorPreferencesDialog onClose={vi.fn()} onResetLayout={vi.fn()} />);\n    await waitFor(() => expect(window.arc.settings.snapshot).toHaveBeenCalledTimes(1));\n\n    fireEvent.click(screen.getByRole('treeitem', { name: /Windows/ }));\n    const windowsStatus = screen.getByText('Validated');\n    expect(windowsStatus).toHaveClass('settings-field-validation-valid');\n    expect(windowsStatus).toHaveAttribute('title', 'C:\\\\Program Files\\\\Microsoft Visual Studio');\n    expect(screen.queryByText('Validated · Visual Studio C++')).not.toBeInTheDocument();\n\n    fireEvent.click(screen.getByRole('treeitem', { name: /Android/ }));\n    const androidStatus = screen.getByText('Validated');\n    expect(androidStatus).toHaveClass('settings-field-validation-valid');\n    expect(androidStatus).toHaveAttribute('title', 'C:\\\\Program Files\\\\Java\\\\jdk-26');\n    expect(screen.queryByText('Validated · Java 26')).not.toBeInTheDocument();\n  });\n\n"""
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          tests.write_text(text.replace(anchor, test + anchor), encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-platform-validation-status.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/settings/EditorPreferencesDialog.tsx editor/src/renderer/src/settings/SettingsDialog.test.tsx .github/workflows/apply-platform-validation-status.yml
          git diff --cached --check
          git commit -m "Editor: simplify platform validation status"
          git push origin HEAD:ui/platform-validation-status
