name: Apply M3.2 terrain editor integration v2

on:
  push:
    branches:
      - m3/terrain-edit-mode-ui

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: wire M3.2 terrain edit mode'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m3/terrain-edit-mode-ui
          fetch-depth: 0
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Apply integration patch
        run: python3 tools/m3_2_patch.py
      - name: Format native changes
        run: |
          clang-format-18 -i \
            editor/native/inc/arc/editor/host_protocol_base.h \
            editor/native/src/host_protocol_base.inc \
            editor/native/src/arc_host_base.inc
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/inc/arc/editor/host_protocol_base.h \
                  editor/native/src/host_protocol_base.inc \
                  editor/native/src/arc_host_base.inc \
                  editor/src/renderer/src/app/Workbench.tsx \
                  editor/src/renderer/src/viewport/ViewportPanel.tsx \
                  editor/src/renderer/src/viewport/viewport.css
          git commit -m "feat: wire M3.2 terrain edit mode"
          git push origin HEAD:m3/terrain-edit-mode-ui
