name: Temporary model import inspect
on:
  push:
    branches:
      - feature/model-drag-drop-obj
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-drag-drop-obj
      - name: Inspect model and file drop paths
        run: |
          echo '=== importer references ==='
          grep -RInE "ufbx|gltf|glb|fbx|obj|importScene|openScene|copyFile|dataTransfer\.files|asset\.reimport|scene\.open" editor engine third_party --include='*.cpp' --include='*.h' --include='*.ts' --include='*.tsx' --include='CMakeLists.txt' | head -n 700 || true
          echo '=== texture import references ==='
          grep -RIn "importTexture\|ExternalTextureImport\|externalTexture" editor/src | head -n 300 || true
          echo '=== viewport asset drop ==='
          cat editor/src/renderer/src/viewport/viewportAssetDrop.ts
          echo '=== mesh picker ==='
          cat editor/src/renderer/src/inspector/MeshRendererAssetPicker.test.tsx
