name: Temporary Fix AI Scroll Tests

on:
  push:
    branches: [feature/ai-assistant-stage-1]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/ai-assistant-stage-1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - name: Patch scroll behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/src/renderer/src/ai/AiGatewayPanel.tsx')
          text = path.read_text()
          old = """  useEffect(() => {\n    messageEnd.current?.scrollIntoView({ block: 'end' });\n  }, [activeConversation?.messages]);\n"""
          new = """  useEffect(() => {\n    const scrollIntoView = messageEnd.current?.scrollIntoView;\n    if (typeof scrollIntoView === 'function') {\n      scrollIntoView.call(messageEnd.current, { block: 'end' });\n    }\n  }, [activeConversation?.messages]);\n"""
          if old not in text:
              raise SystemExit('target scroll effect not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format and validate editor
        working-directory: editor
        run: |
          npx prettier --write src/renderer/src/ai/AiGatewayPanel.tsx
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/ai/AiGatewayPanel.tsx
          git commit -m "Guard assistant scroll behavior in tests"
          git push origin HEAD:feature/ai-assistant-stage-1
