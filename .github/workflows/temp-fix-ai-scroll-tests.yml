name: Temporary Fix Settings Platform Icons

on:
  push:
    branches: [editor/settings-layout-polish]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: editor/settings-layout-polish
          fetch-depth: 2
      - name: Patch unsupported icon imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('editor/src/renderer/src/settings/EditorPreferencesDialog.tsx')
          text = path.read_text()
          original = text
          text = text.replace('  SiWindows11,\n  SiXbox,\n', '')
          text = text.replace('  windows: <SiWindows11 aria-hidden="true" size={16} />,', '  windows: <Monitor aria-hidden="true" size={16} />,')
          text = text.replace('  xbox: <SiXbox aria-hidden="true" size={16} />,', '  xbox: <Gamepad2 aria-hidden="true" size={16} />,')
          text = text.replace('  FolderOpen,\n  Hammer,', '  FolderOpen,\n  Gamepad2,\n  Hammer,')
          if text == original:
              raise SystemExit('target icon imports were not found')
          path.write_text(text)
          PY
      - name: Restore temporary workflow
        run: git checkout HEAD^ -- .github/workflows/temp-fix-ai-scroll-tests.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/settings/EditorPreferencesDialog.tsx .github/workflows/temp-fix-ai-scroll-tests.yml
          git commit -m "Fix settings platform icon imports"
          git push origin HEAD:editor/settings-layout-polish
