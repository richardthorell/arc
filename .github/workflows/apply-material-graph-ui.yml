name: Apply Material Graph UI

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'polish/material-graph-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply material graph refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          graph = 'editor/src/renderer/src/material/MaterialGraphEditor.tsx'
          replace_once(
              graph,
              "import type { EditorDocument } from '../editors/editorTypes';\n",
              "import type { EditorDocument } from '../editors/editorTypes';\nimport { UiButton, UiContextMenu, UiContextMenuItem, UiNodeCard, UiTextInput } from '../ui';\n",
          )
          replace_once(
              graph,
              "      className={`material-graph-canvas ${document.readOnly ? 'read-only' : ''}`}\n      ref={canvasRef}\n      tabIndex={0}\n",
              "      aria-label=\"Material graph\"\n      className={`material-graph-canvas ${document.readOnly ? 'read-only' : ''}`}\n      ref={canvasRef}\n      role=\"application\"\n      tabIndex={0}\n",
          )
          replace_once(
              graph,
              '''      <div className="material-graph-canvas-actions">
        <button
          disabled={document.readOnly}
          onClick={() => {
            const rect = canvasRef.current?.getBoundingClientRect();
            if (!rect) return;
            const screen: [number, number] = [24, 48];
            setAddMenu({ screen, graph: graphPoint(rect.left + screen[0], rect.top + screen[1]) });
          }}
        >
          <Plus size={13} /> Add Node
        </button>
        <button disabled={!selectedNodes.size} onClick={copySelected}>
          <Copy size={13} /> Copy
        </button>
        <button disabled={document.readOnly || !selectedNodes.size} onClick={deleteSelected}>
          <Trash2 size={13} /> Delete
        </button>
        <span>{Math.round(viewport.zoom * 100)}%</span>
      </div>''',
              '''      <div className="material-graph-canvas-actions">
        <UiButton
          disabled={document.readOnly}
          onClick={() => {
            const rect = canvasRef.current?.getBoundingClientRect();
            if (!rect) return;
            const screen: [number, number] = [24, 48];
            setAddMenu({ screen, graph: graphPoint(rect.left + screen[0], rect.top + screen[1]) });
          }}
          variant="ghost"
        >
          <Plus size={13} /> Add Node
        </UiButton>
        <UiButton disabled={!selectedNodes.size} onClick={copySelected} variant="ghost">
          <Copy size={13} /> Copy
        </UiButton>
        <UiButton disabled={document.readOnly || !selectedNodes.size} onClick={deleteSelected} variant="ghost">
          <Trash2 size={13} /> Delete
        </UiButton>
        <span>{Math.round(viewport.zoom * 100)}%</span>
      </div>''',
          )
          replace_once(
              graph,
              '''            <article
              className={`material-graph-node material-graph-node-${node.type} ${selected ? 'selected' : ''}`}
              data-node-id={node.id}
              key={node.id}
              style={{ left: node.position[0], top: node.position[1], width: nodeWidth }}
              onPointerDown={(event) => {
                if (event.button !== 0) return;
                event.stopPropagation();
                if (!event.ctrlKey && !event.metaKey && !selected) setSelectedNodes(new Set([node.id]));
                else if (event.ctrlKey || event.metaKey) {
                  setSelectedNodes((current) => {
                    const next = new Set(current);
                    if (next.has(node.id)) next.delete(node.id);
                    else next.add(node.id);
                    return next;
                  });
                }
              }}
            >
              <header
                onPointerDown={(event) => {
                  if (document.readOnly || event.button !== 0) return;
                  event.preventDefault();
                  event.stopPropagation();
                  const selection = selected ? selectedNodes : new Set([node.id]);
                  if (!selected) setSelectedNodes(selection);
                  const origins = new Map<string, [number, number]>();
                  for (const candidate of graph.nodes)
                    if (selection.has(candidate.id)) origins.set(candidate.id, [...candidate.position]);
                  setDrag({ start: graphPoint(event.clientX, event.clientY), nodes: origins });
                }}
              >
                <strong>{definition.title}</strong>
                {node.parameter?.exposed && <span title={`Parameter: ${node.parameter.name}`}>P</span>}
              </header>''',
              '''            <UiNodeCard
              badge={node.parameter?.exposed ? 'P' : undefined}
              badgeTitle={node.parameter?.exposed ? `Parameter: ${node.parameter.name}` : undefined}
              className={`material-graph-node material-graph-node-${node.type}`}
              data-node-id={node.id}
              heading={definition.title}
              key={node.id}
              selected={selected}
              style={{ left: node.position[0], top: node.position[1], width: nodeWidth }}
              tone={node.type === 'output' ? 'accent' : 'default'}
              onPointerDown={(event) => {
                if (event.button !== 0) return;
                event.stopPropagation();
                if (!event.ctrlKey && !event.metaKey && !selected) setSelectedNodes(new Set([node.id]));
                else if (event.ctrlKey || event.metaKey) {
                  setSelectedNodes((current) => {
                    const next = new Set(current);
                    if (next.has(node.id)) next.delete(node.id);
                    else next.add(node.id);
                    return next;
                  });
                }
              }}
              onHeaderPointerDown={(event) => {
                if (document.readOnly || event.button !== 0) return;
                event.preventDefault();
                event.stopPropagation();
                const selection = selected ? selectedNodes : new Set([node.id]);
                if (!selected) setSelectedNodes(selection);
                const origins = new Map<string, [number, number]>();
                for (const candidate of graph.nodes)
                  if (selection.has(candidate.id)) origins.set(candidate.id, [...candidate.position]);
                setDrag({ start: graphPoint(event.clientX, event.clientY), nodes: origins });
              }}
            >''',
          )
          replace_once(graph, '            </article>\n          );', '            </UiNodeCard>\n          );')
          replace_once(
              graph,
              '''      {addMenu && (
        <div className="material-node-menu" style={{ left: addMenu.screen[0], top: addMenu.screen[1] }}>
          <label>
            <Search size={13} />
            <input
              autoFocus
              placeholder="Search nodes"
              value={nodeSearch}
              onChange={(event) => setNodeSearch(event.target.value)}
              onKeyDown={(event) => {
                if (event.key === 'Escape') setAddMenu(null);
                else if (event.key === 'Enter' && availableNodes[0]) addNode(availableNodes[0].type);
              }}
            />
          </label>
          <div>
            {availableNodes.map((definition) => (
              <button key={definition.type} onClick={() => addNode(definition.type)}>
                <strong>{definition.title}</strong>
                <small>{definition.category}</small>
              </button>
            ))}
          </div>
        </div>
      )}''',
              '''      {addMenu && (
        <UiContextMenu
          aria-label="Add material node"
          className="material-node-menu"
          maxHeight={420}
          width={280}
          x={addMenu.screen[0]}
          y={addMenu.screen[1]}
        >
          <div className="material-node-menu-search">
            <Search size={13} />
            <UiTextInput
              aria-label="Search material nodes"
              autoFocus
              placeholder="Search nodes"
              value={nodeSearch}
              onChange={(event) => setNodeSearch(event.target.value)}
              onKeyDown={(event) => {
                if (event.key === 'Escape') setAddMenu(null);
                else if (event.key === 'Enter' && availableNodes[0]) addNode(availableNodes[0].type);
              }}
            />
          </div>
          <div className="material-node-menu-items">
            {availableNodes.map((definition) => (
              <UiContextMenuItem
                key={definition.type}
                onClick={() => addNode(definition.type)}
                trailing={<small>{definition.category}</small>}
              >
                <strong>{definition.title}</strong>
              </UiContextMenuItem>
            ))}
          </div>
        </UiContextMenu>
      )}''',
          )

          css = 'editor/src/renderer/src/material/materialEditor.css'
          replace_once(
              css,
              '''.material-graph-node {
  position: absolute;
  min-height: 88px;
  overflow: visible;
  color: #cad7de;
  border: 1px solid #31434d;
  border-radius: 6px;
  background: #17232a;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.34);
  user-select: none;
}

.material-graph-node:hover {
  border-color: #405865;
}

.material-graph-node.selected {
  border-color: #50a9c2;
  box-shadow:
    0 0 0 1px rgba(71, 184, 200, 0.33),
    0 9px 24px rgba(0, 0, 0, 0.4);
}

.material-graph-node > header {
  min-height: 33px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  color: #e1ebef;
  border-bottom: 1px solid rgba(100, 132, 147, 0.22);
  border-radius: 5px 5px 0 0;
  background: #22333c;
  cursor: grab;
}

.material-graph-node > header:active {
  cursor: grabbing;
}

.material-graph-node-output > header {
  background: #263b43;
}

.material-graph-node > header strong {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
}

.material-graph-node > header span {
  min-width: 18px;
  height: 18px;
  display: inline-grid;
  place-items: center;
  color: #9de1d6;
  border: 1px solid rgba(81, 189, 177, 0.45);
  border-radius: 50%;
  font-size: 9px;
  font-weight: 700;
}
''',
              '''.material-graph-node {
  position: absolute;
  min-height: 88px;
}

.material-graph-node .ui-node-card-badge {
  color: #9de1d6;
  border-color: rgba(81, 189, 177, 0.45);
}
''',
          )
          replace_once(
              css,
              '''.material-node-menu {
  position: absolute;
  z-index: 20;
  width: 280px;
  max-height: 420px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid #3a505c;
  border-radius: 6px;
  background: #17232a;
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.52);
}

.material-node-menu > label {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px;
  border-bottom: 1px solid #2d3f48;
}

.material-node-menu input {
  min-width: 0;
  flex: 1;
  height: 27px;
  padding: 0 7px;
  color: #dae6eb;
  border: 1px solid #344a55;
  border-radius: 3px;
  outline: none;
  background: #101a20;
}

.material-node-menu > div {
  overflow: auto;
  padding: 4px;
}

.material-node-menu > div > button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 8px;
  color: #c6d4da;
  border: 0;
  border-radius: 3px;
  background: transparent;
  text-align: left;
}

.material-node-menu > div > button:hover {
  background: #233740;
}

.material-node-menu small {
  color: #708793;
}
''',
              '''.material-node-menu.ui-context-menu {
  z-index: 20;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  padding: 0;
}

.material-node-menu-search {
  display: flex;
  align-items: center;
  gap: var(--arc-space-3);
  padding: var(--arc-space-4);
  border-bottom: var(--arc-border-width) solid var(--arc-color-border-subtle);
  color: var(--arc-color-text-muted);
  background: var(--arc-color-bg-chrome);
}

.material-node-menu-search .ui-text-input {
  height: 27px;
}

.material-node-menu-items {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px;
}

.material-node-menu .ui-context-menu-item strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.material-node-menu small {
  color: var(--arc-color-text-subtle);
}
''',
          )

          index = Path('editor/src/renderer/src/ui/index.ts')
          index_text = index.read_text()
          if "./UiContextMenu" not in index_text:
              index_text += "export { UiContextMenu, UiContextMenuItem } from './UiContextMenu';\n"
          if "./UiNodeCard" not in index_text:
              index_text += "export { UiNodeCard } from './UiNodeCard';\n"
          index.write_text(index_text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-material-graph-ui.yml
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/material/MaterialGraphEditor.tsx \
                  editor/src/renderer/src/material/materialEditor.css \
                  editor/src/renderer/src/ui/index.ts \
                  .github/workflows/apply-material-graph-ui.yml
          git commit -m "refactor(editor): use shared material graph UI primitives"
          git push origin HEAD:${{ github.head_ref }}
