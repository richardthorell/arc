name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18 ninja-build
          npm ci --prefix editor
      - name: Dependency policy
        run: |
          python3 tools/check_dependencies.py
          python3 -m unittest discover -s tools/tests -p "test_*.py"
      - name: C++ formatting
        run: python3 tools/check_format.py --clang-format clang-format-18
      - name: Electron formatting and lint
        working-directory: editor
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Configure compile database
        run: >
          cmake -S . -B out/build/analysis -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=OFF
          -DARC_BUILD_RENDER_VULKAN=OFF
          -DBUILD_TESTING=OFF
      - name: Static analysis
        run: run-clang-tidy-18 -p out/build/analysis -quiet -source-filter='.*/(engine|editor/native|samples|tools)/.*'
