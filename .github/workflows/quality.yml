name: Code Quality

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      run_native:
        description: Run C++ formatting and static analysis
        required: false
        type: boolean
        default: true
      run_editor:
        description: Run Electron formatting, lint, typecheck, and tests
        required: false
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set Up Node 22.12
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name != 'pull_request' || inputs.run_editor }}
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install Native Quality Tools
        if: ${{ github.event_name != 'pull_request' || inputs.run_native || inputs.run_editor }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18 ninja-build
      - name: Install Electron Dependencies
        if: ${{ github.event_name != 'pull_request' || inputs.run_editor }}
        run: npm ci --prefix editor
      - name: Dependency Policy
        run: |
          python3 tools/check_dependencies.py
          python3 -m unittest discover -s tools/tests -p "test_*.py"
      - name: C++ Formatting
        if: ${{ github.event_name != 'pull_request' || inputs.run_native }}
        run: python3 tools/check_format.py --clang-format clang-format-18
      - name: Configure Compile Database
        if: ${{ github.event_name != 'pull_request' || inputs.run_native || inputs.run_editor }}
        run: >
          cmake -S . -B out/build/analysis -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=OFF
          -DARC_BUILD_RENDER_VULKAN=OFF
          -DBUILD_TESTING=OFF
      - name: Generate Static Analysis Sources
        if: ${{ github.event_name != 'pull_request' || inputs.run_native }}
        run: >
          python3 tools/ecs_codegen.py
          --schema engine/scene/schema/components.arccomponents.json
          --cpp-output out/build/analysis/engine/scene/generated/arc/scene/generated_component_metadata.h
      - name: Build Project Test Authority
        if: ${{ github.event_name != 'pull_request' || inputs.run_editor }}
        run: cmake --build out/build/analysis --target arc-project-cli --parallel 2
      - name: Electron Formatting, Lint, Typecheck, and Tests
        if: ${{ github.event_name != 'pull_request' || inputs.run_editor }}
        working-directory: editor
        env:
          ARC_PROJECT_TOOL_PATH: ../out/build/analysis/tools/project_cli/arc-project
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Static Analysis
        if: ${{ github.event_name != 'pull_request' || inputs.run_native }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            run-clang-tidy-18 -p out/build/analysis -quiet '.*/(engine|editor/native|samples|tools)/.*'
            exit 0
          fi

          tidy_regex=$(python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          changed = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "--diff-filter=ACMR",
                      os.environ["BASE_SHA"],
                      os.environ["HEAD_SHA"],
                  ],
                  text=True,
              ).splitlines()
          )

          compile_database = json.loads(
              Path("out/build/analysis/compile_commands.json").read_text(encoding="utf-8")
          )
          native_roots = ("engine/", "editor/native/", "samples/", "tools/")
          selected = set()

          for entry in compile_database:
              source = Path(entry["file"])
              if not source.is_absolute():
                  source = Path(entry["directory"]) / source
              source = source.resolve()

              try:
                  relative = source.relative_to(root).as_posix()
              except ValueError:
                  continue

              if relative in changed and relative.startswith(native_roots):
                  selected.add(source.as_posix())

          for source in sorted(selected):
              print(source, file=os.sys.stderr)

          print("|".join(re.escape(source) for source in sorted(selected)))
          PY
          )

          if [[ -z "$tidy_regex" ]]; then
            echo "No changed native translation units are present in the compile database; skipping clang-tidy."
            exit 0
          fi

          echo "Running clang-tidy on changed PR translation units:"
          run-clang-tidy-18 -p out/build/analysis -quiet "$tidy_regex"
