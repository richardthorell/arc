name: Linux GCC

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      run_shaders:
        description: Validate built-in shaders for this pull request
        required: false
        type: boolean
        default: true
  workflow_dispatch:

concurrency:
  group: gcc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gcc:
    name: Linux GCC 14
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache-gcc
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install GCC 14 and Shader Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build ccache
      - name: Set Up Vulkan SDK 1.4.350.0
        uses: ./.github/actions/setup-vulkan
      - name: Restore Compiler Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: arc-ccache-gcc14-relwithdebinfo-v1-${{ github.sha }}
          restore-keys: |
            arc-ccache-gcc14-relwithdebinfo-v1-
      - name: Reset Compiler Cache Stats
        run: ccache --zero-stats
      - name: Configure
        run: >
          cmake -S . -B out/build/gcc -G Ninja
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=ON
          -DARC_BUILD_RENDER_VULKAN=ON
          -DARC_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build out/build/gcc --parallel
      - name: Validate Shaders
        if: ${{ github.event_name != 'pull_request' || inputs.run_shaders }}
        run: cmake --build out/build/gcc --target arc-shaders-check
      - name: Test
        run: ctest --test-dir out/build/gcc --output-on-failure
      - name: Compiler Cache Stats
        if: always()
        run: ccache --show-stats
