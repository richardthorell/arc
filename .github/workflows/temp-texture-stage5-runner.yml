name: Temporary Texture Stage 5 Runner

on:
  push:
    branches: [feat/texture-curve-editor-stage5]
    paths: [.github/workflows/temp-texture-stage5-runner.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/texture-curve-editor-stage5
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.x
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/temp-texture-stage5.yml').read_text()
          match = re.search(r"cat > /tmp/stage5\.py <<'PY'\n(.*?)\n          PY\n", workflow, re.S)
          if not match:
              raise SystemExit('Could not extract Stage 5 implementation script')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in match.group(1).splitlines())
          helper_lines = [
              'def replace(path, old, new):',
              '    p = Path(path)',
              '    text = p.read_text()',
              '    if old in text:',
              '        p.write_text(text.replace(old, new, 1))',
              '        return',
              "    tokens = [re.escape(token) for token in re.split(r'\\s+', old.strip()) if token]",
              "    pattern = r'\\s+'.join(tokens)",
              '    updated, count = re.subn(pattern, lambda _match: new, text, count=1, flags=re.S)',
              '    if count != 1:',
              "        raise SystemExit(f'pattern missing in {path}: {old[:100]!r}')",
              '    p.write_text(updated)',
          ]
          helper = '\n'.join(helper_lines)
          script, count = re.subn(r"def replace\(path, old, new\):\n.*?(?=\n# Native settings model\.)", lambda _m: helper, script, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace Stage 5 patch helper')
          Path('/tmp/stage5.py').write_text(script)
          PY
          python3 /tmp/stage5.py
          rm .github/workflows/temp-texture-stage5.yml .github/workflows/temp-texture-stage5-runner.yml
      - name: Format
        run: |
          clang-format -i engine/render-tools/inc/arc/render_tools/texture_cooker.h engine/render-tools/src/common/texture_cooker.cpp engine/render-tools/tests/texture_cooker_tests.cpp editor/native/inc/arc/editor/host_protocol_base.h editor/native/src/host_protocol_base.inc editor/native/src/arc_host_base.inc
          cd editor && npx prettier --write src/renderer/src/ui/UiCurveEditor.tsx src/renderer/src/ui/UiCurveEditor.css src/renderer/src/ui/UiCurveEditor.test.tsx src/renderer/src/ui/index.ts src/renderer/src/texture/TextureCurveControls.tsx src/renderer/src/texture/TextureEditor.tsx src/renderer/src/texture/textureEditor.css src/renderer/src/texture/textureSettings.ts src/renderer/src/texture/texturePreviewProcessing.ts src/renderer/src/texture/texturePreviewProcessing.test.ts
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Validate editor
        working-directory: editor
        run: |
          npm run typecheck
          npm test -- --run src/renderer/src/ui/UiCurveEditor.test.tsx src/renderer/src/texture/texturePreviewProcessing.test.ts src/renderer/src/texture/TextureEditor.test.tsx src/renderer/src/texture/TextureStage3Controls.test.tsx
      - name: Configure native
        run: cmake -S . -B out/build/stage5 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DARC_BUILD_ENGINE_TESTS=ON
      - name: Build native
        run: cmake --build out/build/stage5 --target arc_render_tools_tests arc-editor-host -j2
      - name: Test native
        run: ctest --test-dir out/build/stage5 -R arc_render_tools_tests --output-on-failure
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Stage 5 texture curve editor"
          git push origin HEAD:feat/texture-curve-editor-stage5
