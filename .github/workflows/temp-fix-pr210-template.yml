name: Fix PR 210 dependent template call
on:
  push:
    branches: [feat/skeleton-model-workflow]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fix dependent template call
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/native/src/arc_host.cpp')
          text = path.read_text()
          old = 'preview->scene.try_get<scene::transform_component>(preview->camera_entity)'
          new = 'preview->scene.template try_get<scene::transform_component>(preview->camera_entity)'
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18 >/dev/null
          clang-format-18 -i editor/native/src/arc_host.cpp
          git config user.name "Richard Thorell"
          git config user.email "richard.thorell@outlook.com"
          git add editor/native/src/arc_host.cpp
          git commit -m "Fix model preview dependent template call"
          git push
