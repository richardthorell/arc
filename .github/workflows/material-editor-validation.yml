name: Material Editor Validation

on:
  push:
    branches:
      - feature/material-editor-foundation

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[material-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/material-editor-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install editor dependencies
        run: npm ci --prefix editor

      - name: Format Material Editor files
        working-directory: editor
        run: npx prettier --write "src/renderer/src/material/**/*.{ts,tsx,css}"

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- editor/src/renderer/src/material; then
            echo "Material Editor files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/material
          git commit -m "style: format material editor [material-format]"
          git push origin HEAD:feature/material-editor-foundation

      - name: Lint editor
        run: npm run lint --prefix editor

      - name: Typecheck editor
        run: npm run typecheck --prefix editor

      - name: Test editor
        run: npm test --prefix editor
