name: Apply M2.6 diagnostics patch

on:
  push:
    branches:
      - m2/terrain-streaming-stress-acceptance

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'feat: expose virtual geometry streaming pressure diagnostics'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2/terrain-streaming-stress-acceptance
          fetch-depth: 0

      - name: Patch diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'engine/render/inc/arc/render/virtual_geometry.h',
              '    /** Predictive requests held off by the post-eviction cooldown during this frame. */\n    std::uint32_t cooldown_suppressed_requests{};\n    std::uint32_t protected_pages{};\n',
              '    /** Predictive requests held off by the post-eviction cooldown during this frame. */\n    std::uint32_t cooldown_suppressed_requests{};\n    /** Requests observed beyond the per-frame issue limit, kept queued for later frames. */\n    std::uint32_t request_budget_overflow{};\n    /** Requests targeting a page again while it is still inside the post-eviction cooldown window. */\n    std::uint32_t reload_pressure_requests{};\n    std::uint32_t protected_pages{};\n',
          )

          replace_once(
              'engine/render/src/common/virtual_geometry.cpp',
              '    std::uint32_t stale_requests{};\n    std::uint32_t cooldown_suppressed_requests{};\n    std::vector<virtual_geometry_page_eviction> pending_evictions;\n',
              '    std::uint32_t stale_requests{};\n    std::uint32_t cooldown_suppressed_requests{};\n    std::uint32_t request_budget_overflow{};\n    std::uint32_t reload_pressure_requests{};\n    std::vector<virtual_geometry_page_eviction> pending_evictions;\n',
          )

          replace_once(
              'engine/render/src/common/virtual_geometry.cpp',
              '    implementation_->stale_requests = 0;\n    implementation_->cooldown_suppressed_requests = 0;\n}\n',
              '    implementation_->stale_requests = 0;\n    implementation_->cooldown_suppressed_requests = 0;\n    implementation_->request_budget_overflow = 0;\n    implementation_->reload_pressure_requests = 0;\n}\n',
          )

          replace_once(
              'engine/render/src/common/virtual_geometry.cpp',
              '        const bool correctness_demand = request.visible_child || request.shadow_view;\n        if (page->was_evicted && !correctness_demand &&\n            since_eviction <= implementation_->config.reload_cooldown_frames)\n        {\n            ++implementation_->cooldown_suppressed_requests;\n            continue;\n        }\n',
              '        const bool correctness_demand = request.visible_child || request.shadow_view;\n        const bool inside_reload_window =\n            page->was_evicted && since_eviction <= implementation_->config.reload_cooldown_frames;\n        if (inside_reload_window) ++implementation_->reload_pressure_requests;\n        if (inside_reload_window && !correctness_demand)\n        {\n            ++implementation_->cooldown_suppressed_requests;\n            continue;\n        }\n',
          )

          replace_once(
              'engine/render/src/common/virtual_geometry.cpp',
              '    if (result.size() > implementation_->config.maximum_requests_per_frame)\n        result.resize(implementation_->config.maximum_requests_per_frame);\n    return result;\n',
              '    if (result.size() > implementation_->config.maximum_requests_per_frame)\n    {\n        implementation_->request_budget_overflow = std::max(\n            implementation_->request_budget_overflow,\n            static_cast<std::uint32_t>(result.size() - implementation_->config.maximum_requests_per_frame));\n        result.resize(implementation_->config.maximum_requests_per_frame);\n    }\n    return result;\n',
          )

          replace_once(
              'engine/render/src/common/virtual_geometry.cpp',
              '        .stale_requests = implementation_->stale_requests,\n        .cooldown_suppressed_requests = implementation_->cooldown_suppressed_requests};\n',
              '        .stale_requests = implementation_->stale_requests,\n        .cooldown_suppressed_requests = implementation_->cooldown_suppressed_requests,\n        .request_budget_overflow = implementation_->request_budget_overflow,\n        .reload_pressure_requests = implementation_->reload_pressure_requests};\n',
          )

          replace_once(
              'docs/terrain-roadmap.md',
              '**Status: in progress.** M2.1 establishes stable independently replaceable render-artifact regions; later M2 stages make their cooked payloads lazy, asynchronous, predictive, and budgeted.\n',
              '**Status: complete.** M2.1-M2.5 establish stable regionized terrain, lazy cooked payloads, asynchronous page IO/decode, predictive spatial prefetch, and bounded residency. M2.6 closes the milestone with a deterministic 16 km x 16 km stress-world acceptance suite and explicit request/reload-pressure diagnostics.\n',
          )
          PY

          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render docs/terrain-roadmap.md
          git commit -m "feat: expose virtual geometry streaming pressure diagnostics"
          git push origin HEAD:m2/terrain-streaming-stress-acceptance
