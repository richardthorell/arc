name: Temporary Clang Build Fix

on:
  push:
    branches: [fix/clang-format-main-20260830]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/clang-format-main-20260830
      - name: Patch Clang type mismatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/render/src/common/renderer.cpp')
          text = path.read_text()
          old = 'std::max(128ull * mebibyte, adapter_memory / 4u)'
          new = 'std::max(std::uint64_t{128} * mebibyte, adapter_memory / 4u)'
          if old not in text:
              raise SystemExit('expected expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temporary-clang-build-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/render/src/common/renderer.cpp
          git rm --cached .github/workflows/temporary-clang-build-fix.yml
          git commit -m 'Fix Clang texture budget type mismatch'
          git push origin HEAD:fix/clang-format-main-20260830
