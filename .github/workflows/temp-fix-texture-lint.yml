name: Temp Fix Texture Lint
on:
  push:
    branches: [feat/texture-editor-view]
    paths: [.github/workflows/temp-fix-texture-lint.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/texture-editor-view
      - name: Fix exhaustive deps warning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('editor/src/renderer/src/texture/TextureEditor.tsx')
          s = p.read_text()
          old = "  }, [displayHeight, displayWidth, document.id, preview?.path]);"
          new = "  }, [displayHeight, displayWidth, document.id, preview]);"
          if old not in s:
              raise SystemExit('expected dependency list not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/temp-fix-texture-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/texture/TextureEditor.tsx .github/workflows/temp-fix-texture-lint.yml
          git commit -m "Fix texture editor effect dependencies"
          git push
