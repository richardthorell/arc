name: Temporary inspect project assets
on:
  push:
    branches: [diagnostics/editor-host-stall-detail-pr]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print project assets snapshot function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('editor/native/src/arc_host_base.inc').read_text()
          start=s.index('host_project_assets_snapshot arc_host::project_assets_snapshot() const')
          end=s.index('\n}\n', start)+3
          print(s[start:end])
          PY
