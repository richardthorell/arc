name: Temporary Utility Sidebar Validation

on:
  push:
    branches: [feature/resizable-utility-sidebar]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/resizable-utility-sidebar
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - name: Apply sidebar refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'target not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          path = 'editor/src/renderer/src/layout/WorkspaceDock.tsx'
          replace(path,
              "import { useEffect, useRef, useState } from 'react';",
              "import { useEffect, useRef, useState, type CSSProperties, type KeyboardEvent as ReactKeyboardEvent } from 'react';")
          replace(path,
              "  requestedViewportCount?: 1 | 2 | 3 | 4;\n};",
              "  requestedViewportCount?: 1 | 2 | 3 | 4;\n  sidebarExpanded?: boolean;\n};")
          replace(path,
              "const defaultInspectorPanelWidth = 360;",
              "const defaultInspectorPanelWidth = 360;\nconst sidebarWidthStorageKey = 'arc.editor.utility-sidebar.width.v1';\nexport const defaultSidebarWidth = 320;\nexport const minimumSidebarWidth = 240;\nexport const maximumSidebarWidth = 640;\n\nexport const clampSidebarWidth = (value: number) =>\n  Math.min(maximumSidebarWidth, Math.max(minimumSidebarWidth, Math.round(value)));\n\nconst initialSidebarWidth = () => {\n  const saved = Number(window.localStorage.getItem(sidebarWidthStorageKey));\n  return Number.isFinite(saved) && saved > 0 ? clampSidebarWidth(saved) : defaultSidebarWidth;\n};")
          replace(path,
              "  onReady,\n  requestedViewportCount,\n}: WorkspaceDockProps) {\n  const host = useRef<HTMLDivElement | null>(null);",
              "  onReady,\n  requestedViewportCount,\n  sidebarExpanded = false,\n}: WorkspaceDockProps) {\n  const shell = useRef<HTMLDivElement | null>(null);\n  const host = useRef<HTMLDivElement | null>(null);")
          replace(path,
              "  const [activeSidebarPanel, setActiveSidebarPanel] = useState<SidebarPanelId>(initialSidebarPanel);\n  renderPanelRef.current = renderPanel;",
              "  const [activeSidebarPanel, setActiveSidebarPanel] = useState<SidebarPanelId>(initialSidebarPanel);\n  const [sidebarWidth, setSidebarWidth] = useState(initialSidebarWidth);\n  const sidebarWidthRef = useRef(sidebarWidth);\n  const [resizingSidebar, setResizingSidebar] = useState(false);\n  renderPanelRef.current = renderPanel;\n\n  const updateSidebarWidth = (value: number) => {\n    const next = clampSidebarWidth(value);\n    sidebarWidthRef.current = next;\n    setSidebarWidth(next);\n  };\n\n  useEffect(() => {\n    if (!resizingSidebar) return;\n\n    const move = (event: PointerEvent) => {\n      const bounds = shell.current?.getBoundingClientRect();\n      if (bounds) updateSidebarWidth(event.clientX - bounds.left);\n    };\n    const stop = () => {\n      setResizingSidebar(false);\n      window.localStorage.setItem(sidebarWidthStorageKey, String(sidebarWidthRef.current));\n    };\n\n    window.addEventListener('pointermove', move);\n    window.addEventListener('pointerup', stop, { once: true });\n    window.addEventListener('pointercancel', stop, { once: true });\n    return () => {\n      window.removeEventListener('pointermove', move);\n      window.removeEventListener('pointerup', stop);\n      window.removeEventListener('pointercancel', stop);\n    };\n  }, [resizingSidebar]);\n\n  const resizeSidebarWithKeyboard = (event: ReactKeyboardEvent<HTMLDivElement>) => {\n    let next = sidebarWidthRef.current;\n    if (event.key === 'ArrowLeft') next -= 16;\n    else if (event.key === 'ArrowRight') next += 16;\n    else if (event.key === 'Home') next = minimumSidebarWidth;\n    else if (event.key === 'End') next = maximumSidebarWidth;\n    else return;\n    event.preventDefault();\n    updateSidebarWidth(next);\n    window.localStorage.setItem(sidebarWidthStorageKey, String(clampSidebarWidth(next)));\n  };")
          replace(path,
              "  return (\n    <div className={`workspace-dock-shell workspace-dock-shell-editor-${activeEditorKind}`}>\n      <aside\n        aria-label={`${panelRegistry[activeSidebarPanel].title} sidebar`}\n        className={`primary-sidebar primary-sidebar-${activeSidebarPanel}`}\n      >\n        {renderPanel(activeSidebarPanel)}\n      </aside>\n      <div className=\"workspace-dock\" ref={host} />\n    </div>\n  );",
              "  return (\n    <div\n      className={`workspace-dock-shell workspace-dock-shell-editor-${activeEditorKind}`}\n      ref={shell}\n      style={{ '--arc-utility-sidebar-width': `${sidebarWidth}px` } as CSSProperties}\n    >\n      <aside\n        aria-label={`${panelRegistry[activeSidebarPanel].title} sidebar`}\n        className={`primary-sidebar primary-sidebar-${activeSidebarPanel}`}\n      >\n        {renderPanel(activeSidebarPanel)}\n        {sidebarExpanded && (\n          <div\n            aria-label=\"Resize utility sidebar\"\n            aria-orientation=\"vertical\"\n            aria-valuemax={maximumSidebarWidth}\n            aria-valuemin={minimumSidebarWidth}\n            aria-valuenow={sidebarWidth}\n            className={`primary-sidebar-resize-handle${resizingSidebar ? ' is-resizing' : ''}`}\n            onKeyDown={resizeSidebarWithKeyboard}\n            onPointerDown={(event) => {\n              event.preventDefault();\n              event.currentTarget.setPointerCapture?.(event.pointerId);\n              setResizingSidebar(true);\n            }}\n            role=\"separator\"\n            tabIndex={0}\n          />\n        )}\n      </aside>\n      <div className=\"workspace-dock\" ref={host} />\n    </div>\n  );")

          path = 'editor/src/renderer/src/layout/WorkspaceDock.css'
          replace(path,
              "  grid-template-columns: var(--arc-left-panel-width) minmax(0, 1fr);",
              "  grid-template-columns: var(--arc-utility-sidebar-width, var(--arc-left-panel-width)) minmax(0, 1fr);")
          replace(path,
              ".primary-sidebar {\n  min-width: 0;",
              ".primary-sidebar {\n  position: relative;\n  min-width: 0;")
          replace(path,
              ".workbench-shell .workbench-body-dockview.activity-expanded .primary-sidebar {\n  border-right: var(--arc-border-width) solid var(--arc-color-border-subtle);\n}\n",
              ".workbench-shell .workbench-body-dockview.activity-expanded .primary-sidebar {\n  border-right: var(--arc-border-width) solid var(--arc-color-border-subtle);\n}\n\n.primary-sidebar-resize-handle {\n  position: absolute;\n  z-index: 8;\n  top: 0;\n  right: -3px;\n  width: 6px;\n  height: 100%;\n  cursor: col-resize;\n  touch-action: none;\n}\n\n.primary-sidebar-resize-handle::after {\n  content: '';\n  position: absolute;\n  top: 0;\n  bottom: 0;\n  left: 2px;\n  width: 2px;\n  background: transparent;\n  transition: background 100ms ease;\n}\n\n.primary-sidebar-resize-handle:hover::after,\n.primary-sidebar-resize-handle:focus-visible::after,\n.primary-sidebar-resize-handle.is-resizing::after {\n  background: var(--arc-color-accent);\n}\n\n.primary-sidebar-resize-handle:focus-visible {\n  outline: none;\n}\n")

          path = 'editor/src/renderer/src/app/Workbench.tsx'
          replace(path,
              "            requestedViewportCount={viewportCount}\n          />",
              "            requestedViewportCount={viewportCount}\n            sidebarExpanded={layout.activityExpanded}\n          />")

          for path in [
              'editor/src/renderer/src/ai/AiGatewayPanel.tsx',
              'editor/src/renderer/src/search/SearchPanel.tsx',
              'editor/src/renderer/src/versionControl/VersionControlPanel.tsx',
          ]:
              p = Path(path)
              text = p.read_text()
              if path.endswith('AiGatewayPanel.tsx'):
                  text = text.replace("import { UiButton, UiIconButton } from '../ui';", "import { UiButton, UiIconButton, UiSidebarPanel } from '../ui';")
                  text = text.replace('<section className="ai-assistant-panel" aria-label="ARC Assistant">', '<UiSidebarPanel className="ai-assistant-panel" aria-label="ARC Assistant">', 1)
                  marker = "    </section>\n  );\n}\n\nexport function AiGatewayApprovalPrompt"
                  replacement = "    </UiSidebarPanel>\n  );\n}\n\nexport function AiGatewayApprovalPrompt"
                  if marker in text: text = text.replace(marker, replacement, 1)
              elif path.endswith('SearchPanel.tsx'):
                  text = text.replace("import type { AssetItem, SceneEntity } from '../services/editorHostTypes';", "import type { AssetItem, SceneEntity } from '../services/editorHostTypes';\nimport { UiSidebarPanel } from '../ui';")
                  text = text.replace('<section className="production-tool-panel search-production-panel">', '<UiSidebarPanel className="production-tool-panel search-production-panel">', 1)
                  idx = text.rfind('    </section>\n  );\n}')
                  if idx != -1: text = text[:idx] + text[idx:].replace('    </section>', '    </UiSidebarPanel>', 1)
              else:
                  text = text.replace("import { UiButton, UiIconButton } from '../ui';", "import { UiButton, UiIconButton, UiSidebarPanel } from '../ui';")
                  text = text.replace('<section className="production-tool-panel vcs-panel">', '<UiSidebarPanel className="production-tool-panel vcs-panel">', 1)
                  idx = text.rfind('    </section>\n  );\n}')
                  if idx != -1: text = text[:idx] + text[idx:].replace('    </section>', '    </UiSidebarPanel>', 1)
              p.write_text(text)
          PY
      - name: Validate editor changes
        working-directory: editor
        run: |
          npx prettier --write src/renderer/src/ui/UiSidebarPanel.tsx src/renderer/src/ui/UiSidebarPanel.css src/renderer/src/ui/index.ts src/renderer/src/layout/WorkspaceDock.tsx src/renderer/src/layout/WorkspaceDock.css src/renderer/src/app/Workbench.tsx src/renderer/src/ai/AiGatewayPanel.tsx src/renderer/src/search/SearchPanel.tsx src/renderer/src/versionControl/VersionControlPanel.tsx
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run src/renderer/src/ai/AiGatewayPanel.test.tsx src/renderer/src/uiLab/UiLabPanels.test.tsx --pool=threads --maxWorkers=1
      - name: Commit implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/ui editor/src/renderer/src/layout/WorkspaceDock.tsx editor/src/renderer/src/layout/WorkspaceDock.css editor/src/renderer/src/app/Workbench.tsx editor/src/renderer/src/ai/AiGatewayPanel.tsx editor/src/renderer/src/search/SearchPanel.tsx editor/src/renderer/src/versionControl/VersionControlPanel.tsx
          git commit -m "Add resizable utility sidebar shell"
          git push origin HEAD:feature/resizable-utility-sidebar
