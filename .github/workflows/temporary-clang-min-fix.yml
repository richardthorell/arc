name: Temporary Clang Min Fix

on:
  push:
    branches: [fix/clang-format-main-20260830]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/clang-format-main-20260830

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Fix budget types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/render/src/common/renderer.cpp')
          s = p.read_text()
          if 'const auto texture_quality_budget =' not in s:
              raise SystemExit('texture_quality_budget declaration not found')
          if 'auto texture_gpu_budget =' not in s:
              raise SystemExit('texture_gpu_budget declaration not found')
          s = s.replace('const auto texture_quality_budget =', 'const std::uint64_t texture_quality_budget =', 1)
          s = s.replace('auto texture_gpu_budget =', 'std::uint64_t texture_gpu_budget =', 1)
          p.write_text(s)
          PY
          clang-format-18 -i engine/render/src/common/renderer.cpp
          rm .github/workflows/temporary-clang-min-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/src/common/renderer.cpp .github/workflows/temporary-clang-min-fix.yml
          git commit -m "Fix Clang texture budget type mismatch"
          git push origin HEAD:fix/clang-format-main-20260830
