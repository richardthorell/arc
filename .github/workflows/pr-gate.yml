name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    outputs:
      clang: ${{ steps.classify.outputs.clang }}
      gcc: ${{ steps.classify.outputs.gcc }}
      msvc: ${{ steps.classify.outputs.msvc }}
      coverage: ${{ steps.classify.outputs.coverage }}
      quality_native: ${{ steps.classify.outputs.quality_native }}
      quality_editor: ${{ steps.classify.outputs.quality_editor }}
      shaders: ${{ steps.classify.outputs.shaders }}
      cooker: ${{ steps.classify.outputs.cooker }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify Changed Paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | tee /tmp/arc-changed-paths.txt
          python3 tools/classify_ci_changes.py --github-output "$GITHUB_OUTPUT" < /tmp/arc-changed-paths.txt
      - name: Summarize Selection
        shell: bash
        run: |
          {
            echo '### PR CI selection'
            echo
            echo '| Check | Run |'
            echo '| --- | --- |'
            echo '| Clang | ${{ steps.classify.outputs.clang }} |'
            echo '| GCC | ${{ steps.classify.outputs.gcc }} |'
            echo '| MSVC | ${{ steps.classify.outputs.msvc }} |'
            echo '| Coverage | ${{ steps.classify.outputs.coverage }} |'
            echo '| Native quality | ${{ steps.classify.outputs.quality_native }} |'
            echo '| Editor quality | ${{ steps.classify.outputs.quality_editor }} |'
            echo '| Shader validation | ${{ steps.classify.outputs.shaders }} |'
            echo '| Cooker smoke | ${{ steps.classify.outputs.cooker }} |'
            echo '| Docs only | ${{ steps.classify.outputs.docs_only }} |'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality
    needs: changes
    if: ${{ needs.changes.outputs.quality_native == 'true' || needs.changes.outputs.quality_editor == 'true' }}
    uses: ./.github/workflows/quality.yml
    with:
      run_native: ${{ needs.changes.outputs.quality_native == 'true' }}
      run_editor: ${{ needs.changes.outputs.quality_editor == 'true' }}

  clang:
    name: Clang
    needs: changes
    if: ${{ needs.changes.outputs.clang == 'true' }}
    uses: ./.github/workflows/build-clang.yml
    with:
      run_shaders: ${{ needs.changes.outputs.shaders == 'true' }}

  gcc:
    name: GCC
    needs: changes
    if: ${{ needs.changes.outputs.gcc == 'true' }}
    uses: ./.github/workflows/build-gcc.yml
    with:
      run_shaders: ${{ needs.changes.outputs.shaders == 'true' }}

  msvc:
    name: MSVC
    needs: changes
    if: ${{ needs.changes.outputs.msvc == 'true' }}
    uses: ./.github/workflows/build-msvc.yml
    with:
      run_shaders: ${{ needs.changes.outputs.shaders == 'true' }}
      run_cooker: ${{ needs.changes.outputs.cooker == 'true' }}

  coverage:
    name: Coverage
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' }}
    uses: ./.github/workflows/coverage.yml

  pr-gate:
    name: PR Gate
    if: ${{ always() }}
    needs: [changes, quality, clang, gcc, msvc, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Selected Checks
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          CLANG: ${{ needs.clang.result }}
          GCC: ${{ needs.gcc.result }}
          MSVC: ${{ needs.msvc.result }}
          COVERAGE: ${{ needs.coverage.result }}
        shell: bash
        run: |
          if [[ "$CHANGES" != success ]]; then
            echo "Change classification failed: $CHANGES"
            exit 1
          fi

          for entry in \
            "Quality:$QUALITY" \
            "Clang:$CLANG" \
            "GCC:$GCC" \
            "MSVC:$MSVC" \
            "Coverage:$COVERAGE"; do
            name=${entry%%:*}
            result=${entry#*:}
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "$name failed: $result"
                exit 1
                ;;
            esac
          done
