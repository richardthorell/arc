name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-shader-include-fix:
    name: Apply Shader Include Fix
    if: ${{ github.event.pull_request.head.ref == 'fix/clang-format-main' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          metadata_path = Path('engine/assets/src/common/asset_metadata.cpp')
          metadata = metadata_path.read_text()
          old = '''    if (extension == ".slang" || extension == ".glsl" || extension == ".vert" || extension == ".frag" ||
              extension == ".comp" || extension == ".hlsl" || extension == ".inc")
              return std::pair{asset_types::shader, importer_ids::shader};'''
          new = '''    const bool shader_include =
              extension == ".inc" ||
              std::any_of(path.begin(), path.end(),
                          [](const auto& component) { return component == std::filesystem::path("include"); });
          if (shader_include &&
              (extension == ".slang" || extension == ".glsl" || extension == ".hlsl" || extension == ".inc"))
              return std::pair{asset_types::binary_blob, importer_ids::binary};
          if (extension == ".slang" || extension == ".glsl" || extension == ".vert" || extension == ".frag" ||
              extension == ".comp" || extension == ".hlsl")
              return std::pair{asset_types::shader, importer_ids::shader};'''
          if old not in metadata:
              raise SystemExit('asset_metadata.cpp classification block did not match')
          metadata_path.write_text(metadata.replace(old, new, 1))

          manager_path = Path('engine/assets/src/common/asset_manager.cpp')
          manager = manager_path.read_text()
          marker = '''std::string path_key(const std::filesystem::path& value)
          {
              return path_key(normalize_asset_path(value));
          }
          '''
          helper = marker + '''
          bool is_shader_include_path(const std::filesystem::path& path)
          {
              const auto extension = path.extension().string();
              if (extension == ".inc") return true;
              if (extension != ".slang" && extension != ".glsl" && extension != ".hlsl") return false;
              return std::any_of(path.begin(), path.end(),
                                 [](const auto& component) { return component == std::filesystem::path("include"); });
          }
          '''
          if marker not in manager:
              raise SystemExit('asset_manager.cpp helper insertion point did not match')
          manager = manager.replace(marker, helper, 1)
          old_dependency = '''        append_dependency(output,
                                  dependency_from_path(context, std::string_view(source).substr(quote + 1, end - quote - 1),
                                                       asset_types::shader));'''
          new_dependency = '''        append_dependency(output,
                                  dependency_from_path(context, std::string_view(source).substr(quote + 1, end - quote - 1),
                                                       asset_types::binary_blob));'''
          if old_dependency not in manager:
              raise SystemExit('shader dependency type block did not match')
          manager = manager.replace(old_dependency, new_dependency, 1)
          old_import = '''        else if (context.metadata.type == asset_types::shader)
              collect_shader_dependencies(context, result.dependencies);'''
          new_import = '''        else if (context.metadata.type == asset_types::shader || is_shader_include_path(context.source_path))
              collect_shader_dependencies(context, result.dependencies);'''
          if old_import not in manager:
              raise SystemExit('shader dependency collection block did not match')
          manager_path.write_text(manager.replace(old_import, new_import, 1))

          for sidecar in Path('assets/shaders/include').glob('*.arcmeta'):
              doc = json.loads(sidecar.read_text())
              doc['type'] = 'a7ca55e7-0000-0001-0000-000000000009'
              doc['importer'] = 'a7ca55e7-0000-0002-0000-000000000009'
              sidecar.write_text(json.dumps(doc, indent=2) + '\n')

          tests_path = Path('engine/assets/tests/assets_tests.cpp')
          tests = tests_path.read_text()
          test_name = 'shader include paths classify as source dependencies'
          if test_name not in tests:
              tests += r'''

          TEST_CASE("shader include paths classify as source dependencies")
          {
              const auto include = classify_asset_path("assets/shaders/include/arc_math.glsl");
              REQUIRE(include.has_value());
              CHECK(include->first == asset_types::binary_blob);
              CHECK(include->second == importer_ids::binary);

              const auto inc = classify_asset_path("assets/shaders/common.inc");
              REQUIRE(inc.has_value());
              CHECK(inc->first == asset_types::binary_blob);
              CHECK(inc->second == importer_ids::binary);

              const auto entry = classify_asset_path("assets/shaders/default_phong.frag");
              REQUIRE(entry.has_value());
              CHECK(entry->first == asset_types::shader);
              CHECK(entry->second == importer_ids::shader);
          }
          '''
              tests_path.write_text(tests)
          PY

          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 -i \
            engine/assets/src/common/asset_metadata.cpp \
            engine/assets/src/common/asset_manager.cpp \
            engine/assets/tests/assets_tests.cpp
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engine/assets/src/common/asset_metadata.cpp \
                  engine/assets/src/common/asset_manager.cpp \
                  engine/assets/tests/assets_tests.cpp \
                  assets/shaders/include/*.arcmeta
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: treat shader includes as source dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    outputs:
      clang: ${{ steps.classify.outputs.clang }}
      gcc: ${{ steps.classify.outputs.gcc }}
      msvc: ${{ steps.classify.outputs.msvc }}
      coverage: ${{ steps.classify.outputs.coverage }}
      quality_native: ${{ steps.classify.outputs.quality_native }}
      quality_editor: ${{ steps.classify.outputs.quality_editor }}
      shaders: ${{ steps.classify.outputs.shaders }}
      cooker: ${{ steps.classify.outputs.cooker }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify Changed Paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | tee /tmp/arc-changed-paths.txt
          python3 tools/classify_ci_changes.py --github-output "$GITHUB_OUTPUT" < /tmp/arc-changed-paths.txt
      - name: Summarize Selection
        shell: bash
        run: |
          {
            echo '### PR CI selection'
            echo
            echo '| Check | Run |'
            echo '| --- | --- |'
            echo '| Clang | ${{ steps.classify.outputs.clang }} |'
            echo '| GCC | ${{ steps.classify.outputs.gcc }} |'
            echo '| MSVC | ${{ steps.classify.outputs.msvc }} |'
            echo '| Coverage | ${{ steps.classify.outputs.coverage }} |'
            echo '| Native quality | ${{ steps.classify.outputs.quality_native }} |'
            echo '| Editor quality | ${{ steps.classify.outputs.quality_editor }} |'
            echo '| Shader validation | ${{ steps.classify.outputs.shaders }} |'
            echo '| Cooker smoke | ${{ steps.classify.outputs.cooker }} |'
            echo '| Docs only | ${{ steps.classify.outputs.docs_only }} |'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality
    needs: changes
    if: ${{ needs.changes.outputs.quality_native == 'true' || needs.changes.outputs.quality_editor == 'true' }}
    uses: ./.github/workflows/quality.yml
    with:
      run_native: ${{ needs.changes.outputs.quality_native == 'true' }}
      run_editor: ${{ needs.changes.outputs.quality_editor == 'true' }}

  clang:
    name: Clang
    needs: changes
    if: ${{ needs.changes.outputs.clang == 'true' }}
    uses: ./.github/workflows/build-clang.yml
    with:
      run_shaders: ${{ needs.changes.outputs.shaders == 'true' }}

  gcc:
    name: GCC
    needs: changes
    if: ${{ needs.changes.outputs.gcc == 'true' }}
    uses: ./.github/workflows/build-gcc.yml
    with:
      run_shaders: ${{ needs.changes.outputs.shaders == 'true' }}

  msvc:
    name: MSVC
    needs: changes
    if: ${{ needs.changes.outputs.msvc == 'true' }}
    uses: ./.github/workflows/build-msvc.yml
    with:
      run_shaders: ${{ needs.changes.outputs.shaders == 'true' }}
      run_cooker: ${{ needs.changes.outputs.cooker == 'true' }}

  coverage:
    name: Coverage
    needs: changes
    if: ${{ needs.changes.outputs.coverage == 'true' }}
    uses: ./.github/workflows/coverage.yml

  pr-gate:
    name: PR Gate
    if: ${{ always() }}
    needs: [changes, quality, clang, gcc, msvc, coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Selected Checks
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          CLANG: ${{ needs.clang.result }}
          GCC: ${{ needs.gcc.result }}
          MSVC: ${{ needs.msvc.result }}
          COVERAGE: ${{ needs.coverage.result }}
        shell: bash
        run: |
          if [[ "$CHANGES" != success ]]; then
            echo "Change classification failed: $CHANGES"
            exit 1
          fi

          for entry in \
            "Quality:$QUALITY" \
            "Clang:$CLANG" \
            "GCC:$GCC" \
            "MSVC:$MSVC" \
            "Coverage:$COVERAGE"; do
            name=${entry%%:*}
            result=${entry#*:}
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "$name failed: $result"
                exit 1
                ;;
            esac
          done
