name: Temporary Quick Start Default Scene

on:
  push:
    branches:
      - fix/default-white-infinite-grid
    paths:
      - .github/workflows/temp-quick-start-default-scene.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/default-white-infinite-grid
          fetch-depth: 0
      - name: Apply changes
        run: python3 .github/scripts/temp_quick_start_default_scene.py
      - name: Commit
        run: |
          rm .github/workflows/temp-quick-start-default-scene.yml
          rm .github/scripts/temp_quick_start_default_scene.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use native default scene for quick start"
          git push origin HEAD:fix/default-white-infinite-grid
