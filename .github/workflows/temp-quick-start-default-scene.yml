name: Temporary Quick Start Default Scene

on:
  push:
    branches:
      - fix/default-white-infinite-grid
    paths:
      - .github/workflows/temp-quick-start-default-scene.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/default-white-infinite-grid
          fetch-depth: 0

      - name: Apply quick-start default scene changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          service_path = Path('editor/src/main/projectService.ts')
          service = service_path.read_text()
          marker = '  async openOrCreateQuickStartProject(destination: string): Promise<ArcProjectOperationResult> {'
          start = service.find(marker)
          if start < 0:
              raise SystemExit('quick-start method not found')
          next_method = service.find('\n  async ', start + len(marker))
          if next_method < 0:
              next_method = service.find('\n  create(', start + len(marker))
          if next_method < 0:
              raise SystemExit('next ProjectService method not found')
          method = service[start:next_method]
          open_markers = ['      return await this.open(descriptorPath);', '      return this.open(descriptorPath);']
          open_marker = next((candidate for candidate in open_markers if candidate in method), None)
          if open_marker is None:
              raise SystemExit('quick-start open return not found')
          migration = '''      const legacyScenePath = 'Content/Scenes/Startup.arcscene';
          if (descriptorPath && fs.existsSync(descriptorPath)) {
            const rawDescriptor = JSON.parse(fs.readFileSync(descriptorPath, 'utf8')) as Record<string, unknown>;
            const defaultScene = objectValue(rawDescriptor.defaultScene);
            const startupScenes = Array.isArray(rawDescriptor.startupScenes) ? rawDescriptor.startupScenes : [];
            const normalizedPath = (value: unknown): string =>
              typeof value === 'string' ? value.replaceAll('\\\\', '/') : '';
            const referencesLegacyScene =
              normalizedPath(defaultScene.pathHint) === legacyScenePath ||
              startupScenes.some((entry) =>
                normalizedPath(typeof entry === 'string' ? entry : objectValue(entry).pathHint) === legacyScenePath,
              );
            if (referencesLegacyScene) {
              rawDescriptor.defaultScene = null;
              rawDescriptor.startupScenes = [];
              writeJsonAtomic(descriptorPath, rawDescriptor);
              fs.rmSync(path.join(projectRoot, legacyScenePath), { force: true });
              fs.rmSync(path.join(projectRoot, `${legacyScenePath}.arcmeta`), { force: true });
            }
          }

'''
          if 'const legacyScenePath' not in method:
              method = method.replace(open_marker, migration + open_marker, 1)
          service = service[:start] + method + service[next_method:]
          service_path.write_text(service)

          descriptor_path = Path('templates/blank-3d/__PROJECT__.arcproject')
          descriptor = descriptor_path.read_text()
          old = '  "defaultScene": {"guid":"{{SCENE_ASSET_GUID}}","expectedType":"scene","pathHint":"Content/Scenes/Startup.arcscene"},\n  "startupScenes": [{"guid":"{{SCENE_ASSET_GUID}}","expectedType":"scene","pathHint":"Content/Scenes/Startup.arcscene"}],'
          new = '  "defaultScene": null,\n  "startupScenes": [],'
          if old not in descriptor:
              raise SystemExit('blank-3d startup scene descriptor marker not found')
          descriptor_path.write_text(descriptor.replace(old, new, 1))

          for candidate in [
              Path('templates/blank-3d/Content/Scenes/Startup.arcscene'),
              Path('templates/blank-3d/Content/Scenes/Startup.arcscene.arcmeta'),
          ]:
              candidate.unlink()

          test_path = Path('editor/src/main/projectService.test.ts')
          test = test_path.read_text()
          old_test = '''  it('creates and reuses a Blank 3D quick-start project', async () => {
              const root = temporary();
              const commands: string[] = [];
              const service = new ProjectService({
                ...nativeProjectAuthority,
                userDataPath: path.join(root, 'user'),
                currentEngineVersion: '1.2.3',
                currentEditorPath: 'arc-editor',
                host: {
                  connected: true,
                  error: '',
                  command: async (type) => {
                    commands.push(type);
                    return { succeeded: true };
                  },
                },
              });
              const destination = path.join(root, 'quick-start');
          
              const first = await service.openOrCreateQuickStartProject(destination);
              expect(first.succeeded, first.error).toBe(true);
              expect(first.project?.descriptor.name).toBe('ARC Editor Development');
              expect(first.project?.descriptor.defaultScene?.pathHint).toBe('Content/Scenes/Startup.arcscene');
          
              await service.close();
              const second = await service.openOrCreateQuickStartProject(destination);
              expect(second.succeeded, second.error).toBe(true);
              expect(second.project?.descriptor.guid).toBe(first.project?.descriptor.guid);
              expect(commands.filter((type) => type === 'project.open')).toHaveLength(2);
            });'''
          new_test = '''  it('creates, migrates, and reuses a Blank 3D quick-start project with the native default scene', async () => {
              const root = temporary();
              const commands: Array<{ type: string; payload: Record<string, unknown> }> = [];
              const service = new ProjectService({
                ...nativeProjectAuthority,
                userDataPath: path.join(root, 'user'),
                currentEngineVersion: '1.2.3',
                currentEditorPath: 'arc-editor',
                host: {
                  connected: true,
                  error: '',
                  command: async (type, payload = {}) => {
                    commands.push({ type, payload });
                    return { succeeded: true };
                  },
                },
              });
              const destination = path.join(root, 'quick-start');
          
              const first = await service.openOrCreateQuickStartProject(destination);
              expect(first.succeeded, first.error).toBe(true);
              expect(first.project?.descriptor.name).toBe('ARC Editor Development');
              expect(first.project?.descriptor.defaultScene).toBeNull();
              expect(first.project?.descriptor.startupScenes).toEqual([]);
              expect(commands[0]).toMatchObject({ type: 'project.open', payload: { defaultScene: '' } });
              expect(fs.existsSync(path.join(destination, 'Content/Scenes/Startup.arcscene'))).toBe(false);
          
              await service.close();
              const descriptorPath = first.project!.descriptorPath;
              const legacyDescriptor = JSON.parse(fs.readFileSync(descriptorPath, 'utf8')) as Record<string, unknown>;
              const legacyReference = {
                guid: '00000000-0000-4000-8000-000000000099',
                expectedType: 'scene',
                pathHint: 'Content/Scenes/Startup.arcscene',
              };
              legacyDescriptor.defaultScene = legacyReference;
              legacyDescriptor.startupScenes = [legacyReference];
              fs.writeFileSync(descriptorPath, `${JSON.stringify(legacyDescriptor, null, 2)}\\n`, 'utf8');
              fs.mkdirSync(path.join(destination, 'Content/Scenes'), { recursive: true });
              fs.writeFileSync(path.join(destination, 'Content/Scenes/Startup.arcscene'), '{}', 'utf8');
              fs.writeFileSync(path.join(destination, 'Content/Scenes/Startup.arcscene.arcmeta'), '{}', 'utf8');
          
              const second = await service.openOrCreateQuickStartProject(destination);
              expect(second.succeeded, second.error).toBe(true);
              expect(second.project?.descriptor.guid).toBe(first.project?.descriptor.guid);
              expect(second.project?.descriptor.defaultScene).toBeNull();
              expect(second.project?.descriptor.startupScenes).toEqual([]);
              expect(fs.existsSync(path.join(destination, 'Content/Scenes/Startup.arcscene'))).toBe(false);
              expect(fs.existsSync(path.join(destination, 'Content/Scenes/Startup.arcscene.arcmeta'))).toBe(false);
              expect(commands.filter((entry) => entry.type === 'project.open')).toHaveLength(2);
            });'''
          if old_test not in test:
              raise SystemExit('quick-start test marker not found')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci --ignore-scripts

      - name: Configure project tool
        run: >-
          cmake -S . -B out/build/quick-start-test -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_BUILD_RENDER_VULKAN=OFF
          -DARC_BUILD_EDITOR=OFF
          -DARC_BUILD_ENGINE_TESTS=OFF

      - name: Build project tool
        run: cmake --build out/build/quick-start-test --target arc-project -j2

      - name: Validate quick-start project service
        working-directory: editor
        env:
          ARC_PROJECT_TOOL_PATH: ${{ github.workspace }}/out/build/quick-start-test/tools/project_cli/arc-project
        run: |
          npx prettier --write src/main/projectService.ts src/main/projectService.test.ts
          npm run typecheck
          npx vitest run src/main/projectService.test.ts --pool=threads --maxWorkers=1

      - name: Commit implementation
        run: |
          rm .github/workflows/temp-quick-start-default-scene.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use native default scene for quick start"
          git push origin HEAD:fix/default-white-infinite-grid
