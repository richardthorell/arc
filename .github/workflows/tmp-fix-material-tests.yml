name: Temporary Fix Material Tests

on:
  push:
    branches:
      - fix/clang-format-main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clang-format-main
          fetch-depth: 0
      - name: Update stale material schema tests and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('editor/native/tests/editor_tests.cpp')
          text = path.read_text()

          old_assert = 'REQUIRE(loaded.version == 3);'
          count = text.count(old_assert)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale version assertions, found {count}')

          text = text.replace(
              'TEST_CASE("terrain material version two migrates to version three with fixed layer descriptors")',
              'TEST_CASE("terrain material version two migrates to current version with fixed layer descriptors")',
          )
          text = text.replace(
              'TEST_CASE("material version three round trips advanced PBR lobes and validates ranges")',
              'TEST_CASE("current material version round trips advanced PBR lobes and validates ranges")',
          )
          text = text.replace(
              old_assert,
              'REQUIRE(loaded.version == arc::editor::make_default_material_asset().version);',
          )
          path.write_text(text)
          PY

          git rm .github/workflows/tmp-fix-material-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add editor/native/tests/editor_tests.cpp
          git commit -m "Fix material schema version tests"
          git push origin HEAD:fix/clang-format-main
