name: Temp Migrate ECS Panel Sections

on:
  push:
    branches: [feat/texture-editor-view]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/texture-editor-view
          fetch-depth: 0
      - name: Migrate schema component cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('editor/src/renderer/src/inspector/SchemaComponents.tsx')
          text = p.read_text()
          text = text.replace(
              "import { ChevronDown, ChevronRight, MoreVertical } from 'lucide-react';",
              "import { MoreVertical } from 'lucide-react';",
          )
          text = text.replace(
              "import { UiButton, UiContextMenu, UiContextMenuItem, UiIconButton, UiSelect, UiTextInput } from '../ui';",
              "import { UiButton, UiContextMenu, UiContextMenuItem, UiIconButton, UiPanelSection, UiSelect, UiTextInput } from '../ui';",
          )

          start_marker = "  return (\n    <section ref={componentRef} className={`inspector-component-card ${collapsed ? 'is-collapsed' : ''}`}>"
          start = text.index(start_marker)
          content_marker = "      {!collapsed && (\n        <div className=\"inspector-component-content\">"
          content_pos = text.index(content_marker, start)
          content_start = content_pos + len(content_marker)
          end_marker = "        </div>\n      )}\n    </section>\n  );"
          end = text.index(end_marker, content_start)
          inner = text[content_start:end]

          replacement = '''  return (\n    <UiPanelSection\n      actions={\n        <>\n          {headerAccessory && <div className="inspector-component-header-accessory">{headerAccessory}</div>}\n          {onAction && (\n            <UiIconButton\n              aria-expanded={actionsOpen}\n              aria-haspopup="menu"\n              label={schema.title + ' component actions'}\n              onClick={() => setActionsOpen((value) => !value)}\n              type="button"\n            >\n              <MoreVertical size={15} />\n            </UiIconButton>\n          )}\n          {onAction && actionsOpen && (\n            <UiContextMenu\n              aria-label={schema.title + ' component actions menu'}\n              style={{ left: 'auto', right: '4px', top: 'calc(100% + 2px)', maxWidth: 'calc(100% - 8px)' }}\n            >\n              <UiContextMenuItem onClick={() => runComponentAction('copy')} type="button">\n                Copy Component\n              </UiContextMenuItem>\n              <UiContextMenuItem onClick={() => runComponentAction('paste')} type="button">\n                Paste Component Values\n              </UiContextMenuItem>\n              <UiContextMenuItem onClick={() => runComponentAction('reset')} type="button">\n                Reset Component\n              </UiContextMenuItem>\n              {schema.id !== 'transform' && schema.id !== 'prefab' && (\n                <UiContextMenuItem\n                  onClick={() => runComponentAction('remove')}\n                  style={{ color: 'var(--arc-color-danger)' }}\n                  type="button"\n                >\n                  Remove Component\n                </UiContextMenuItem>\n              )}\n            </UiContextMenu>\n          )}\n        </>\n      }\n      className="inspector-schema-component"\n      collapsed={collapsed}\n      contentClassName="inspector-component-content"\n      onToggle={onToggle}\n      ref={componentRef}\n      title={schema.title}\n    >\n'''
          replacement += inner
          replacement += "\n    </UiPanelSection>\n  );"
          text = text[:start] + replacement + text[end + len(end_marker):]
          p.write_text(text)
          PY

          rm .github/workflows/temp-migrate-ecs-panel-sections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor/src/renderer/src/inspector/SchemaComponents.tsx .github/workflows/temp-migrate-ecs-panel-sections.yml
          git commit -m 'Use shared panel sections for ECS inspector cards'
          git push origin HEAD:feat/texture-editor-view
