name: Temporary editor performance cleanup
"on":
  push:
    branches: [perf/editor-host-contention]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/editor-host-contention
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('editor/src/main/main.ts')
          s = p.read_text()
          old = '''      void request.finally(() => {
        if (this.coalescedQueries.get(key) === request) this.coalescedQueries.delete(key);
      });
'''
          new = '''      const cleanup = () => {
        if (this.coalescedQueries.get(key) === request) this.coalescedQueries.delete(key);
      };
      void request.then(cleanup, cleanup);
'''
          if old not in s: raise SystemExit('query cleanup anchor missing')
          s = s.replace(old, new, 1)
          old = '''      void request.finally(() => this.flushPointerMove(viewportId));
'''
          new = '''      void request.then(
        () => this.flushPointerMove(viewportId),
        () => this.flushPointerMove(viewportId),
      );
'''
          if old not in s: raise SystemExit('pointer cleanup anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('editor/native/src/arc_host_process_main.cpp')
          s = p.read_text()
          old = '''                const auto created =
                    backend_->create_viewport_output({.id = id,
                                                      .type = arc::render::viewport_output_type::shared_texture,
                                                      .width = surface.width,
                                                      .height = surface.height,
                                                      .visible = surface.visible});
'''
          new = '''                const auto output_start = std::chrono::steady_clock::now();
                const auto created =
                    backend_->create_viewport_output({.id = id,
                                                      .type = arc::render::viewport_output_type::shared_texture,
                                                      .width = surface.width,
                                                      .height = surface.height,
                                                      .visible = surface.visible});
                const auto output_ms = std::chrono::duration<double, std::milli>(
                                           std::chrono::steady_clock::now() - output_start)
                                           .count();
                std::cerr << "[perf][render.vulkan] shared output '" << id << "' creation " << std::fixed
                          << std::setprecision(1) << output_ms << "ms\\n";
'''
          if old not in s: raise SystemExit('shared output anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          npm ci --prefix editor
          npm run typecheck --prefix editor
          cmake -S . -B out/build/perf-cleanup -G Ninja -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/perf-cleanup --target arc_host_process --parallel 2
      - name: Commit cleanup
        run: |
          rm .github/workflows/temporary-editor-perf-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden editor request coalescing diagnostics'
          git push
