name: Temporary Material Stage 5-6 Cleanup

on:
  push:
    branches:
      - feature/material-schema-v2-processor

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/material-schema-v2-processor
          fetch-depth: 0
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Extract material processor from main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/asset_cooker/main.cpp')
          text = path.read_text()
          include = '#include "material_processor.h"\n\n'
          if include not in text:
              text = include + text

          start = text.find('class material_processor final : public asset_cook_processor\n{')
          end = text.find('class unsupported_processor final : public asset_cook_processor\n{')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('material processor extraction markers were not found')
          text = text[:start] + text[end:]
          old = 'cooker.register_processor(std::make_unique<material_processor>());'
          new = 'cooker.register_processor(arc::tools::make_material_processor());'
          if old not in text:
              raise SystemExit('material processor registration marker was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format changed native files
        run: |
          clang-format-18 -i \
            engine/render-tools/inc/arc/render_tools/material_asset.h \
            engine/render-tools/inc/arc/render_tools/render_tools.h \
            engine/render-tools/src/common/material_asset.cpp \
            engine/render-tools/tests/material_asset_tests.cpp \
            tools/asset_cooker/main.cpp \
            tools/asset_cooker/material_processor.h \
            tools/asset_cooker/material_processor.cpp
      - name: Commit extracted processor
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/render-tools tools/asset_cooker
          git commit -m 'Extract material processor and format stage 5-6 changes'
          git push origin HEAD:feature/material-schema-v2-processor
