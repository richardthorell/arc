name: Temporary Force Direct Mesh Draws

on:
  push:
    branches:
      - fix/restore-mesh-rendering

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-mesh-rendering
      - name: Force stable direct indexed draws
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('engine/render-vulkan/src/vulkan_backend.cpp')
          text = path.read_text()
          old = '''    bool draw_gpu_visibility_command(VkCommandBuffer command_buffer, gpu_scene_instance_handle handle) const\n    {\n        if (!gpu_visibility_active_ || !handle.valid() || handle.index >= gpu_visibility_capacity_) return false;\n        vkCmdDrawIndexedIndirect(command_buffer, gpu_visibility_commands_.buffer,\n                                 static_cast<VkDeviceSize>(handle.index) * indexed_indirect_command_stride, 1u,\n                                 static_cast<std::uint32_t>(indexed_indirect_command_stride));\n        return true;\n    }\n'''
          new = '''    bool draw_gpu_visibility_command(VkCommandBuffer command_buffer, gpu_scene_instance_handle handle) const\n    {\n        // Temporarily force the established direct indexed submission path for ordinary meshes.\n        // This bypasses both compact bindless batches and the stable GPU visibility indirect command.\n        (void)command_buffer;\n        (void)handle;\n        return false;\n    }\n'''
          if old not in text:
              raise SystemExit('target function not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/temp-force-direct-mesh-draws.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Force direct indexed mesh submission"
          git push origin HEAD:fix/restore-mesh-rendering
