name: Temp Collapse Texture Sections

on:
  push:
    branches:
      - feat/texture-editor-view

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/texture-editor-view
      - name: Patch texture inspector sections
        shell: bash
        env:
          TEXTURE_INSPECTOR_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('editor/src/renderer/src/texture/TextureEditor.tsx')
          s = p.read_text()
          start = s.index('function TextureInspector({ asset }: { asset: AssetItem }) {')
          end = s.index('\nfunction HorizontalRuler', start)
          replacement = base64.b64decode(os.environ['TEXTURE_INSPECTOR_B64']).decode()
          p.write_text(s[:start] + replacement + s[end:])
          PY
          rm .github/workflows/temp-collapse-texture-sections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/texture/TextureEditor.tsx .github/workflows/temp-collapse-texture-sections.yml
          git commit -m "Make texture detail sections collapsible"
          git push
