name: Temp Editor Grid Colors

on:
  push:
    branches:
      - feature/editor-grid-colors

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/editor-grid-colors
          fetch-depth: 0

      - name: Apply grid implementation
        run: |
          python3 .github/temp_grid_color_patch.py
          python3 .github/temp_grid_color_order_fix.py
          python3 .github/temp_grid_color_test_fix.py
          python3 .github/temp_grid_adaptive_patch.py

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 gcc-14 g++-14 ninja-build

      - name: Format native files
        run: |
          clang-format-18 -i \
            editor/native/inc/arc/editor/editor_gizmo.h \
            editor/native/inc/arc/editor/host_protocol_base.h \
            editor/native/src/editor_gizmo.cpp \
            editor/native/src/host_protocol_base.inc \
            editor/native/src/arc_host_base.inc \
            editor/native/tests/editor_tests.cpp

      - name: Validate editor
        working-directory: editor
        run: |
          npm ci
          npx prettier --write \
            src/common/editorWorkflowTypes.ts \
            src/main/settingsService.ts \
            src/main/settingsService.test.ts \
            src/renderer/src/settings/SettingsDialog.tsx \
            src/renderer/src/settings/SettingsDialog.css \
            src/renderer/src/viewport/ViewportPanel.tsx
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run src/main/settingsService.test.ts src/renderer/src/settings/SettingsDialog.test.tsx src/renderer/src/viewport/ViewportPanel.test.tsx --pool=threads --maxWorkers=1

      - name: Build native editor tests
        run: |
          cmake -S . -B out/build/grid-colors -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DARC_BUILD_EDITOR=ON \
            -DARC_BUILD_RENDER_VULKAN=OFF \
            -DARC_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build out/build/grid-colors --target arc_editor_host_tests --parallel
          TEST=$(find out/build/grid-colors -type f -name arc_editor_host_tests -perm -111 | head -n 1)
          test -n "$TEST"
          "$TEST"

      - name: Check diff
        run: git diff --check

      - name: Commit implementation and clean temporary files
        run: |
          rm -f .github/temp_grid_color_patch.py .github/temp_grid_color_order_fix.py .github/temp_grid_color_test_fix.py .github/temp_grid_adaptive_patch.py .github/workflows/temp-editor-grid-colors.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve adaptive editor grid presentation"
          git push origin HEAD:feature/editor-grid-colors
