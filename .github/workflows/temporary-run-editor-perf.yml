name: Temporary run_editor perf
on:
  push:
    branches:
      - diagnostics/run-editor-perf
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/run-editor-perf
      - name: Add performance launcher options
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('run_editor.py')
          text = path.read_text()

          ui_lab = '    parser.add_argument(\n        "--ui-lab",\n        action="store_true",\n        help="Launch the standalone editor UI control lab without building or starting the native engine host.",\n    )\n'
          perf_args = '    parser.add_argument(\n        "--perf",\n        action="store_true",\n        help="Enable ARC editor performance diagnostics ([ARC PERF] startup and slow-operation timings).",\n    )\n    parser.add_argument(\n        "--perf-slow-ms",\n        type=float,\n        default=None,\n        metavar="MS",\n        help="Set the slow-operation threshold in milliseconds and enable performance diagnostics.",\n    )\n'
          if ui_lab not in text:
              raise SystemExit('parse_args anchor not found')
          text = text.replace(ui_lab, ui_lab + perf_args, 1)

          validation = '    if args.ui_lab and args.quick_start:\n        parser.error("--ui-lab and --quick-start cannot be used together")\n'
          perf_validation = '    if args.perf_slow_ms is not None and args.perf_slow_ms < 0:\n        parser.error("--perf-slow-ms must be zero or greater")\n'
          if validation not in text:
              raise SystemExit('argument validation anchor not found')
          text = text.replace(validation, validation + perf_validation, 1)

          env_anchor = '    tool_env = os.environ.copy()\n'
          perf_env = '    if args.perf or args.perf_slow_ms is not None:\n        tool_env["ARC_EDITOR_PERF"] = "1"\n    if args.perf_slow_ms is not None:\n        tool_env["ARC_EDITOR_PERF_SLOW_MS"] = str(args.perf_slow_ms)\n'
          if env_anchor not in text:
              raise SystemExit('launch environment anchor not found')
          text = text.replace(env_anchor, env_anchor + perf_env, 1)

          path.write_text(text)
          PY
      - name: Validate launcher
        run: |
          python3 -m py_compile run_editor.py
          python3 run_editor.py --help | grep -F -- '--perf'
          python3 run_editor.py --help | grep -F -- '--perf-slow-ms'
          if python3 run_editor.py --perf-slow-ms=-1 --build-only >/tmp/run_editor.out 2>/tmp/run_editor.err; then
            echo 'negative perf threshold unexpectedly accepted'
            exit 1
          fi
          grep -F -- '--perf-slow-ms must be zero or greater' /tmp/run_editor.err
      - name: Cleanup and commit
        run: |
          rm .github/workflows/temporary-run-editor-perf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add performance options to run_editor'
          git push
