name: Apply M2.2 build syntax fix

on:
  push:
    branches:
      - m2/terrain-lazy-cooked-regions

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message != 'fix: correct terrain serializer syntax'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2/terrain-lazy-cooked-regions
          fetch-depth: 0
      - name: Fix serializer syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('engine/scene/src/common/terrain_artifacts.cpp'),
              Path('engine/scene/src/common/terrain_cooked_storage.cpp'),
          ]
          old = 'value(std::bit_cast<bits_type>(static_cast<stored_type>(input))));'
          new = 'value(std::bit_cast<bits_type>(static_cast<stored_type>(input)));'
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one bad serializer expression, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/scene/src/common/terrain_artifacts.cpp engine/scene/src/common/terrain_cooked_storage.cpp
          git commit -m "fix: correct terrain serializer syntax"
          git push origin HEAD:m2/terrain-lazy-cooked-regions
