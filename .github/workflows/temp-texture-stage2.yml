std::optional<texture_address_mode> parse_texture_address_mode(std::string_view value) noexcept { return enum_value(value, {{"repeat", texture_address_mode::repeat}, {"clamp_to_edge", texture_address_mode::clamp_to_edge}, {"clamp", texture_address_mode::clamp_to_edge}, {"mirrored_repeat", texture_address_mode::mirrored_repeat}, {"mirror", texture_address_mode::mirrored_repeat}}); }
std::optional<texture_mip_generation_filter> parse_texture_mip_generation_filter(std::string_view value) noexcept { return enum_value(value, {{"box", texture_mip_generation_filter::box}, {"nearest", texture_mip_generation_filter::nearest}}); }

texture_import_settings texture_import_settings_for_preset(texture_import_preset preset) noexcept
{
    texture_import_settings settings;
    settings.preset = preset;
    switch (preset)
    {
        case texture_import_preset::color: settings.semantic = texture_semantic::base_color; settings.color_space = texture_color_space::srgb; settings.streaming_mode = texture_streaming_mode::streamed_mips; settings.compression = texture_compression_policy::color; break;
        case texture_import_preset::normal_map: settings.semantic = texture_semantic::normal; settings.color_space = texture_color_space::linear; settings.streaming_mode = texture_streaming_mode::streamed_mips; settings.compression = texture_compression_policy::normal; break;
        case texture_import_preset::data: settings.semantic = texture_semantic::metallic_roughness; settings.color_space = texture_color_space::linear; settings.streaming_mode = texture_streaming_mode::streamed_mips; settings.compression = texture_compression_policy::mask; settings.anisotropy = 4.0f; settings.max_size = 4096; break;
        case texture_import_preset::hdr: settings.semantic = texture_semantic::generic_color; settings.color_space = texture_color_space::linear; settings.streaming_mode = texture_streaming_mode::streamed_mips; settings.compression = texture_compression_policy::hdr; settings.max_size = 4096; break;
        case texture_import_preset::ui: settings.semantic = texture_semantic::generic_color; settings.color_space = texture_color_space::srgb; settings.streaming_mode = texture_streaming_mode::resident; settings.compression = texture_compression_policy::color; settings.wrap_u = texture_address_mode::clamp_to_edge; settings.wrap_v = texture_address_mode::clamp_to_edge; settings.generate_mips = false; settings.anisotropy = 1.0f; settings.max_size = 4096; break;
        case texture_import_preset::environment: settings.semantic = texture_semantic::environment; settings.color_space = texture_color_space::linear; settings.streaming_mode = texture_streaming_mode::streamed_mips; settings.compression = texture_compression_policy::hdr; settings.wrap_v = texture_address_mode::clamp_to_edge; settings.max_size = 4096; break;
        case texture_import_preset::custom: break;
    }
    return settings;
}

texture_import_settings_result parse_texture_import_settings(std::string_view canonical_json, std::uint32_t settings_version)
{
    texture_import_settings settings;
    if (canonical_json.empty() || canonical_json == "{}") return texture_import_settings_result::success(settings);
    const auto document = json::parse(canonical_json, nullptr, false);
    if (!document.is_object()) return texture_import_settings_result::failure("texture import settings must be a JSON object");
    auto parse_string_field = [&](const char* name, auto parser, auto& target) -> std::optional<std::string>
    {
        const auto field = document.find(name);
        if (field == document.end()) return std::nullopt;
        if (!field->is_string()) return std::string{"texture "} + name + " must be a string";
        const auto value = parser(field->get<std::string>());
        if (!value) return std::string{"texture "} + name + " is invalid";
        target = *value;
        return std::nullopt;
    };
    if (const auto error = parse_string_field("streamingMode", parse_texture_streaming_mode, settings.streaming_mode)) return texture_import_settings_result::failure(*error);
    if (settings_version < 3) return texture_import_settings_result::success(settings);
    if (const auto error = parse_string_field("preset", parse_texture_import_preset, settings.preset)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("semantic", parse_texture_semantic, settings.semantic)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("colorSpace", parse_texture_color_space, settings.color_space)) return texture_import_settings_result::failure(*error);
    if (settings_version < 4) return texture_import_settings_result::success(settings);
    if (const auto error = parse_string_field("compression", parse_texture_compression_policy, settings.compression)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("powerOfTwo", parse_texture_power_of_two_policy, settings.power_of_two)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("minFilter", parse_texture_filter_mode, settings.min_filter)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("magFilter", parse_texture_filter_mode, settings.mag_filter)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("mipFilter", parse_texture_mip_filter_mode, settings.mip_filter)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("wrapU", parse_texture_address_mode, settings.wrap_u)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("wrapV", parse_texture_address_mode, settings.wrap_v)) return texture_import_settings_result::failure(*error);
    if (const auto error = parse_string_field("mipGenerationFilter", parse_texture_mip_generation_filter, settings.mip_generation_filter)) return texture_import_settings_result::failure(*error);
    settings.max_size = document.value("maxSize", settings.max_size);
    settings.anisotropy = document.value("anisotropy", settings.anisotropy);
    settings.lod_bias = document.value("lodBias", settings.lod_bias);
    settings.minimum_lod = document.value("minimumLod", settings.minimum_lod);
    settings.maximum_lod = document.value("maximumLod", settings.maximum_lod);
    settings.alpha_coverage_threshold = document.value("alphaCoverageThreshold", settings.alpha_coverage_threshold);
    settings.generate_mips = document.value("generateMips", settings.generate_mips);
    settings.preserve_alpha_coverage = document.value("preserveAlphaCoverage", settings.preserve_alpha_coverage);
    if (settings.max_size == 0 || settings.max_size > 32768 || !std::isfinite(settings.anisotropy) || settings.anisotropy < 1.0f || settings.anisotropy > 16.0f || !std::isfinite(settings.lod_bias) || !std::isfinite(settings.minimum_lod) || !std::isfinite(settings.maximum_lod) || settings.maximum_lod < settings.minimum_lod || !std::isfinite(settings.alpha_coverage_threshold) || settings.alpha_coverage_threshold < 0.0f || settings.alpha_coverage_threshold > 1.0f)
        return texture_import_settings_result::failure("texture import settings contain an invalid numeric value");
    return texture_import_settings_result::success(settings);
}

std::string serialize_texture_import_settings(const texture_import_settings& settings)
{
    return json{{"alphaCoverageThreshold", settings.alpha_coverage_threshold}, {"anisotropy", settings.anisotropy}, {"colorSpace", texture_color_space_name(settings.color_space)}, {"compression", texture_compression_policy_name(settings.compression)}, {"generateMips", settings.generate_mips}, {"lodBias", settings.lod_bias}, {"magFilter", texture_filter_mode_name(settings.mag_filter)}, {"maxSize", settings.max_size}, {"maximumLod", settings.maximum_lod}, {"minFilter", texture_filter_mode_name(settings.min_filter)}, {"minimumLod", settings.minimum_lod}, {"mipFilter", texture_mip_filter_mode_name(settings.mip_filter)}, {"mipGenerationFilter", texture_mip_generation_filter_name(settings.mip_generation_filter)}, {"powerOfTwo", texture_power_of_two_policy_name(settings.power_of_two)}, {"preset", texture_import_preset_name(settings.preset)}, {"preserveAlphaCoverage", settings.preserve_alpha_coverage}, {"semantic", texture_semantic_name(settings.semantic)}, {"streamingMode", texture_streaming_mode_name(settings.streaming_mode)}, {"wrapU", texture_address_mode_name(settings.wrap_u)}, {"wrapV", texture_address_mode_name(settings.wrap_v)}}.dump();
}

texture_preprocess_result_type preprocess_texture_for_cook(texture_data texture, const texture_import_settings& settings,
                                                           const assets::cook_target& target)
{
    texture_preprocess_result result;
    result.metadata.source_width = texture.width;
    result.metadata.source_height = texture.height;
    result.metadata.requested_max_size = settings.max_size;
    result.metadata.resolved_max_size = std::min(settings.max_size, platform_max_size(target));
    result.metadata.power_of_two = settings.power_of_two;
    result.metadata.compression = settings.compression;
    result.metadata.min_filter = settings.min_filter;
    result.metadata.mag_filter = settings.mag_filter;
    result.metadata.mip_filter = settings.mip_filter;
    result.metadata.wrap_u = settings.wrap_u;
    result.metadata.wrap_v = settings.wrap_v;
    result.metadata.anisotropy = settings.anisotropy;
    result.metadata.lod_bias = settings.lod_bias;
    result.metadata.minimum_lod = settings.minimum_lod;
    result.metadata.maximum_lod = settings.maximum_lod;
    result.metadata.alpha_coverage_threshold = settings.alpha_coverage_threshold;

    texture.semantic = settings.semantic;
    texture.color_space = settings.color_space;
    texture.format = format_for_color_space(texture.format, settings.color_space);
    if (texture.width == 0 || texture.height == 0 || texture.mips.empty()) return texture_preprocess_result_type::failure("texture source has no mip payload");

    std::uint32_t desired_width = texture.width;
    std::uint32_t desired_height = texture.height;
    const auto largest = std::max(desired_width, desired_height);
    if (largest > result.metadata.resolved_max_size)
    {
        const float scale = static_cast<float>(result.metadata.resolved_max_size) / static_cast<float>(largest);
        desired_width = std::max(1u, static_cast<std::uint32_t>(std::floor(desired_width * scale)));
        desired_height = std::max(1u, static_cast<std::uint32_t>(std::floor(desired_height * scale)));
        result.metadata.resized = true;
    }
    if (settings.power_of_two != texture_power_of_two_policy::preserve)
    {
        const auto adjust = settings.power_of_two == texture_power_of_two_policy::resize_up ? next_power_of_two : previous_power_of_two;
        const auto adjusted_width = std::min(result.metadata.resolved_max_size, adjust(desired_width));
        const auto adjusted_height = std::min(result.metadata.resolved_max_size, adjust(desired_height));
        result.metadata.power_of_two_adjusted = adjusted_width != desired_width || adjusted_height != desired_height;
        desired_width = adjusted_width;
        desired_height = adjusted_height;
    }

    const bool rgba8 = texture.format == texture_format::rgba8_unorm || texture.format == texture_format::rgba8_srgb;
    if (!texture.compressed && rgba8 && texture.has_pixels())
    {
        const auto& base_mip = texture.mips.front();
        const auto base = std::span(texture.pixels).subspan(base_mip.offset, base_mip.size);
        auto level = desired_width == texture.width && desired_height == texture.height
                         ? std::vector<std::byte>(base.begin(), base.end())
                         : resize_rgba8(base, texture.width, texture.height, desired_width, desired_height);
        texture.width = desired_width;
        texture.height = desired_height;
        rebuild_rgba8_mips(texture, settings, std::move(level));
        result.metadata.generated_mips = settings.generate_mips && texture.mips.size() > 1u;
        result.metadata.normal_mips_renormalized = settings.semantic == texture_semantic::normal && result.metadata.generated_mips;
        result.metadata.alpha_coverage_preserved = settings.preserve_alpha_coverage && result.metadata.generated_mips;
    }
    else
    {
        if (desired_width != texture.width || desired_height != texture.height)
        {
            std::size_t selected{};
            while (selected + 1u < texture.mips.size() && (texture.mips[selected].width > desired_width || texture.mips[selected].height > desired_height)) ++selected;
            if (selected == 0u || texture.mips[selected].width > desired_width || texture.mips[selected].height > desired_height)
                return texture_preprocess_result_type::failure("compressed texture cannot satisfy the requested resize without a matching authored mip");
            auto storage = texture.has_encoded_mips() ? texture.encoded : texture.pixels;
            std::vector<std::byte> sliced;
            std::vector<texture_mip_data> mips;
            for (std::size_t index = selected; index < texture.mips.size(); ++index)
            {
                const auto& source = texture.mips[index];
                if (source.offset > storage.size() || source.size > storage.size() - source.offset) return texture_preprocess_result_type::failure("compressed texture mip payload is invalid");
                const auto offset = sliced.size();
                sliced.insert(sliced.end(), storage.begin() + static_cast<std::ptrdiff_t>(source.offset), storage.begin() + static_cast<std::ptrdiff_t>(source.offset + source.size));
                mips.push_back({.width = source.width, .height = source.height, .offset = offset, .size = source.size});
                if (!settings.generate_mips) break;
            }
            if (texture.has_encoded_mips()) texture.encoded = std::move(sliced); else texture.pixels = std::move(sliced);
            texture.mips = std::move(mips);
            texture.width = texture.mips.front().width;
            texture.height = texture.mips.front().height;
            texture.mip_levels = static_cast<std::uint32_t>(texture.mips.size());
        }
        else if (!settings.generate_mips && texture.mips.size() > 1u)
        {
            const auto source = texture.mips.front();
            auto& storage = texture.has_encoded_mips() ? texture.encoded : texture.pixels;
            std::vector<std::byte> base(storage.begin() + static_cast<std::ptrdiff_t>(source.offset), storage.begin() + static_cast<std::ptrdiff_t>(source.offset + source.size));
            storage = std::move(base);
            texture.mips = {{.width = source.width, .height = source.height, .offset = 0, .size = source.size}};
            texture.mip_levels = 1;
        }
        if (settings.semantic == texture_semantic::normal && texture.mips.size() > 1u)
            result.diagnostics.push_back({.severity = assets::asset_diagnostic_severity::warning, .category = "texture.import", .message = "Compressed normal-map mips are preserved as authored; per-mip renormalization requires decoded source data"});
        if (settings.preserve_alpha_coverage && texture.mips.size() > 1u)
            result.diagnostics.push_back({.severity = assets::asset_diagnostic_severity::warning, .category = "texture.import", .message = "Compressed alpha mip coverage is preserved as authored"});
    }
    result.texture = std::move(texture);
    return texture_preprocess_result_type::success(std::move(result));
}

texture_cook_processor::texture_cook_processor()
{
    descriptor_ = {.id = assets::cook_processor_ids::texture, .name = "ARC Texture Cooker", .version = 4,
                   .schema = assets::artifact_schemas::texture, .schema_version = texture_artifact_schema_version,
                   .affinity = jobs::job_affinity::any_worker, .input_types = {assets::asset_types::texture_2d}};
}
const assets::asset_cook_processor_descriptor& texture_cook_processor::descriptor() const noexcept { return descriptor_; }
std::string texture_cook_processor::toolchain_fingerprint() const { return "arc-texture-cooker-v4:arctex-v2:deterministic-preprocessing:sampling-policy"; }

assets::asset_cook_result texture_cook_processor::cook(const assets::asset_cook_context& context)
{
    if (context.cancellation.stop_requested()) return {.error = {.code = assets::asset_error_code::cancelled, .guid = context.asset.guid, .path = context.source.source_path, .message = "texture cook was cancelled"}};
    const auto settings = parse_texture_import_settings(context.canonical_settings, context.settings_version);
    if (!settings) return cook_failure(context, settings.error());
    if (!is_supported_texture_asset(context.source.source_path) || context.source.source_path.extension() == ".hdr") return cook_failure(context, "streamable texture cooking supports DDS, PNG, JPEG, TGA, and BMP 2D sources");
    auto loaded = load_texture_asset_bytes(context.source.bytes, context.source.source_path);
    if (!loaded.succeeded() || loaded.texture.dimension != texture_dimension::texture_2d || loaded.texture.array_layers != 1 || loaded.texture.mips.empty()) return cook_failure(context, loaded.message.empty() ? "texture source could not be decoded" : loaded.message);
    auto processed = preprocess_texture_for_cook(std::move(loaded.texture), settings.value(), context.target);
    if (!processed) return cook_failure(context, processed.error());
    auto encoded = encode_texture_artifact(processed.value().texture, settings.value().streaming_mode, processed.value().metadata);
    if (!encoded) return cook_failure(context, encoded.error().message);
    assets::cooked_artifact artifact{.name = context.source.source_path.stem().string(), .extension = ".arctex", .schema = assets::artifact_schemas::texture, .schema_version = texture_artifact_schema_version, .gpu_compressed = processed.value().texture.compressed, .bytes = std::move(encoded).value()};
    return {.artifacts = {std::move(artifact)}, .diagnostics = std::move(processed).value().diagnostics};
}

