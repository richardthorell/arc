          import_new = '''          {settings && (\n            <>\n              <label className="inspector-property texture-inspector-property"><span className="inspector-property-label">Max Size</span><input className="texture-inspector-input" disabled={settingsBusy} max={32768} min={1} onChange={(event) => void updateSettings({ maxSize: Number(event.target.value) })} step={1} type="number" value={settings.maxSize} /></label>\n              <label className="inspector-property texture-inspector-property"><span className="inspector-property-label">Power of Two</span><select className="texture-inspector-select" disabled={settingsBusy} value={settings.powerOfTwo} onChange={(event) => void updateSettings({ powerOfTwo: event.target.value as TexturePowerOfTwoPolicy })}><option value="preserve">Preserve</option><option value="resize_down">Resize Down</option><option value="resize_up">Resize Up</option></select></label>\n            </>\n          )}'''
          if import_old not in text: raise SystemExit('import UI marker missing')
          p.write_text(text.replace(import_old, import_new, 1))

          p = Path('editor/src/renderer/src/texture/textureEditor.css')
          text = p.read_text() + r'''

.texture-inspector-input {
  min-width: 0;
  width: 100%;
  height: var(--inspector-control-height);
  border: 1px solid var(--inspector-border);
  border-radius: var(--inspector-radius);
  color: var(--inspector-text);
  background: var(--inspector-bg-field);
  font: inherit;
  padding: 0 7px;
}

.texture-inspector-input:focus-visible {
  outline: 1px solid var(--arc-accent, #5b9bd5);
  outline-offset: 0;
}

.texture-inspector-input:disabled {
  opacity: 0.6;
}
'''
          p.write_text(text)

          # Make existing TextureEditor test return the Stage 2 settings snapshot.
          p = Path('editor/src/renderer/src/texture/TextureEditor.test.tsx')
          text = p.read_text()
          old = '''    const query = vi.fn().mockResolvedValue({\n      succeeded: true,\n      payload: {\n        path: textureDocument.path,\n        width: 1024,\n        height: 512,\n        dataUrl: 'data:image/png;base64,preview',\n      },\n    });'''
          new = '''    const query = vi.fn().mockImplementation((type: string) =>\n      Promise.resolve(\n        type === 'texture.settings'\n          ? {\n              succeeded: true,\n              payload: {\n                settingsVersion: 4, preset: 'color', semantic: 'base_color', colorSpace: 'srgb',\n                streamingMode: 'streamed_mips', compression: 'color', powerOfTwo: 'preserve',\n                minFilter: 'linear', magFilter: 'linear', mipFilter: 'linear', wrapU: 'repeat', wrapV: 'repeat',\n                mipGenerationFilter: 'box', maxSize: 8192, anisotropy: 8, lodBias: 0, minimumLod: 0,\n                maximumLod: 1000, alphaCoverageThreshold: 0.5, generateMips: true, preserveAlphaCoverage: false,\n              },\n            }\n          : {\n              succeeded: true,\n              payload: { path: textureDocument.path, width: 1024, height: 512, dataUrl: 'data:image/png;base64,preview' },\n            },\n      ),\n    );'''
          if old not in text: raise SystemExit('TextureEditor test mock marker missing')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: |
          clang-format -i \
            engine/render/inc/arc/render/texture_artifact.h \
            engine/render/src/common/texture_artifact.cpp \
            engine/render-tools/inc/arc/render_tools/texture_cooker.h \
            engine/render-tools/src/common/texture_cooker.cpp \
            engine/render-tools/tests/texture_cooker_tests.cpp \
            editor/native/inc/arc/editor/host_protocol_base.h \
            editor/native/src/host_protocol_base.inc \
            editor/native/src/arc_host_base.inc
          cd editor
          npx --yes prettier@3.9.6 --write \
            src/renderer/src/texture/textureSettings.ts \
            src/renderer/src/texture/TextureEditor.tsx \
            src/renderer/src/texture/TextureEditor.test.tsx \
            src/renderer/src/texture/textureEditor.css

      - name: Native validation
        run: |
          cmake -S . -B out/build/texture-stage2 -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DARC_BUILD_EDITOR=ON \
            -DARC_BUILD_RENDER_VULKAN=OFF
          cmake --build out/build/texture-stage2 --target arc_render_tools_tests arc-editor-host -j2
          ctest --test-dir out/build/texture-stage2 -R arc_render_tools_tests --output-on-failure

      - name: Editor validation
        run: |
          cd editor
          npm ci
          npm run typecheck
          npm test -- --run src/renderer/src/texture/TextureEditor.test.tsx src/renderer/src/editors/textureEditorRegistration.test.ts

      - name: Commit Stage 2
        if: success()
        run: |
          rm .github/workflows/temp-texture-stage2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add texture import policy Stage 2"
          git push origin HEAD:feat/texture-import-policy-stage2
