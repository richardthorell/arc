    REQUIRE(processed.value().texture.mips.size() == 2);
    CHECK(processed.value().metadata.normal_mips_renormalized);
    const auto& mip = processed.value().texture.mips.back();
    const auto offset = mip.offset;
    const auto x = static_cast<float>(std::to_integer<std::uint8_t>(processed.value().texture.pixels[offset])) / 255.0f * 2.0f - 1.0f;
    const auto y = static_cast<float>(std::to_integer<std::uint8_t>(processed.value().texture.pixels[offset + 1u])) / 255.0f * 2.0f - 1.0f;
    const auto z = static_cast<float>(std::to_integer<std::uint8_t>(processed.value().texture.pixels[offset + 2u])) / 255.0f * 2.0f - 1.0f;
