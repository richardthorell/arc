std::optional<texture_import_preset> parse_texture_import_preset(std::string_view value) noexcept { return enum_value(value, {{"custom", texture_import_preset::custom}, {"color", texture_import_preset::color}, {"default", texture_import_preset::color}, {"normal_map", texture_import_preset::normal_map}, {"normalmap", texture_import_preset::normal_map}, {"normal", texture_import_preset::normal_map}, {"data", texture_import_preset::data}, {"mask", texture_import_preset::data}, {"hdr", texture_import_preset::hdr}, {"ui", texture_import_preset::ui}, {"environment", texture_import_preset::environment}}); }
std::optional<texture_semantic> parse_texture_semantic(std::string_view value) noexcept { return enum_value(value, {{"generic_color", texture_semantic::generic_color}, {"genericcolor", texture_semantic::generic_color}, {"base_color", texture_semantic::base_color}, {"basecolor", texture_semantic::base_color}, {"emissive", texture_semantic::emissive}, {"normal", texture_semantic::normal}, {"metallic_roughness", texture_semantic::metallic_roughness}, {"metallicroughness", texture_semantic::metallic_roughness}, {"occlusion", texture_semantic::occlusion}, {"clear_coat", texture_semantic::clear_coat}, {"clearcoat", texture_semantic::clear_coat}, {"anisotropy", texture_semantic::anisotropy}, {"thickness", texture_semantic::thickness}, {"transmission", texture_semantic::transmission}, {"lightmap", texture_semantic::lightmap}, {"environment", texture_semantic::environment}}); }
