std::string_view texture_import_preset_name(texture_import_preset value) noexcept
{
    switch (value) { case texture_import_preset::custom: return "custom"; case texture_import_preset::color: return "color"; case texture_import_preset::normal_map: return "normal_map"; case texture_import_preset::data: return "data"; case texture_import_preset::hdr: return "hdr"; case texture_import_preset::ui: return "ui"; case texture_import_preset::environment: return "environment"; }
    return "custom";
}
std::string_view texture_semantic_name(texture_semantic value) noexcept
{
    switch (value) { case texture_semantic::generic_color: return "generic_color"; case texture_semantic::base_color: return "base_color"; case texture_semantic::emissive: return "emissive"; case texture_semantic::normal: return "normal"; case texture_semantic::metallic_roughness: return "metallic_roughness"; case texture_semantic::occlusion: return "occlusion"; case texture_semantic::clear_coat: return "clear_coat"; case texture_semantic::anisotropy: return "anisotropy"; case texture_semantic::thickness: return "thickness"; case texture_semantic::transmission: return "transmission"; case texture_semantic::lightmap: return "lightmap"; case texture_semantic::environment: return "environment"; }
    return "generic_color";
}
std::string_view texture_color_space_name(texture_color_space value) noexcept { return value == texture_color_space::linear ? "linear" : "srgb"; }
std::string_view texture_streaming_mode_name(texture_streaming_mode value) noexcept { switch (value) { case texture_streaming_mode::resident: return "resident"; case texture_streaming_mode::streamed_mips: return "streamed_mips"; case texture_streaming_mode::virtual_tiles: return "virtual_tiles"; } return "resident"; }
std::string_view texture_compression_policy_name(texture_compression_policy value) noexcept { switch (value) { case texture_compression_policy::automatic: return "automatic"; case texture_compression_policy::color: return "color"; case texture_compression_policy::normal: return "normal"; case texture_compression_policy::mask: return "mask"; case texture_compression_policy::hdr: return "hdr"; case texture_compression_policy::uncompressed: return "uncompressed"; } return "automatic"; }
std::string_view texture_power_of_two_policy_name(texture_power_of_two_policy value) noexcept { switch (value) { case texture_power_of_two_policy::preserve: return "preserve"; case texture_power_of_two_policy::resize_down: return "resize_down"; case texture_power_of_two_policy::resize_up: return "resize_up"; } return "preserve"; }
std::string_view texture_filter_mode_name(texture_filter_mode value) noexcept { return value == texture_filter_mode::nearest ? "nearest" : "linear"; }
std::string_view texture_mip_filter_mode_name(texture_mip_filter_mode value) noexcept { return value == texture_mip_filter_mode::nearest ? "nearest" : "linear"; }
std::string_view texture_address_mode_name(texture_address_mode value) noexcept { switch (value) { case texture_address_mode::repeat: return "repeat"; case texture_address_mode::clamp_to_edge: return "clamp_to_edge"; case texture_address_mode::mirrored_repeat: return "mirrored_repeat"; } return "repeat"; }
