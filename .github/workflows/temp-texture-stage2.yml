std::optional<texture_compression_policy> parse_texture_compression_policy(std::string_view value) noexcept { return enum_value(value, {{"automatic", texture_compression_policy::automatic}, {"color", texture_compression_policy::color}, {"normal", texture_compression_policy::normal}, {"mask", texture_compression_policy::mask}, {"hdr", texture_compression_policy::hdr}, {"uncompressed", texture_compression_policy::uncompressed}}); }
std::optional<texture_power_of_two_policy> parse_texture_power_of_two_policy(std::string_view value) noexcept { return enum_value(value, {{"preserve", texture_power_of_two_policy::preserve}, {"resize_down", texture_power_of_two_policy::resize_down}, {"resize_up", texture_power_of_two_policy::resize_up}}); }
