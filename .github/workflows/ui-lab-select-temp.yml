name: UI Lab Select Update Temp

on:
  push:
    branches:
      - fix/ecs-shared-field-controls
    paths:
      - .github/workflows/ui-lab-select-temp.yml

permissions:
  contents: write

jobs:
  update-ui-lab-select:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/ecs-shared-field-controls

      - name: Normalize shared select preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('editor/src/renderer/src/uiLab/UiLab.tsx')
          text = path.read_text()
          pattern = re.compile(
              r'^[ \t]*<LabCard title="Select" caption="UiSelect">.*?^[ \t]*</LabCard>',
              re.MULTILINE | re.DOTALL,
          )
          replacement = '''          <LabCard title="Select" caption="UiSelect">
            <UiSelect
              ariaLabel="Quality preset"
              options={[
                { label: 'Default', value: 'Default' },
                { label: 'High', value: 'High' },
                { label: 'Ultra', value: 'Ultra' },
              ]}
              value={nativeSelect}
              onValueChange={setNativeSelect}
            />
          </LabCard>'''
          if not pattern.search(text):
              raise SystemExit('shared select preview block not found')
          path.write_text(pattern.sub(replacement, text, count=1))
          PY

      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/uiLab/UiLab.tsx
          git commit -m "Format shared select UI Lab preview"
          git push origin HEAD:fix/ecs-shared-field-controls
