name: UI Lab Select Update Temp

on:
  push:
    branches:
      - fix/ecs-shared-field-controls
    paths:
      - .github/workflows/ui-lab-select-temp.yml

permissions:
  contents: write

jobs:
  update-ui-lab-select:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/ecs-shared-field-controls

      - name: Finalize shared UI styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ui_lab = Path('editor/src/renderer/src/uiLab/UiLab.tsx')
          text = ui_lab.read_text()
          pattern = re.compile(
              r'^[ \t]*<LabCard title="Select" caption="UiSelect">.*?^[ \t]*</LabCard>',
              re.MULTILINE | re.DOTALL,
          )
          lines = [
              '          <LabCard title="Select" caption="UiSelect">',
              '            <UiSelect',
              '              ariaLabel="Quality preset"',
              '              options={[',
              "                { label: 'Default', value: 'Default' },",
              "                { label: 'High', value: 'High' },",
              "                { label: 'Ultra', value: 'Ultra' },",
              '              ]}',
              '              value={nativeSelect}',
              '              onValueChange={setNativeSelect}',
              '            />',
              '          </LabCard>',
          ]
          if not pattern.search(text):
              raise SystemExit('shared select preview block not found')
          ui_lab.write_text(pattern.sub('\n'.join(lines), text, count=1))

          styles = Path('editor/src/renderer/src/styles.css')
          css = styles.read_text()
          old = "button,\ninput {\n  font: inherit;\n}"
          new = "button,\ninput,\nselect,\ntextarea {\n  font: inherit;\n}"
          if old in css:
              css = css.replace(old, new, 1)
          elif new not in css:
              raise SystemExit('global form font block not found')
          styles.write_text(css)
          PY

      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/uiLab/UiLab.tsx editor/src/renderer/src/styles.css
          git commit -m "Finalize shared select styling"
          git push origin HEAD:fix/ecs-shared-field-controls
