name: Temporary project assets performance fix
"on":
  push:
    branches: [perf/project-assets-texture-metadata]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/project-assets-texture-metadata
      - name: Apply performance fix
        run: python3 .github/tmp_project_assets_perf_patch.py
      - name: Validate
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B out/build/project-assets-perf -G Ninja -DARC_BUILD_ENGINE_TESTS=ON -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/project-assets-perf --target arc_render_tests arc_host_process --parallel 2
          ctest --test-dir out/build/project-assets-perf -R arc_render_tests --output-on-failure
      - name: Commit implementation
        run: |
          rm .github/workflows/temporary-project-assets-perf-fix.yml
          rm .github/tmp_project_assets_perf_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Avoid decoding textures in project asset snapshots'
          git push
