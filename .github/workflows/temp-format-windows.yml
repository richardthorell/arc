name: Temporary format Windows toolchain

on:
  push:
    branches:
      - fix/windows-toolchain-auto-detect

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-toolchain-auto-detect
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Format Windows toolchain source
        working-directory: editor
        run: npx prettier --write src/main/windowsToolchain.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- editor/src/main/windowsToolchain.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/main/windowsToolchain.ts
          git commit -m "Format Windows toolchain source"
          git push origin HEAD:fix/windows-toolchain-auto-detect
