name: Temporary editor performance diagnostics
'on':
  push:
    branches:
      - diagnostics/editor-performance
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/editor-performance
      - name: Apply diagnostics patch
        run: python3 .github/patch_editor_perf.py
      - name: Validate editor
        working-directory: editor
        run: |
          npm ci
          npx prettier --write src/main/main.ts src/main/performanceDiagnostics.ts src/main/performanceDiagnostics.test.ts src/renderer/src/main.tsx src/renderer/src/performanceDiagnostics.ts
          npm run typecheck
          npx vitest run src/main/performanceDiagnostics.test.ts
      - name: Cleanup and commit
        run: |
          rm .github/workflows/temporary-editor-performance-diagnostics.yml .github/patch_editor_perf.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add editor performance diagnostics'
          git push
