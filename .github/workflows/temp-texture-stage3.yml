name: Temporary Texture Stage 3

on:
  push:
    branches: [feat/texture-editor-stage3]
    paths: [.github/workflows/temp-texture-stage3.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/texture-editor-stage3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.x
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Apply Stage 3 implementation
        shell: bash
        run: |
          cat > /tmp/apply_stage3.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Native texture import settings: Stage 3 adjustments and channel mapping.
          path = 'engine/render-tools/inc/arc/render_tools/texture_cooker.h'
          replace_once(path,
          '''enum class texture_mip_generation_filter : std::uint8_t
          {
              box,
              nearest
          };

          struct texture_import_settings''',
          '''enum class texture_mip_generation_filter : std::uint8_t
          {
              box,
              nearest
          };

          enum class texture_channel_source : std::uint8_t
          {
              red,
              green,
              blue,
              alpha,
              zero,
              one
          };

          struct texture_import_settings''')
          replace_once(path, 'static constexpr std::uint32_t current_version = 4;', 'static constexpr std::uint32_t current_version = 5;')
          replace_once(path,
          '''    float alpha_coverage_threshold{0.5f};
              bool generate_mips{true};
              bool preserve_alpha_coverage{};''',
          '''    float alpha_coverage_threshold{0.5f};
              float brightness{};
              float gamma{1.0f};
              float contrast{1.0f};
              float saturation{1.0f};
              float vibrance{};
              float tint_r{1.0f};
              float tint_g{1.0f};
              float tint_b{1.0f};
              float input_black{};
              float input_white{1.0f};
              float output_black{};
              float output_white{1.0f};
              texture_channel_source channel_r{texture_channel_source::red};
              texture_channel_source channel_g{texture_channel_source::green};
              texture_channel_source channel_b{texture_channel_source::blue};
              texture_channel_source channel_a{texture_channel_source::alpha};
              bool invert_r{};
              bool invert_g{};
              bool invert_b{};
              bool invert_a{};
              bool generate_mips{true};
              bool preserve_alpha_coverage{};''')
          replace_once(path,
          '''[[nodiscard]] std::string_view texture_mip_generation_filter_name(texture_mip_generation_filter filter) noexcept;
          [[nodiscard]] std::optional<texture_import_preset>''',
          '''[[nodiscard]] std::string_view texture_mip_generation_filter_name(texture_mip_generation_filter filter) noexcept;
          [[nodiscard]] std::string_view texture_channel_source_name(texture_channel_source source) noexcept;
          [[nodiscard]] std::optional<texture_import_preset>''')
          replace_once(path,
          '''parse_texture_mip_generation_filter(std::string_view value) noexcept;

          [[nodiscard]] texture_import_settings''',
          '''parse_texture_mip_generation_filter(std::string_view value) noexcept;
          [[nodiscard]] std::optional<texture_channel_source> parse_texture_channel_source(std::string_view value) noexcept;

          [[nodiscard]] texture_import_settings''')

          path = 'engine/render-tools/src/common/texture_cooker.cpp'
          insert = r'''
          float mapped_channel(const std::array<float, 4>& rgba, texture_channel_source source) noexcept
          {
              switch (source)
              {
                  case texture_channel_source::red: return rgba[0];
                  case texture_channel_source::green: return rgba[1];
                  case texture_channel_source::blue: return rgba[2];
                  case texture_channel_source::alpha: return rgba[3];
                  case texture_channel_source::zero: return 0.0f;
                  case texture_channel_source::one: return 1.0f;
              }
              return 0.0f;
          }

          void apply_stage3_rgba8(std::vector<std::byte>& pixels, const texture_import_settings& settings) noexcept
          {
              const texture_channel_source channels[4]{settings.channel_r, settings.channel_g, settings.channel_b,
                                                       settings.channel_a};
              const bool invert[4]{settings.invert_r, settings.invert_g, settings.invert_b, settings.invert_a};
              const float level_range = std::max(0.0001f, settings.input_white - settings.input_black);
              const float exposure = std::exp2(settings.brightness);
              for (std::size_t offset = 0; offset + 3u < pixels.size(); offset += 4u)
              {
                  std::array<float, 4> source{};
                  for (std::size_t channel = 0; channel < 4u; ++channel)
                      source[channel] = static_cast<float>(std::to_integer<std::uint8_t>(pixels[offset + channel])) / 255.0f;
                  std::array<float, 4> value{};
                  for (std::size_t channel = 0; channel < 4u; ++channel)
                  {
                      value[channel] = mapped_channel(source, channels[channel]);
                      if (invert[channel]) value[channel] = 1.0f - value[channel];
                  }

                  if (settings.semantic != texture_semantic::normal)
                  {
                      for (std::size_t channel = 0; channel < 3u; ++channel)
                      {
                          if (settings.color_space == texture_color_space::srgb)
                              value[channel] = srgb_to_linear_channel(value[channel]);
                          value[channel] = std::clamp((value[channel] - settings.input_black) / level_range, 0.0f, 1.0f);
                          value[channel] = std::pow(value[channel], 1.0f / settings.gamma);
                          value[channel] *= exposure;
                          value[channel] = (value[channel] - 0.5f) * settings.contrast + 0.5f;
                      }
                      const float luminance = value[0] * 0.2126f + value[1] * 0.7152f + value[2] * 0.0722f;
                      for (std::size_t channel = 0; channel < 3u; ++channel)
                          value[channel] = luminance + (value[channel] - luminance) * settings.saturation;
                      const float maximum = std::max({value[0], value[1], value[2]});
                      const float minimum = std::min({value[0], value[1], value[2]});
                      const float vibrance = 1.0f + settings.vibrance * (1.0f - std::clamp(maximum - minimum, 0.0f, 1.0f));
                      for (std::size_t channel = 0; channel < 3u; ++channel)
                          value[channel] = luminance + (value[channel] - luminance) * vibrance;
                      value[0] *= settings.tint_r;
                      value[1] *= settings.tint_g;
                      value[2] *= settings.tint_b;
                      for (std::size_t channel = 0; channel < 3u; ++channel)
                      {
                          value[channel] = settings.output_black + std::clamp(value[channel], 0.0f, 1.0f) *
                                                                      (settings.output_white - settings.output_black);
                          value[channel] = std::clamp(value[channel], 0.0f, 1.0f);
                          if (settings.color_space == texture_color_space::srgb)
                              value[channel] = linear_to_srgb_channel(value[channel]);
                      }
                  }
                  for (std::size_t channel = 0; channel < 4u; ++channel)
                      pixels[offset + channel] = byte_channel(value[channel]);
              }
          }
          '''
          replace_once(path, '\n} // namespace\n\nstd::string_view texture_import_preset_name', '\n' + insert + '\n} // namespace\n\nstd::string_view texture_import_preset_name')
          replace_once(path,
          '''std::string_view texture_mip_generation_filter_name(texture_mip_generation_filter value) noexcept
          {
              return value == texture_mip_generation_filter::nearest ? "nearest" : "box";
          }

          std::optional<texture_import_preset>''',
          '''std::string_view texture_mip_generation_filter_name(texture_mip_generation_filter value) noexcept
          {
              return value == texture_mip_generation_filter::nearest ? "nearest" : "box";
          }
          std::string_view texture_channel_source_name(texture_channel_source value) noexcept
          {
              switch (value)
              {
                  case texture_channel_source::red: return "red";
                  case texture_channel_source::green: return "green";
                  case texture_channel_source::blue: return "blue";
                  case texture_channel_source::alpha: return "alpha";
                  case texture_channel_source::zero: return "zero";
                  case texture_channel_source::one: return "one";
              }
              return "zero";
          }

          std::optional<texture_import_preset>''')
          replace_once(path,
          '''std::optional<texture_mip_generation_filter> parse_texture_mip_generation_filter(std::string_view value) noexcept
          {
              return enum_value<texture_mip_generation_filter>(
                  value, {{"box", texture_mip_generation_filter::box}, {"nearest", texture_mip_generation_filter::nearest}});
          }

          texture_import_settings texture_import_settings_for_preset''',
          '''std::optional<texture_mip_generation_filter> parse_texture_mip_generation_filter(std::string_view value) noexcept
          {
              return enum_value<texture_mip_generation_filter>(
                  value, {{"box", texture_mip_generation_filter::box}, {"nearest", texture_mip_generation_filter::nearest}});
          }
          std::optional<texture_channel_source> parse_texture_channel_source(std::string_view value) noexcept
          {
              return enum_value<texture_channel_source>(value, {{"red", texture_channel_source::red},
                                                                {"green", texture_channel_source::green},
                                                                {"blue", texture_channel_source::blue},
                                                                {"alpha", texture_channel_source::alpha},
                                                                {"zero", texture_channel_source::zero},
                                                                {"one", texture_channel_source::one}});
          }

          texture_import_settings texture_import_settings_for_preset''')
          replace_once(path,
          '''    if (const auto error = parse_string_field("mipGenerationFilter", parse_texture_mip_generation_filter,
                                                        settings.mip_generation_filter))
              return texture_import_settings_result::failure(*error);
              settings.max_size = document.value("maxSize", settings.max_size);''',
          '''    if (const auto error = parse_string_field("mipGenerationFilter", parse_texture_mip_generation_filter,
                                                        settings.mip_generation_filter))
              return texture_import_settings_result::failure(*error);
              if (settings_version >= 5)
              {
                  if (const auto error = parse_string_field("channelR", parse_texture_channel_source, settings.channel_r))
                      return texture_import_settings_result::failure(*error);
                  if (const auto error = parse_string_field("channelG", parse_texture_channel_source, settings.channel_g))
                      return texture_import_settings_result::failure(*error);
                  if (const auto error = parse_string_field("channelB", parse_texture_channel_source, settings.channel_b))
                      return texture_import_settings_result::failure(*error);
                  if (const auto error = parse_string_field("channelA", parse_texture_channel_source, settings.channel_a))
                      return texture_import_settings_result::failure(*error);
                  settings.brightness = document.value("brightness", settings.brightness);
                  settings.gamma = document.value("gamma", settings.gamma);
                  settings.contrast = document.value("contrast", settings.contrast);
                  settings.saturation = document.value("saturation", settings.saturation);
                  settings.vibrance = document.value("vibrance", settings.vibrance);
                  settings.tint_r = document.value("tintR", settings.tint_r);
                  settings.tint_g = document.value("tintG", settings.tint_g);
                  settings.tint_b = document.value("tintB", settings.tint_b);
                  settings.input_black = document.value("inputBlack", settings.input_black);
                  settings.input_white = document.value("inputWhite", settings.input_white);
                  settings.output_black = document.value("outputBlack", settings.output_black);
                  settings.output_white = document.value("outputWhite", settings.output_white);
                  settings.invert_r = document.value("invertR", settings.invert_r);
                  settings.invert_g = document.value("invertG", settings.invert_g);
                  settings.invert_b = document.value("invertB", settings.invert_b);
                  settings.invert_a = document.value("invertA", settings.invert_a);
              }
              settings.max_size = document.value("maxSize", settings.max_size);''')
          replace_once(path,
          '''        settings.maximum_lod < settings.minimum_lod || !std::isfinite(settings.alpha_coverage_threshold) ||
                  settings.alpha_coverage_threshold < 0.0f || settings.alpha_coverage_threshold > 1.0f)
              return texture_import_settings_result::failure("texture import settings contain an invalid numeric value");''',
          '''        settings.maximum_lod < settings.minimum_lod || !std::isfinite(settings.alpha_coverage_threshold) ||
                  settings.alpha_coverage_threshold < 0.0f || settings.alpha_coverage_threshold > 1.0f ||
                  !std::isfinite(settings.brightness) || settings.brightness < -8.0f || settings.brightness > 8.0f ||
                  !std::isfinite(settings.gamma) || settings.gamma < 0.05f || settings.gamma > 8.0f ||
                  !std::isfinite(settings.contrast) || settings.contrast < 0.0f || settings.contrast > 4.0f ||
                  !std::isfinite(settings.saturation) || settings.saturation < 0.0f || settings.saturation > 4.0f ||
                  !std::isfinite(settings.vibrance) || settings.vibrance < -1.0f || settings.vibrance > 1.0f ||
                  !std::isfinite(settings.tint_r) || !std::isfinite(settings.tint_g) || !std::isfinite(settings.tint_b) ||
                  settings.tint_r < 0.0f || settings.tint_r > 4.0f || settings.tint_g < 0.0f || settings.tint_g > 4.0f ||
                  settings.tint_b < 0.0f || settings.tint_b > 4.0f || !std::isfinite(settings.input_black) ||
                  !std::isfinite(settings.input_white) || settings.input_black < 0.0f || settings.input_white > 1.0f ||
                  settings.input_white <= settings.input_black || !std::isfinite(settings.output_black) ||
                  !std::isfinite(settings.output_white) || settings.output_black < 0.0f || settings.output_white > 1.0f ||
                  settings.output_white < settings.output_black)
              return texture_import_settings_result::failure("texture import settings contain an invalid numeric value");''')
          replace_once(path,
          '''    return json{{"alphaCoverageThreshold", settings.alpha_coverage_threshold},
                          {"anisotropy", settings.anisotropy},''',
          '''    return json{{"alphaCoverageThreshold", settings.alpha_coverage_threshold},
                          {"anisotropy", settings.anisotropy},
                          {"brightness", settings.brightness},
                          {"channelA", texture_channel_source_name(settings.channel_a)},
                          {"channelB", texture_channel_source_name(settings.channel_b)},
                          {"channelG", texture_channel_source_name(settings.channel_g)},
                          {"channelR", texture_channel_source_name(settings.channel_r)},''')
          replace_once(path,
          '''                {"compression", texture_compression_policy_name(settings.compression)},
                          {"generateMips", settings.generate_mips},''',
          '''                {"compression", texture_compression_policy_name(settings.compression)},
                          {"contrast", settings.contrast},
                          {"gamma", settings.gamma},
                          {"generateMips", settings.generate_mips},
                          {"inputBlack", settings.input_black},
                          {"inputWhite", settings.input_white},
                          {"invertA", settings.invert_a},
                          {"invertB", settings.invert_b},
                          {"invertG", settings.invert_g},
                          {"invertR", settings.invert_r},''')
          replace_once(path,
          '''                {"powerOfTwo", texture_power_of_two_policy_name(settings.power_of_two)},
                          {"preset", texture_import_preset_name(settings.preset)},''',
          '''                {"outputBlack", settings.output_black},
                          {"outputWhite", settings.output_white},
                          {"powerOfTwo", texture_power_of_two_policy_name(settings.power_of_two)},
                          {"preset", texture_import_preset_name(settings.preset)},''')
          replace_once(path,
          '''                {"semantic", texture_semantic_name(settings.semantic)},
                          {"streamingMode", texture_streaming_mode_name(settings.streaming_mode)},''',
          '''                {"saturation", settings.saturation},
                          {"semantic", texture_semantic_name(settings.semantic)},
                          {"streamingMode", texture_streaming_mode_name(settings.streaming_mode)},
                          {"tintB", settings.tint_b},
                          {"tintG", settings.tint_g},
                          {"tintR", settings.tint_r},
                          {"vibrance", settings.vibrance},''')
          replace_once(path,
          '''        auto level = desired_width == texture.width && desired_height == texture.height
                               ? std::vector<std::byte>(base.begin(), base.end())
                               : resize_rgba8(base, texture.width, texture.height, desired_width, desired_height);
                  texture.width = desired_width;''',
          '''        auto level = desired_width == texture.width && desired_height == texture.height
                               ? std::vector<std::byte>(base.begin(), base.end())
                               : resize_rgba8(base, texture.width, texture.height, desired_width, desired_height);
                  apply_stage3_rgba8(level, settings);
                  texture.width = desired_width;''')
          replace_once(path, '.version = 4,', '.version = 5,')
          replace_once(path, 'return "arc-texture-cooker-v4:arctex-v2:deterministic-preprocessing:sampling-policy";',
                       'return "arc-texture-cooker-v5:arctex-v2:stage3-adjustments:channel-mapping";')

          # Host protocol and bridge fields.
          path = 'editor/native/inc/arc/editor/host_protocol_base.h'
          replace_once(path,
          '''    std::string mip_generation_filter;
              std::optional<std::uint32_t> max_size;''',
          '''    std::string mip_generation_filter;
              std::string channel_r;
              std::string channel_g;
              std::string channel_b;
              std::string channel_a;
              std::optional<std::uint32_t> max_size;''')
          replace_once(path,
          '''    std::optional<float> alpha_coverage_threshold;
              std::optional<bool> generate_mips;''',
          '''    std::optional<float> alpha_coverage_threshold;
              std::optional<float> brightness;
              std::optional<float> gamma;
              std::optional<float> contrast;
              std::optional<float> saturation;
              std::optional<float> vibrance;
              std::optional<float> tint_r;
              std::optional<float> tint_g;
              std::optional<float> tint_b;
              std::optional<float> input_black;
              std::optional<float> input_white;
              std::optional<float> output_black;
              std::optional<float> output_white;
              std::optional<bool> invert_r;
              std::optional<bool> invert_g;
              std::optional<bool> invert_b;
              std::optional<bool> invert_a;
              std::optional<bool> generate_mips;''')

          path = 'editor/native/src/host_protocol_base.inc'
          replace_once(path,
          '''            string_value(payload, "mipGenerationFilter", command.mip_generation_filter);
                      const auto optional_number''',
          '''            string_value(payload, "mipGenerationFilter", command.mip_generation_filter);
                      string_value(payload, "channelR", command.channel_r);
                      string_value(payload, "channelG", command.channel_g);
                      string_value(payload, "channelB", command.channel_b);
                      string_value(payload, "channelA", command.channel_a);
                      const auto optional_number''')
          replace_once(path,
          '''                !optional_number("alphaCoverageThreshold", command.alpha_coverage_threshold) ||
                          !optional_bool("generateMips", command.generate_mips) ||''',
          '''                !optional_number("alphaCoverageThreshold", command.alpha_coverage_threshold) ||
                          !optional_number("brightness", command.brightness) || !optional_number("gamma", command.gamma) ||
                          !optional_number("contrast", command.contrast) || !optional_number("saturation", command.saturation) ||
                          !optional_number("vibrance", command.vibrance) || !optional_number("tintR", command.tint_r) ||
                          !optional_number("tintG", command.tint_g) || !optional_number("tintB", command.tint_b) ||
                          !optional_number("inputBlack", command.input_black) || !optional_number("inputWhite", command.input_white) ||
                          !optional_number("outputBlack", command.output_black) || !optional_number("outputWhite", command.output_white) ||
                          !optional_bool("invertR", command.invert_r) || !optional_bool("invertG", command.invert_g) ||
                          !optional_bool("invertB", command.invert_b) || !optional_bool("invertA", command.invert_a) ||
                          !optional_bool("generateMips", command.generate_mips) ||''')
          replace_once(path,
          '''                command.wrap_u.empty() && command.wrap_v.empty() && command.mip_generation_filter.empty() &&
                          !command.max_size''',
          '''                command.wrap_u.empty() && command.wrap_v.empty() && command.mip_generation_filter.empty() &&
                          command.channel_r.empty() && command.channel_g.empty() && command.channel_b.empty() && command.channel_a.empty() &&
                          !command.max_size''')
          replace_once(path,
          '''                !command.maximum_lod && !command.alpha_coverage_threshold && !command.generate_mips &&
                          !command.preserve_alpha_coverage)''',
          '''                !command.maximum_lod && !command.alpha_coverage_threshold && !command.brightness && !command.gamma &&
                          !command.contrast && !command.saturation && !command.vibrance && !command.tint_r && !command.tint_g &&
                          !command.tint_b && !command.input_black && !command.input_white && !command.output_black &&
                          !command.output_white && !command.invert_r && !command.invert_g && !command.invert_b && !command.invert_a &&
                          !command.generate_mips && !command.preserve_alpha_coverage)''')

          path = 'editor/native/src/arc_host_base.inc'
          replace_once(path,
          '''                        !parse_setting(payload.mip_generation_filter,
                                             render::tools::parse_texture_mip_generation_filter,
                                             settings.mip_generation_filter))''',
          '''                        !parse_setting(payload.mip_generation_filter,
                                             render::tools::parse_texture_mip_generation_filter,
                                             settings.mip_generation_filter) ||
                              !parse_setting(payload.channel_r, render::tools::parse_texture_channel_source, settings.channel_r) ||
                              !parse_setting(payload.channel_g, render::tools::parse_texture_channel_source, settings.channel_g) ||
                              !parse_setting(payload.channel_b, render::tools::parse_texture_channel_source, settings.channel_b) ||
                              !parse_setting(payload.channel_a, render::tools::parse_texture_channel_source, settings.channel_a))''')
          replace_once(path,
          '''                    if (payload.alpha_coverage_threshold)
                              settings.alpha_coverage_threshold = *payload.alpha_coverage_threshold;
                          if (payload.generate_mips)''',
          '''                    if (payload.alpha_coverage_threshold)
                              settings.alpha_coverage_threshold = *payload.alpha_coverage_threshold;
                          if (payload.brightness) settings.brightness = *payload.brightness;
                          if (payload.gamma) settings.gamma = *payload.gamma;
                          if (payload.contrast) settings.contrast = *payload.contrast;
                          if (payload.saturation) settings.saturation = *payload.saturation;
                          if (payload.vibrance) settings.vibrance = *payload.vibrance;
                          if (payload.tint_r) settings.tint_r = *payload.tint_r;
                          if (payload.tint_g) settings.tint_g = *payload.tint_g;
                          if (payload.tint_b) settings.tint_b = *payload.tint_b;
                          if (payload.input_black) settings.input_black = *payload.input_black;
                          if (payload.input_white) settings.input_white = *payload.input_white;
                          if (payload.output_black) settings.output_black = *payload.output_black;
                          if (payload.output_white) settings.output_white = *payload.output_white;
                          if (payload.invert_r) settings.invert_r = *payload.invert_r;
                          if (payload.invert_g) settings.invert_g = *payload.invert_g;
                          if (payload.invert_b) settings.invert_b = *payload.invert_b;
                          if (payload.invert_a) settings.invert_a = *payload.invert_a;
                          if (payload.generate_mips)''')
          replace_once(path,
          '''                    ",\\\"alphaCoverageThreshold\\\":" + std::to_string(value.alpha_coverage_threshold) +
                              ",\\\"generateMips\\\":"''',
          '''                    ",\\\"alphaCoverageThreshold\\\":" + std::to_string(value.alpha_coverage_threshold) +
                              ",\\\"brightness\\\":" + std::to_string(value.brightness) +
                              ",\\\"gamma\\\":" + std::to_string(value.gamma) +
                              ",\\\"contrast\\\":" + std::to_string(value.contrast) +
                              ",\\\"saturation\\\":" + std::to_string(value.saturation) +
                              ",\\\"vibrance\\\":" + std::to_string(value.vibrance) +
                              ",\\\"tintR\\\":" + std::to_string(value.tint_r) +
                              ",\\\"tintG\\\":" + std::to_string(value.tint_g) +
                              ",\\\"tintB\\\":" + std::to_string(value.tint_b) +
                              ",\\\"inputBlack\\\":" + std::to_string(value.input_black) +
                              ",\\\"inputWhite\\\":" + std::to_string(value.input_white) +
                              ",\\\"outputBlack\\\":" + std::to_string(value.output_black) +
