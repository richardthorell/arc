name: Temporary editor host stall diagnostics
"on":
  push:
    branches: [diagnostics/editor-host-stall-detail-pr]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/editor-host-stall-detail-pr
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply diagnostics patch
        run: python3 .github/scripts/temporary_editor_host_stall_diagnostics.py
      - name: Validate editor TypeScript
        run: |
          npm ci --prefix editor
          npm run typecheck --prefix editor
      - name: Validate native host
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B out/build/host-stall-diag -G Ninja -DARC_BUILD_EDITOR=ON -DARC_BUILD_RENDER_VULKAN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/host-stall-diag --target arc_host_process --parallel 2
      - name: Commit diagnostics
        run: |
          rm .github/workflows/temporary-editor-host-stall-diagnostics.yml .github/scripts/temporary_editor_host_stall_diagnostics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add detailed editor host stall diagnostics'
          git push
