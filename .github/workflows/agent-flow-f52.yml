name: Apply Flow F5.2

on:
  push:
    branches:
      - feature/flow-f52-structural-entity-nodes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flow-f52-structural-entity-nodes
          fetch-depth: 0
      - name: Apply F5.2 source changes
        run: python3 .github/scripts/apply_flow_f52.py
      - name: Commit implementation
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/flow engine/flow docs/editor/flow-graph.md
          git commit -m "flow: implement F5.2 structural entity nodes"
          git push origin HEAD:feature/flow-f52-structural-entity-nodes
