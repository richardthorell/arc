name: Apply Flow F5.2

on:
  push:
    branches:
      - feature/flow-f52-structural-entity-nodes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/flow-f52-structural-entity-nodes
          fetch-depth: 0
      - name: Apply F5.2 source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Editor node catalog and defaults.
          path = 'editor/src/renderer/src/flow/flowGraphTypes.ts'
          replace_once(path,
          "  | 'selfEntity'\n  | 'isEntityAlive'",
          "  | 'selfEntity'\n  | 'createEntity'\n  | 'destroyEntity'\n  | 'hasCoreComponent'\n  | 'removeCoreComponent'\n  | 'isEntityAlive'")
          replace_once(path,
          "  'Lifecycle' | 'Update' | 'Actions' | 'Branching' | 'Identity' | 'State' | 'Transform' | 'Literals';",
          "  'Lifecycle' | 'Update' | 'Actions' | 'Branching' | 'Identity' | 'Lifetime' | 'State' | 'Transform' | 'Literals';")
          replace_once(path,
          "  isEntityAlive: {\n    type: 'isEntityAlive',",
          "  createEntity: {\n    type: 'createEntity',\n    title: 'Create Entity',\n    category: 'Entity',\n    subcategory: 'Lifetime',\n    inputs: [execution('exec', 'In')],\n    outputs: [execution('then', 'Then'), value('entity', 'Entity', 'entity')],\n  },\n  destroyEntity: {\n    type: 'destroyEntity',\n    title: 'Destroy Entity',\n    category: 'Entity',\n    subcategory: 'Lifetime',\n    inputs: [execution('exec', 'In'), value('entity', 'Entity', 'entity')],\n    outputs: [execution('then', 'Then')],\n  },\n  hasCoreComponent: {\n    type: 'hasCoreComponent',\n    title: 'Has Component',\n    category: 'Components',\n    subcategory: 'State',\n    inputs: [execution('exec', 'In'), value('entity', 'Entity', 'entity')],\n    outputs: [execution('then', 'Then'), value('has', 'Has', 'bool')],\n  },\n  removeCoreComponent: {\n    type: 'removeCoreComponent',\n    title: 'Remove Component',\n    category: 'Components',\n    subcategory: 'State',\n    inputs: [execution('exec', 'In'), value('entity', 'Entity', 'entity')],\n    outputs: [execution('then', 'Then')],\n  },\n  isEntityAlive: {\n    type: 'isEntityAlive',")
          replace_once(path,
          "    case 'boolLiteral':\n      return { value: false };",
          "    case 'hasCoreComponent':\n    case 'removeCoreComponent':\n      return { component: 'transform' };\n    case 'boolLiteral':\n      return { value: false };")

          # Inline component selector.
          path = 'editor/src/renderer/src/flow/FlowGraphEditor.tsx'
          replace_once(path,
          "  const setNodeValue = useCallback(\n    (nodeId: string, value: unknown) =>\n      mutate((next) => {\n        const target = next.nodes.find((candidate) => candidate.id === nodeId);\n        if (target) target.values.value = value;\n      }),\n    [mutate],\n  );",
          "  const setNodeValue = useCallback(\n    (nodeId: string, value: unknown) =>\n      mutate((next) => {\n        const target = next.nodes.find((candidate) => candidate.id === nodeId);\n        if (target) target.values.value = value;\n      }),\n    [mutate],\n  );\n\n  const setNodeField = useCallback(\n    (nodeId: string, field: string, value: unknown) =>\n      mutate((next) => {\n        const target = next.nodes.find((candidate) => candidate.id === nodeId);\n        if (target) target.values[field] = value;\n      }),\n    [mutate],\n  );")
          replace_once(path,
          "              {node.type === 'boolLiteral' && (",
          "              {(node.type === 'hasCoreComponent' || node.type === 'removeCoreComponent') && (\n                <label className=\"flow-node-inline-value\">\n                  Component\n                  <select\n                    aria-label=\"Core component\"\n                    disabled={document.readOnly}\n                    onChange={(event) => setNodeField(node.id, 'component', event.target.value)}\n                    value={typeof node.values.component === 'string' ? node.values.component : 'transform'}\n                  >\n                    <option value=\"name\">Name</option>\n                    <option value=\"transform\">Transform</option>\n                    <option value=\"tag\">Tag</option>\n                    <option value=\"active\">Active</option>\n                  </select>\n                </label>\n              )}\n\n              {node.type === 'boolLiteral' && (")

          path = 'editor/src/renderer/src/flow/flowEditor.css'
          replace_once(path,
          ".flow-node-inline-value input,\n.flow-variable input,",
          ".flow-node-inline-value input,\n.flow-node-inline-value select,\n.flow-variable input,")
          replace_once(path,
          ".flow-node-inline-value input:focus,\n.flow-variable input:focus,",
          ".flow-node-inline-value input:focus,\n.flow-node-inline-value select:focus,\n.flow-variable input:focus,")

          # Public typed IR contract.
          path = 'engine/flow/inc/arc/flow/flow.h'
          replace_once(path,
          "    self_entity,\n    world_entity_alive,",
          "    self_entity,\n    world_create_entity,\n    world_destroy_entity,\n    world_has_core_component,\n    world_remove_core_component,\n    world_entity_alive,")

          # Compiler parser, validation, IR, and lowering.
          path = 'engine/flow/src/common/flow.cpp'
          replace_once(path,
          "    self_entity,\n    entity_alive,",
          "    self_entity,\n    create_entity,\n    destroy_entity,\n    has_core_component,\n    remove_core_component,\n    entity_alive,")
          replace_once(path,
          "    if (value == \"selfEntity\") return node_kind::self_entity;\n    if (value == \"isEntityAlive\") return node_kind::entity_alive;",
          "    if (value == \"selfEntity\") return node_kind::self_entity;\n    if (value == \"createEntity\") return node_kind::create_entity;\n    if (value == \"destroyEntity\") return node_kind::destroy_entity;\n    if (value == \"hasCoreComponent\") return node_kind::has_core_component;\n    if (value == \"removeCoreComponent\") return node_kind::remove_core_component;\n    if (value == \"isEntityAlive\") return node_kind::entity_alive;")
          replace_once(path,
          "std::optional<value_type> literal_type(node_kind kind)\n{",
          "std::optional<world_core_component> parse_core_component(std::string_view value)\n{\n    if (value == \"name\") return world_core_component::name;\n    if (value == \"transform\") return world_core_component::transform;\n    if (value == \"tag\") return world_core_component::tag;\n    if (value == \"active\") return world_core_component::active;\n    return std::nullopt;\n}\n\nstd::optional<value_type> literal_type(node_kind kind)\n{")
          replace_once(path,
          "        case node_kind::branch:\n        case node_kind::entity_alive:",
          "        case node_kind::branch:\n        case node_kind::create_entity:\n        case node_kind::destroy_entity:\n        case node_kind::has_core_component:\n        case node_kind::remove_core_component:\n        case node_kind::entity_alive:")
          replace_once(path,
          "        case node_kind::self_entity:\n            if (pin == \"entity\") return pin_info{.kind = pin_kind::value, .type = value_type::entity};\n            break;\n        case node_kind::entity_alive:",
          "        case node_kind::self_entity:\n            if (pin == \"entity\") return pin_info{.kind = pin_kind::value, .type = value_type::entity};\n            break;\n        case node_kind::create_entity:\n            if (pin == \"then\") return pin_info{.kind = pin_kind::execution};\n            if (pin == \"entity\") return pin_info{.kind = pin_kind::value, .type = value_type::entity};\n            break;\n        case node_kind::destroy_entity:\n        case node_kind::remove_core_component:\n            if (pin == \"then\") return pin_info{.kind = pin_kind::execution};\n            break;\n        case node_kind::has_core_component:\n            if (pin == \"then\") return pin_info{.kind = pin_kind::execution};\n            if (pin == \"has\") return pin_info{.kind = pin_kind::value, .type = value_type::boolean};\n            break;\n        case node_kind::entity_alive:")
          replace_once(path,
          "    if (!is_executable_node(kind)) return std::nullopt;\n    if (pin == \"exec\") return pin_info{.kind = pin_kind::execution};\n    if (pin == \"entity\") return pin_info{.kind = pin_kind::value, .type = value_type::entity};",
          "    if (!is_executable_node(kind)) return std::nullopt;\n    if (pin == \"exec\") return pin_info{.kind = pin_kind::execution};\n    if (kind != node_kind::create_entity && pin == \"entity\")\n        return pin_info{.kind = pin_kind::value, .type = value_type::entity};")
          replace_once(path,
          "        if (const auto type = literal_type(node.kind))\n        {",
          "        if (node.kind == node_kind::has_core_component || node.kind == node_kind::remove_core_component)\n        {\n            const auto component = node.values.find(\"component\");\n            if (component == node.values.end() || !component->is_string() ||\n                !parse_core_component(component->get<std::string>()))\n                add_diagnostic(diagnostics, diagnostic_severity::error, \"FLOW_CORE_COMPONENT\",\n                               \"Core-component nodes require one of name, transform, tag, or active.\", node.id,\n                               \"component\");\n        }\n\n        if (const auto type = literal_type(node.kind))\n        {")
          replace_once(path,
          "            case node_kind::entity_alive:\n            case node_kind::get_name:",
          "            case node_kind::destroy_entity:\n            case node_kind::has_core_component:\n            case node_kind::remove_core_component:\n            case node_kind::entity_alive:\n            case node_kind::get_name:")
          replace_once(path,
          "        case node_kind::branch:\n            return ir_opcode::branch;\n        case node_kind::entity_alive:",
          "        case node_kind::branch:\n            return ir_opcode::branch;\n        case node_kind::create_entity:\n            return ir_opcode::world_create_entity;\n        case node_kind::destroy_entity:\n            return ir_opcode::world_destroy_entity;\n        case node_kind::has_core_component:\n            return ir_opcode::world_has_core_component;\n        case node_kind::remove_core_component:\n            return ir_opcode::world_remove_core_component;\n        case node_kind::entity_alive:")
          replace_once(path,
          "            case node_kind::self_entity:\n                allocate_slot(*node, \"entity\", value_type::entity, default_value(value_type::entity));\n                break;\n            case node_kind::entity_alive:",
          "            case node_kind::self_entity:\n            case node_kind::create_entity:\n                allocate_slot(*node, \"entity\", value_type::entity, default_value(value_type::entity));\n                break;\n            case node_kind::has_core_component:\n                allocate_slot(*node, \"has\", value_type::boolean, false);\n                break;\n            case node_kind::entity_alive:")
          replace_once(path,
          "            case node_kind::entity_alive:\n                instruction.operand0 = input_slot(*node, \"entity\");",
          "            case node_kind::create_entity:\n                instruction.operand0 = value_slots.at(pin_key(node->id, \"entity\"));\n                instruction.operand1 = execution_target(*node, \"then\");\n                break;\n            case node_kind::destroy_entity:\n                instruction.operand0 = input_slot(*node, \"entity\");\n                instruction.operand1 = execution_target(*node, \"then\");\n                break;\n            case node_kind::has_core_component:\n                instruction.operand0 = input_slot(*node, \"entity\");\n                instruction.operand1 = static_cast<std::uint32_t>(\n                    *parse_core_component(node->values.at(\"component\").get<std::string>()));\n                instruction.operand2 = value_slots.at(pin_key(node->id, \"has\"));\n                instruction.operand3 = execution_target(*node, \"then\");\n                break;\n            case node_kind::remove_core_component:\n                instruction.operand0 = input_slot(*node, \"entity\");\n                instruction.operand1 = static_cast<std::uint32_t>(\n                    *parse_core_component(node->values.at(\"component\").get<std::string>()));\n                instruction.operand2 = execution_target(*node, \"then\");\n                break;\n            case node_kind::entity_alive:\n                instruction.operand0 = input_slot(*node, \"entity\");")
          replace_once(path,
          "        case ir_opcode::self_entity:\n            return bytecode_opcode::self_entity;\n        case ir_opcode::world_entity_alive:",
          "        case ir_opcode::self_entity:\n            return bytecode_opcode::self_entity;\n        case ir_opcode::world_create_entity:\n            return bytecode_opcode::world_create_entity;\n        case ir_opcode::world_destroy_entity:\n            return bytecode_opcode::world_destroy_entity;\n        case ir_opcode::world_has_core_component:\n            return bytecode_opcode::world_has_core_component;\n        case ir_opcode::world_remove_core_component:\n            return bytecode_opcode::world_remove_core_component;\n        case ir_opcode::world_entity_alive:")

          # Editor/domain regression tests.
          path = 'editor/src/renderer/src/flow/flowGraphTypes.test.ts'
          replace_once(path,
          "  it('rejects connections that reference missing nodes', () => {",
          "  it('creates structural gameplay nodes with stable defaults', () => {\n    const create = createFlowNode('createEntity', [0, 0]);\n    const hasComponent = createFlowNode('hasCoreComponent', [200, 0]);\n    const removeComponent = createFlowNode('removeCoreComponent', [400, 0]);\n\n    expect(create.values).toEqual({});\n    expect(hasComponent.values.component).toBe('transform');\n    expect(removeComponent.values.component).toBe('transform');\n  });\n\n  it('rejects connections that reference missing nodes', () => {")

          path = 'editor/src/renderer/src/flow/flowGraphDomain.test.ts'
          replace_once(path,
          "  it('allows execution between different nodes', () => {",
          "  it('connects deferred entity outputs to structural gameplay writes', () => {\n    const create = createFlowNode('createEntity', [0, 0]);\n    const destroy = createFlowNode('destroyEntity', [300, 0]);\n    const entity = flowNodeDefinitions.createEntity.outputs.find((pin) => pin.id === 'entity')!;\n    const target = flowNodeDefinitions.destroyEntity.inputs.find((pin) => pin.id === 'entity')!;\n\n    expect(\n      flowGraphDomain.canConnect(\n        { node: create, pin: entity, direction: 'output' },\n        { node: destroy, pin: target, direction: 'input' },\n      ).allowed,\n    ).toBe(true);\n  });\n\n  it('allows execution between different nodes', () => {")

          path = 'editor/src/renderer/src/flow/FlowGraphEditor.test.tsx'
          replace_once(path,
          "  it('does not mutate a read-only Flow graph', () => {",
          "  it('edits the selected core component on structural nodes', () => {\n    const graph = createDefaultFlowGraph();\n    graph.nodes.push({\n      id: 'remove-component',\n      type: 'removeCoreComponent',\n      position: [320, 140],\n      values: { component: 'transform' },\n    });\n    render(<FlowGraphEditor document={document} graph={graph} />);\n\n    fireEvent.change(screen.getByRole('combobox', { name: 'Core component' }), { target: { value: 'tag' } });\n\n    expect(flowState.replaceFlowGraph).toHaveBeenCalledTimes(1);\n    const nextGraph = flowState.replaceFlowGraph.mock.calls[0][1];\n    expect(nextGraph.nodes.find((node: { id: string }) => node.id === 'remove-component').values.component).toBe('tag');\n  });\n\n  it('does not mutate a read-only Flow graph', () => {")

          # Native compiler coverage, including deferred create -> structural write.
          path = 'engine/flow/tests/flow_gameplay_compile_tests.cpp'
          p = Path(path)
          text = p.read_text()
          marker = "\n}\n"
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('could not find flow gameplay test function terminator')
          addition = r'''

    {
        const compile_result result = compile_asset(R"json({
            "version": 1,
            "assetType": "flow",
            "name": "CreateAndName",
            "graph": {
                "version": 1,
                "variables": [],
                "nodes": [
                    {"id": "begin", "type": "beginPlay", "position": [0, 0], "values": {}},
                    {"id": "create", "type": "createEntity", "position": [220, 0], "values": {}},
                    {"id": "name", "type": "stringLiteral", "position": [220, 180], "values": {"value": "Spawned"}},
                    {"id": "set", "type": "setName", "position": [460, 0], "values": {}}
                ],
                "connections": [
                    {"id": "e1", "kind": "execution", "from": {"nodeId": "begin", "pin": "exec"}, "to": {"nodeId": "create", "pin": "exec"}},
                    {"id": "e2", "kind": "execution", "from": {"nodeId": "create", "pin": "then"}, "to": {"nodeId": "set", "pin": "exec"}},
                    {"id": "v1", "kind": "value", "from": {"nodeId": "create", "pin": "entity"}, "to": {"nodeId": "set", "pin": "entity"}},
                    {"id": "v2", "kind": "value", "from": {"nodeId": "name", "pin": "value"}, "to": {"nodeId": "set", "pin": "name"}}
                ],
                "viewport": {"x": 0, "y": 0, "zoom": 1}
            }
        })json");

        assert(result.succeeded && result.ir && result.bytecode);
        [[maybe_unused]] const std::uint32_t entity_slot = find_slot(*result.ir, "create", "entity");
        assert(result.bytecode->instructions.size() == 2);
        assert(result.bytecode->entry_points[0].instruction == 0);
        assert(result.bytecode->instructions[0].opcode == bytecode_opcode::world_create_entity);
        assert(result.bytecode->instructions[0].operand0 == entity_slot);
        assert(result.bytecode->instructions[0].operand1 == 1);
        assert(result.bytecode->instructions[1].opcode == bytecode_opcode::world_set_name);
        assert(result.bytecode->instructions[1].operand0 == entity_slot);
    }

    {
        const compile_result result = compile_asset(R"json({
            "version": 1,
            "assetType": "flow",
            "name": "CoreComponents",
            "graph": {
                "version": 1,
                "variables": [],
                "nodes": [
                    {"id": "begin", "type": "beginPlay", "position": [0, 0], "values": {}},
                    {"id": "self", "type": "selfEntity", "position": [0, 160], "values": {}},
                    {"id": "has", "type": "hasCoreComponent", "position": [240, 0], "values": {"component": "tag"}},
                    {"id": "remove", "type": "removeCoreComponent", "position": [480, 0], "values": {"component": "tag"}}
                ],
                "connections": [
                    {"id": "e1", "kind": "execution", "from": {"nodeId": "begin", "pin": "exec"}, "to": {"nodeId": "has", "pin": "exec"}},
                    {"id": "e2", "kind": "execution", "from": {"nodeId": "has", "pin": "then"}, "to": {"nodeId": "remove", "pin": "exec"}},
                    {"id": "v1", "kind": "value", "from": {"nodeId": "self", "pin": "entity"}, "to": {"nodeId": "has", "pin": "entity"}},
                    {"id": "v2", "kind": "value", "from": {"nodeId": "self", "pin": "entity"}, "to": {"nodeId": "remove", "pin": "entity"}}
                ],
                "viewport": {"x": 0, "y": 0, "zoom": 1}
            }
        })json");

        assert(result.succeeded && result.bytecode);
        [[maybe_unused]] const auto has = std::find_if(
            result.bytecode->instructions.begin(), result.bytecode->instructions.end(),
            [](const bytecode_instruction& instruction) { return instruction.opcode == bytecode_opcode::world_has_core_component; });
        [[maybe_unused]] const auto remove = std::find_if(
            result.bytecode->instructions.begin(), result.bytecode->instructions.end(),
            [](const bytecode_instruction& instruction)
            { return instruction.opcode == bytecode_opcode::world_remove_core_component; });
        assert(has != result.bytecode->instructions.end());
        assert(remove != result.bytecode->instructions.end());
        assert(has->operand1 == static_cast<std::uint32_t>(world_core_component::tag));
        assert(remove->operand1 == static_cast<std::uint32_t>(world_core_component::tag));
    }

    {
        const compile_result result = compile_asset(R"json({
            "version": 1,
            "assetType": "flow",
            "name": "BadComponent",
            "graph": {
                "version": 1,
                "variables": [],
                "nodes": [
                    {"id": "begin", "type": "beginPlay", "position": [0, 0], "values": {}},
                    {"id": "self", "type": "selfEntity", "position": [0, 120], "values": {}},
                    {"id": "remove", "type": "removeCoreComponent", "position": [240, 0], "values": {"component": "physics"}}
                ],
                "connections": [
                    {"id": "e1", "kind": "execution", "from": {"nodeId": "begin", "pin": "exec"}, "to": {"nodeId": "remove", "pin": "exec"}},
                    {"id": "v1", "kind": "value", "from": {"nodeId": "self", "pin": "entity"}, "to": {"nodeId": "remove", "pin": "entity"}}
                ],
                "viewport": {"x": 0, "y": 0, "zoom": 1}
            }
        })json");

        assert(!result.succeeded);
        assert(has_code(result, "FLOW_CORE_COMPONENT"));
    }
'''
          p.write_text(text[:pos] + addition + text[pos:])

          # Documentation.
          path = 'docs/editor/flow-graph.md'
          p = Path(path)
          text = p.read_text()
          anchor = "## Runtime boundary\n"
          if anchor not in text:
              raise SystemExit('missing Flow runtime boundary anchor')
          section = '''## F5.2 structural entity authoring\n\nF5.2 exposes the structural F4 world instructions as authored Flow nodes: Create Entity, Destroy Entity, Has Component, and Remove Component. Has/Remove currently target ARC core components (`Name`, `Transform`, `Tag`, and `Active`) through an inline component selector.\n\nCreate Entity writes the M3.5 entity target into a typed Flow entity slot. During scheduled gameplay this may be a deferred target; downstream structural nodes and existing setters consume that same slot without forcing a premature ECS commit. This makes graphs such as `Begin Play -> Create Entity -> Set Name -> Set Transform` valid within one dispatch.\n\nReads that require committed world state, including Has Component and the existing Get/Alive nodes, still require an immediate entity at runtime. Flow preserves that M3.5 distinction rather than silently resolving deferred entities.\n\n'''
          p.write_text(text.replace(anchor, section + anchor, 1))
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/flow engine/flow docs/editor/flow-graph.md
          git commit -m "flow: implement F5.2 structural entity nodes"
          git push origin HEAD:feature/flow-f52-structural-entity-nodes
