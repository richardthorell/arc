name: C9.4b Temporary Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  print-formatted-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Format and emit patch content
        working-directory: editor
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx prettier --write src/main/livePlayContentPublication.ts src/main/livePlayContentPublication.test.ts src/main/main.ts
          echo 'ARC_PRETTIER_COORD_BEGIN'
          base64 -w0 src/main/livePlayContentPublication.ts
          echo
          echo 'ARC_PRETTIER_COORD_END'
          echo 'ARC_PRETTIER_TEST_BEGIN'
          base64 -w0 src/main/livePlayContentPublication.test.ts
          echo
          echo 'ARC_PRETTIER_TEST_END'
          echo 'ARC_PRETTIER_MAIN_DIFF_BEGIN'
          git diff -- src/main/main.ts || true
          echo 'ARC_PRETTIER_MAIN_DIFF_END'
