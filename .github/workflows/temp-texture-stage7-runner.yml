name: Temporary Texture Stage 7 Runner

on:
  push:
    branches:
      - feat/texture-streaming-stage7
    paths:
      - .github/workflows/temp-texture-stage7-runner.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/texture-streaming-stage7
          fetch-depth: 0
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          workflow = Path('.github/workflows/temp-texture-stage7.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('Stage 7 implementation script not found')
          lines = match.group(1).splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/stage7.py').write_text(script)
          subprocess.run(['python3', '/tmp/stage7.py'], check=True)
          PY
          rm .github/workflows/temp-texture-stage7.yml .github/workflows/temp-texture-stage7-runner.yml
      - name: Format
        run: clang-format -i engine/render/inc/arc/render/texture_streaming.h engine/render/src/common/texture_streaming.cpp engine/render/tests/texture_streaming_tests.cpp
      - name: Configure
        run: cmake -S . -B out/build/stage7 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DARC_BUILD_RENDER_VULKAN=OFF -DARC_BUILD_ENGINE_TESTS=ON -DARC_BUILD_EDITOR=OFF
      - name: Build
        run: cmake --build out/build/stage7 --target arc_render_tests -j2
      - name: Test
        run: ctest --test-dir out/build/stage7 -R arc_render_tests --output-on-failure
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Stage 7 texture residency foundation"
          git push origin HEAD:feat/texture-streaming-stage7
