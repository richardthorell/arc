name: Temporary Main Formatting Fix

on:
  push:
    branches:
      - fix/main-code-quality-formatting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Format failing native files
        run: |
          clang-format-18 -i \
            engine/render/inc/arc/render/texture_streaming.h \
            engine/render/src/common/texture_artifact.cpp \
            engine/render/src/common/texture_streaming.cpp \
            engine/render/src/common/texture_streaming_io.cpp \
            engine/render/tests/texture_streaming_tests.cpp \
            engine/render-vulkan/src/vulkan_backend.cpp

      - name: Verify formatting
        run: python3 tools/check_format.py --clang-format clang-format-18

      - name: Remove temporary workflow
        run: rm .github/workflows/temp-fix-main-formatting.yml

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/render/inc/arc/render/texture_streaming.h \
                  engine/render/src/common/texture_artifact.cpp \
                  engine/render/src/common/texture_streaming.cpp \
                  engine/render/src/common/texture_streaming_io.cpp \
                  engine/render/tests/texture_streaming_tests.cpp \
                  engine/render-vulkan/src/vulkan_backend.cpp \
                  .github/workflows/temp-fix-main-formatting.yml
          git commit -m "Fix native clang-format violations"
          git push
