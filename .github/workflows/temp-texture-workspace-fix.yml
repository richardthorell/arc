name: Temp Texture Workspace Fix

on:
  push:
    branches: [feat/texture-editor-view]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/texture-editor-view
          fetch-depth: 0
      - name: Make texture editor document-owned
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/src/renderer/src/layout/WorkspaceDock.tsx')
          text = path.read_text()
          old = """  if (kind === 'shader' || kind === 'material') {\n    // Asset editors own the complete document workspace. Shader and Material\n    // currently compose their document-specific supporting regions internally,\n"""
          new = """  if (kind === 'shader' || kind === 'material' || kind === 'texture') {\n    // Asset editors own the complete document workspace. Shader, Material, and Texture\n    // currently compose their document-specific supporting regions internally,\n"""
          if old not in text:
              raise SystemExit('expected WorkspaceDock editor-workspace block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/temp-texture-workspace-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor/src/renderer/src/layout/WorkspaceDock.tsx .github/workflows/temp-texture-workspace-fix.yml
          git commit -m 'Fix texture editor workspace ownership'
          git push origin HEAD:feat/texture-editor-view
