name: Apply Material Preview Selection Fix

on:
  push:
    branches: [fix/material-preview-disable-selection-overlays]
    paths: [.github/workflows/material-preview-selection-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/material-preview-disable-selection-overlays
          fetch-depth: 0
      - name: Apply focused material preview fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('editor/native/src/arc_host_impl.inc')
          text = path.read_text()
          needle = '''                surface.options.overlay = host_overlay_mode::none;
                surface.options.grid = false;
'''
          replacement = '''                surface.options.overlay = host_overlay_mode::none;
                if (surface.preview_kind == asset_preview_kind::material)
                {
                    surface.options.selection_outline = false;
                    surface.options.hover_outline = false;
                    surface.options.selection_bounds = false;
                    surface.options.component_gizmos = false;
                    surface.options.selection_hierarchy = false;
                }
                surface.options.grid = false;
'''
          if text.count(needle) != 1:
              raise SystemExit(f'Expected one material preview option block, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))
          Path('.github/workflows/material-preview-selection-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editor/native/src/arc_host_impl.inc .github/workflows/material-preview-selection-fix.yml
          git commit -m 'fix(material): disable preview selection overlays'
          git push origin HEAD:fix/material-preview-disable-selection-overlays
