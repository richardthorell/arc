name: Temp M3.4 Brush Performance Fix

on:
  push:
    branches: [terrain/m3.4-region-rebuilds]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: terrain/m3.4-region-rebuilds
          fetch-depth: 0
      - name: Apply brush performance fixes
        run: python3 .github/temp_m34_patch.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 gcc-14 g++-14 ninja-build
      - name: Format touched native files
        run: |
          clang-format-18 -i \
            engine/scene/src/common/terrain.cpp \
            engine/scene/src/common/terrain_geometry_proxy.cpp \
            engine/scene/tests/terrain_interaction_performance_tests.cpp \
            editor/native/src/arc_host_base.inc \
            editor/native/src/arc_host_impl.inc \
            editor/native/tests/terrain_rebuild_tests.cpp
          git diff --check
      - name: Configure targeted native build
        run: >
          cmake -S . -B out/build/m34-perf -G Ninja
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARC_BUILD_EDITOR=ON
          -DARC_BUILD_RENDER_VULKAN=OFF
          -DARC_WARNINGS_AS_ERRORS=ON
          -DBUILD_TESTING=ON
      - name: Build terrain and editor tests
        run: cmake --build out/build/m34-perf --target arc_scene_tests arc_editor_host_tests --parallel
      - name: Run focused M3.4 tests
        shell: bash
        run: |
          SCENE_TEST=$(find out/build/m34-perf -type f -name arc_scene_tests -perm -111 | head -n 1)
          EDITOR_TEST=$(find out/build/m34-perf -type f -name arc_editor_host_tests -perm -111 | head -n 1)
          test -n "$SCENE_TEST"
          test -n "$EDITOR_TEST"
          "$SCENE_TEST" "M3.4*"
          "$EDITOR_TEST" "M3.4*"
      - name: Commit validated fix and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/temp-m34-brush-perf.yml .github/temp_m34_patch.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix interactive terrain brush stalls"
          git push origin HEAD:terrain/m3.4-region-rebuilds
