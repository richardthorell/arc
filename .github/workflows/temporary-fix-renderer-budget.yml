name: Temporary renderer budget fix

on:
  push:
    branches:
      - fix/clang-format-main-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clang-format-main-20260830
      - name: Patch remaining uint64_t mismatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/render/src/common/renderer.cpp')
          text = p.read_text()
          old = 'std::min(256ull * mebibyte, texture_gpu_budget / 4u)'
          new = 'std::min(std::uint64_t{256} * mebibyte, texture_gpu_budget / 4u)'
          if old not in text:
              raise SystemExit('expected expression not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-fix-renderer-budget.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/render/src/common/renderer.cpp .github/workflows/temporary-fix-renderer-budget.yml
          git commit -m 'Fix remaining renderer budget type mismatch'
          git push origin HEAD:fix/clang-format-main-20260830
