name: Temporary Main Formatting Fix

on:
  push:
    branches:
      - fix/main-formatting-20260905

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/main-formatting-20260905
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Apply repository formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find engine editor/native samples tools benchmarks tests -type f \( \
            -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o \
            -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' -o \
            -name '*.inl' -o -name '*.ixx' -o -name '*.cppm' \
          \) ! -path 'engine/render-vulkan/src/builtin_shaders.h' -print)
          clang-format-18 -i -- "${files[@]}"
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Apply clang-format fixes'
          git push origin HEAD:fix/main-formatting-20260905
