name: Apply toolbar dropdown wiring

on:
  push:
    branches:
      - fix/toolbar-platform-build-sizing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/toolbar-platform-build-sizing
          fetch-depth: 0

      - name: Wire dropdown selections to viewport settings
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('editor/src/renderer/src/app/Workbench.tsx')
          text = path.read_text()

          text, count = re.subn(
              r"const translationSnapOptions = \[0\.05, 0\.1, 0\.25, 0\.5, 1\] as const;\n"
              r"const rotationSnapOptions = \[5, 10, 15, 30, 45, 90\] as const;\n"
              r"const scaleSnapOptions = \[0\.05, 0\.1, 0\.25, 0\.5\] as const;\n",
              "",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('snap option constants block not found')

          text, count = re.subn(
              r"\s*onToggleCoordinateSpace=\{\(\) =>\s*void updateViewportToolOptions\(coordinateSpace === 'world' \? 'local' : 'world', snapping\)\s*\}",
              "\n          onCoordinateSpaceChange={(space) => void updateViewportToolOptions(space, snapping)}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('coordinate-space callback not found')

          start = text.find('          onCycleTranslationSnap={() =>')
          end_marker = '          }\n        />'
          if start < 0:
              raise SystemExit('snap cycle callback block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('snap cycle callback block end not found')
          replacement = """          onTranslationSnapChange={(value) =>
            void updateViewportToolOptions(coordinateSpace, snapping, value, rotationSnap, scaleSnap)
          }
          onRotationSnapChange={(value) =>
            void updateViewportToolOptions(coordinateSpace, snapping, translationSnap, value, scaleSnap)
          }
          onScaleSnapChange={(value) =>
            void updateViewportToolOptions(coordinateSpace, snapping, translationSnap, rotationSnap, value)
          }
"""
          text = text[:start] + replacement + text[end + len('          }\n'):]

          path.write_text(text)

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Validate editor toolbar
        working-directory: editor
        run: |
          npm run typecheck
          npx vitest run src/renderer/src/layout/MainToolbar.test.tsx src/renderer/src/ui/UiDropdown.test.tsx

      - name: Commit dropdown wiring and remove helper workflow
        run: |
          rm .github/workflows/temp-apply-toolbar-dropdowns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/app/Workbench.tsx .github/workflows/temp-apply-toolbar-dropdowns.yml
          git commit -m "Wire scene toolbar dropdown selections"
          git push origin HEAD:fix/toolbar-platform-build-sizing
