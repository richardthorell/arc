name: Format M2.5 changes

on:
  push:
    branches:
      - m2/virtual-geometry-budget-hardening

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message != 'Apply automated formatting fixes'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m2/virtual-geometry-budget-hardening
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Format changed C++ files
        run: |
          clang-format-18 -i \
            engine/render/inc/arc/render/virtual_geometry.h \
            engine/render/inc/arc/render/virtual_geometry_streaming_io.h \
            engine/render/src/common/virtual_geometry.cpp \
            engine/render/src/common/virtual_geometry_streaming_io.cpp \
            engine/render/tests/virtual_geometry_budget_tests.cpp
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m2-5-format.yml
          git add engine/render
          git commit -m "Apply automated formatting fixes"
          git push origin HEAD:m2/virtual-geometry-budget-hardening
