name: Complete 352

on:
  push:
    branches:
      - assets/352-complete-virtual-views

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install Dependencies
        run: npm ci --prefix editor
      - name: Apply Integration
        run: python tools/tmp_complete_352.py
      - name: Fix Action Narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('editor/src/renderer/src/content/ContentBrowserPanel.tsx')
          text = path.read_text()
          old = """  const removeFromActiveVirtualView = (asset: AssetItem) => {
            if (!activeVirtualView || (activeVirtualView.kind !== 'favorites' && activeVirtualView.kind !== 'downloads')) return;
            setVirtualViews((current) => removeAssetFromVirtualCollection(current, activeVirtualView.kind, asset.id));
          };"""
          new = """  const removeFromActiveVirtualView = (asset: AssetItem) => {
            if (!activeVirtualView || (activeVirtualView.kind !== 'favorites' && activeVirtualView.kind !== 'downloads')) return;
            const kind = activeVirtualView.kind;
            setVirtualViews((current) => removeAssetFromVirtualCollection(current, kind, asset.id));
          };"""
          if old not in text:
              raise SystemExit('narrowing anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: npm run format --prefix editor -- --write src/renderer/src/content/ContentBrowserPanel.tsx src/renderer/src/content/ContentBrowserPanel.test.tsx src/renderer/src/content/ContentAssetCard.tsx src/renderer/src/content/RemoteAssetBrowser.tsx src/renderer/src/content/RemoteAssetBrowser.test.tsx src/renderer/src/content/assetVirtualViewIntegration.ts src/renderer/src/content/assetVirtualViewIntegration.test.ts
      - name: Typecheck
        run: npm run typecheck --prefix editor
      - name: Test
        run: npm test --prefix editor -- --run src/renderer/src/content/assetVirtualViewIntegration.test.ts src/renderer/src/content/ContentBrowserPanel.test.tsx src/renderer/src/content/RemoteAssetBrowser.test.tsx
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-352-complete.yml .github/workflows/tmp-352-run.yml tools/tmp_complete_352.py
          git add editor/src/renderer/src/content
          git commit -m "Complete asset library virtual views"
          git push origin HEAD:${GITHUB_REF_NAME}
