name: Temporary Add Component picker patch

on:
  push:
    branches:
      - fix/ui-lab-asset-card-stage-width

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run temporary Add Component patch helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-lab-asset-card-stage-width
      - name: Apply picker patch
        run: python3 .github/scripts/tmp_apply_add_component_picker.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/renderer/src/inspector/InspectorPanel.tsx editor/src/renderer/src/inspector/componentSchemas.ts
          git commit -m "Improve Add Component picker"
          git push origin HEAD:fix/ui-lab-asset-card-stage-width
