name: Temp Main Build Format

on:
  push:
    branches:
      - fix/main-build-2026-09-03

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-build-2026-09-03
          fetch-depth: 0
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Format failing native sources
        run: |
          clang-format-18 -i \
            editor/native/tests/editor_tests.cpp \
            engine/render/inc/arc/render/events.h \
            engine/render/inc/arc/render/gpu_driven.h \
            engine/render/src/common/gpu_driven.cpp \
            engine/render/src/common/renderer.cpp \
            engine/render/tests/render_tests.cpp \
            engine/render-vulkan/src/vulkan_backend.cpp
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/native/tests/editor_tests.cpp engine/render/inc/arc/render/events.h engine/render/inc/arc/render/gpu_driven.h engine/render/src/common/gpu_driven.cpp engine/render/src/common/renderer.cpp engine/render/tests/render_tests.cpp engine/render-vulkan/src/vulkan_backend.cpp
          if ! git diff --cached --quiet; then
            git commit -m "Fix main clang-format failures"
            git push origin HEAD:fix/main-build-2026-09-03
          fi
