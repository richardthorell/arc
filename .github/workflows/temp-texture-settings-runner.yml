name: Temporary Texture Settings Runner
on:
  push:
    branches: [feat/texture-settings-foundation]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/texture-settings-foundation
          fetch-depth: 0
      - name: Extract and run implementation
        run: |
          python3 -c "from pathlib import Path; t=Path('.github/workflows/temp-texture-settings-stage1.yml').read_text(); b=t.split(\"python3 <<'PY'\\n\",1)[1].split('\\n          PY',1)[0]; Path('/tmp/impl.py').write_text('\\n'.join((x[10:] if x.startswith('          ') else x) for x in b.splitlines()))"
          python3 /tmp/impl.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('editor/src/renderer/src/texture/TextureEditor.tsx')
          text = path.read_text()
          old = """    if (!asset.guid || asset.readOnly) {\n      setSettings(null);\n      return;\n    }"""
          new = """    if (!asset.guid || asset.readOnly) {\n      setSettings(null);\n      setSettingsError(asset.readOnly ? 'Read-only texture' : 'Settings unavailable');\n      return;\n    }"""
          if old not in text:
              raise SystemExit('read-only texture settings marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed files
        run: |
          clang-format -i engine/render-tools/inc/arc/render_tools/texture_cooker.h engine/render-tools/src/common/texture_cooker.cpp engine/render-tools/tests/texture_cooker_tests.cpp editor/native/inc/arc/editor/host_protocol_base.h editor/native/src/host_protocol_base.inc editor/native/src/arc_host_base.inc
          cd editor
          npx --yes prettier@3.9.6 --write src/renderer/src/texture/TextureEditor.tsx src/renderer/src/texture/textureSettings.ts src/renderer/src/texture/textureEditor.css
      - name: Build targeted native tests
        run: |
          cmake --preset editor-no-vulkan -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset editor-no-vulkan --target arc_render_tools_tests arc-editor-host -j2
          ctest --test-dir out/build/editor-no-vulkan -R arc_render_tools_tests --output-on-failure
      - name: Run texture editor tests
        run: |
          cd editor
          npm ci
          npm test -- --run src/renderer/src/texture/TextureEditor.test.tsx src/renderer/src/editors/textureEditorRegistration.test.ts
      - name: Commit implementation
        if: success()
        run: |
          rm .github/workflows/temp-texture-settings-stage1.yml .github/workflows/temp-texture-settings-runner.yml .github/temp-texture-settings-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add texture settings foundation"
          git push origin HEAD:feat/texture-settings-foundation
