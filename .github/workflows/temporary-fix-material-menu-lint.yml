name: Temporary material menu lint fix

on:
  push:
    branches:
      - fix/material-node-menu-cascade

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/material-node-menu-cascade
          fetch-depth: 0
      - name: Remove obsolete material menu selectors
        run: python3 .github/scripts/temp_fix_material_menu_lint.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Verify editor validation
        working-directory: editor
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- src/renderer/src/material/MaterialGraphEditor.test.tsx
      - name: Remove temporary helpers
        run: |
          rm .github/workflows/temporary-fix-material-menu-lint.yml
          rm .github/scripts/temp_fix_material_menu_lint.py
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix material node menu validation errors"
          git push
